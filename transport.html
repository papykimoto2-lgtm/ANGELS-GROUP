"use strict";
const KEY="angels_transport_v3";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10);
const fd=d=>d?new Date(d.length>10?d:d+"T00:00:00Z").toLocaleDateString("fr-FR",{timeZone:"UTC"}):"—";
const fdt=t=>t?new Date(t).toLocaleString("fr-FR",{timeZone:"UTC"}):"—";
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const addMonths=(d,n)=>{const[y,m,j]=d.split("-").map(Number),l=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+n,Math.min(j,l))).toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const daysTo=d=>d?diffDays(d,today()):null;

 const R={},set=(r,o)=>{R[r]={};Object.keys(MODS).forEach(m=>R[r][m]=(o[m]||"").split(""))};

 set("caissier",{vehicules:"v",chauffeurs:"v",contrats:"v",echeances:"vp",encaissements:"vcea",recus:"vp",caisse:"vce",depenses:"vc",tiers:"v"});
 set("comptable",{vehicules:"v",chauffeurs:"v",contrats:"v",echeances:"vp",encaissements:"v",recus:"vp",caisse:"vp",depenses:"vceap",compta:"vceap",plan:"vcexp",tiers:"vp",etats:"vp",maintenance:"v",entretien:"v",pieces:"vp",agenda:"v",documents:"v",rapports:"vp"});
 set("controleur",Object.fromEntries(Object.keys(MODS).filter(m=>m!=="portail").map(m=>[m,"vp"])));
 set("chauffeur",{portail:"v"});
 return R;
}
const can=(m,a="v")=>!!ME&&((S.perms[ME.role]||{})[m]||[]).includes(a);
const needAny=(m,acts,msg)=>{if(!acts.some(a=>can(m,a)))throw new Error(msg||"Droits insuffisants ("+MODS[m]+").")};
const need=(m,a,msg)=>{if(!can(m,a))throw new Error(msg||"Droits insuffisants ("+MODS[m]+" : "+ACT[a]+").")};

/* ---------- Persistance, audit, transactions ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){throw new Error("Stockage plein : données non enregistrées. Un backend est requis.")}};
const audit=(a,d)=>{S.audit.unshift({t:now(),u:ME?ME.nom:"système",r:ME?ME.role:"",a,d:d||""});if(S.audit.length>2000)S.audit.length=2000};
function atomic(fn,quiet){
 const snap=JSON.stringify(S),me=ME&&ME.id;
 try{const r=fn();recomputeLettrage();save();return r===undefined?true:r}
 catch(e){S=JSON.parse(snap);fichiersNettoyer();if(me)ME=by(S.users,me)||null;if(!quiet)alert(e.message);return false}
}
const seq=(k,pref)=>{S.seq[k]=(S.seq[k]||0)+1;const f=S.fmt[k]||pref;return f+"-"+new Date().getFullYear()+"-"+String(S.seq[k]).padStart(5,"0")};

function dotationsAuto(dry){ // linéaire mensuel, mois révolus, un mois à la fois, s'arrête à une période clôturée ; dry : liste sans écrire

 S.vehicles.forEach(v=>{if(!v.immo_ecr||!(v.valeur_acq>0))return;

  for(;m<per(today());m=monthNext(m)){

 if(cs.statut!=="cloturee"||cs.reel==null)return;
 const net=sum(S.cash_mv.filter(x=>x.session_id===cs.id&&x.statut==="a_valider"),x=>x.sens==="entree"?x.montant:-x.montant),th=soldeTheo(cs)+net,ec=cs.reel-th;
 if(th===cs.theorique&&ec===cs.ecart)return;
 (cs.recalculs=cs.recalculs||[]).push({t:now(),par:ME?ME.nom:"système",raison,avant:{theorique:cs.theorique,ecart:cs.ecart},apres:{theorique:th,ecart:ec}});
 if(cs.ecart_regul&&cs.ecart){cs.alerte_apres_cloture=true;audit("Écart de caisse à revoir","Session "+cs.id+" déjà régularisée : "+raison);return}
 cs.theorique=th;cs.ecart=ec;cs.ecart_regul=ec===0;cs.recalcule=true;audit("Clôture de caisse recalculée",raison+" — nouvel écart "+fcfa(ec));
}
/* Clôture encadrée : par un tiers (≠ ouvreur) ou tardive → motif + marque administrative ; une clôture existante n'est jamais écrasée */
function cxEncadree(cs){const ouv=cs.ouverte_par_id&&by(S.users,cs.ouverte_par_id);return{tiers:!!ouv&&!!ME&&ouv.id!==ME.id,tardive:(Date.now()-new Date(cs.ouverte_le).getTime())>(+stv("cx_delai_tardif_h")||24)*36e5}}
function cloturerCaisse(reel,expl,cid,o){
 o=o||{};need("caisse","e");
 if(o.session_id){const x=by(S.cash_sessions,o.session_id);if(x&&x.statut==="cloturee")throw new Error("Session déjà clôturée le "+fdt(x.cloturee_le)+" par "+x.cloturee_par+" : une clôture existante n'est jamais écrasée (rouvrir avec motif si nécessaire).")}
 const cs=o.session_id?by(S.cash_sessions,o.session_id):openSession(cid);if(!cs||cs.statut!=="ouverte")throw new Error("Aucune caisse ouverte.");
 if(!(reel>=0))throw new Error("Montant compté invalide.");
 const pend=S.cash_mv.filter(m=>m.session_id===cs.id&&m.statut==="a_valider"),net=sum(pend,m=>m.sens==="entree"?m.montant:-m.montant);
 if(pend.length&&String(o.precision||"").trim().length<5)throw new Error(pend.length+" bon(s) en attente de validation ("+fcfa(sum(pend,m=>m.montant))+") : précisez leur situation (ex. remise en cours de dépôt) avant de clôturer.");
 const thv=soldeTheo(cs),th=thv+net,ec=reel-th;
 if(Math.abs(ec)>cxTol()&&!String(expl||"").trim())throw new Error("Écart de "+fcfa(ec)+" : explication obligatoire.");
 const enc=cxEncadree(cs);
 if((enc.tiers||enc.tardive)&&String(o.motif||"").trim().length<5)throw new Error("Clôture "+(enc.tiers&&enc.tardive?"par un tiers et tardive":enc.tiers?"par un tiers (caisse ouverte par "+cs.ouverte_par+")":"tardive (ouverte depuis plus de "+stv("cx_delai_tardif_h")+" h)")+" : motif obligatoire.");
 ["admin","en_attente","precision_attente","recalcule","recalculs","apres_cloture","alerte_apres_cloture"].forEach(k=>delete cs[k]);
 Object.assign(cs,{statut:"cloturee",theorique:th,theorique_valide:thv,net_attente:net,reel,ecart:ec,explication:expl||"",cloturee_le:now(),cloturee_par:ME.nom,cloturee_par_id:ME.id,ecart_regul:ec===0});
 if(pend.length){cs.en_attente=pend.map(m=>m.id);cs.precision_attente=String(o.precision).trim()}
 if(enc.tiers||enc.tardive)cs.admin={...enc,motif:String(o.motif).trim(),par:ME.nom,t:now()};
 audit("Caisse clôturée","théorique "+fcfa(th)+", compté "+fcfa(reel)+", écart "+fcfa(ec)+(pend.length?" ("+pend.length+" bon(s) en attente)":"")+(cs.admin?" — clôture encadrée : "+cs.admin.motif:""));
}
function regulariserEcart(csid,note){

/* ---------- Rapprochement de caisse : écart cumulé par caisse, ruptures de chaîne ---------- */
function cxRapprochement(){
 return S.caisses.map(c=>{const ss=S.cash_sessions.filter(s=>s.caisse_id===c.id&&!s.technique),cl=ss.filter(s=>s.statut==="cloturee"),ruptures=[];
  for(let i=1;i<ss.length;i++){const p=ss[i-1],n=ss[i];if(p.statut==="cloturee"&&p.reel!=null&&n.fond!==p.reel)ruptures.push({de:p.id,vers:n.id,date:n.ouverte_le,attendu:p.reel,constate:n.fond,ecart:n.fond-p.reel,motif:(n.rupture||{}).motif||""})}
  return{caisse:c,sessions:ss.length,cloturees:cl.length,ecart_cumule:sum(cl,s=>s.ecart||0),regule:sum(cl.filter(s=>s.ecart_regul),s=>s.ecart||0),non_regule:sum(cl.filter(s=>!s.ecart_regul),s=>s.ecart||0),ruptures,rupture_total:sum(ruptures,r=>r.ecart)}});
}
/* ---------- Lettrage des comptes tiers (411 / 401 / … : comptes de type « Tiers ») ---------- */
const cptsTiers=()=>S.accounts.filter(a=>a.type==="Tiers").map(a=>a.num).sort();
function lignesTiers(compte,tid){const R=[];S.entries.forEach(e=>e.lines.forEach((l,i)=>{if(l.compte===compte&&(tid===undefined||tid===null||(l.tiers||"")===tid))R.push({e,l,i,ref:e.id+":"+i})}));return R}
const nonLettres=(compte,tid)=>lignesTiers(compte,tid).filter(x=>!x.l.lettre);
const lettreRef=ref=>{const[id,i]=String(ref).split(":"),e=by(S.entries,id),l=e&&e.lines[+i];if(!l)throw new Error("Ligne d'écriture introuvable.");return{e,l}};
function lettrerManuel(refs){
 need("compta","e");const ls=[...new Set(refs||[])].map(lettreRef);if(ls.length<2)throw new Error("Sélectionnez au moins deux lignes à lettrer.");
 const c=ls[0].l.compte,t=ls[0].l.tiers||"";if(ls.some(x=>x.l.compte!==c||(x.l.tiers||"")!==t))throw new Error("Lettrage impossible : les lignes doivent appartenir au même compte et au même tiers.");
 if(!by(S.accounts,c,"num")||by(S.accounts,c,"num").type!=="Tiers")throw new Error("Le lettrage s'applique aux comptes de tiers.");
 if(ls.some(x=>x.l.lettre))throw new Error("Une des lignes est déjà lettrée.");
 const d=sum(ls,x=>x.l.debit),k=sum(ls,x=>x.l.credit);if(d!==k||d<=0)throw new Error("Lettrage impossible : débit "+fcfa(d)+" ≠ crédit "+fcfa(k)+" (écart "+fcfa(d-k)+").");
 S.seq.lettrage=(S.seq.lettrage||0)+1;const code="LM"+String(S.seq.lettrage).padStart(5,"0");
 ls.forEach(x=>{x.l.lettre=code;x.l.lm=true;x.l.lettre_le=today()});audit("Lettrage manuel",code+" · compte "+c+" · "+fcfa(d));return code;
}
function delettrer(code,motif){
 need("compta","a");if(!/^L[MA]\d+$/.test(String(code)))throw new Error("Seuls les lettrages manuels ou automatiques de la comptabilité se délettrent (les lettrages d'échéances suivent les encaissements).");
 if(String(motif||"").trim().length<3)throw new Error("Motif obligatoire.");
 const ls=S.entries.flatMap(e=>e.lines.filter(l=>l.lettre===code&&l.lm));if(!ls.length)throw new Error("Lettrage introuvable.");
 ls.forEach(l=>{l.lettre=null;l.lm=false;delete l.lettre_le});audit("Lettrage supprimé",code+" — "+String(motif).trim());return ls.length;

function lettrageAuto(compte){
 need("compta","e");const comptes=compte?[compte]:cptsTiers();let n=0;
 comptes.forEach(c=>{const grp={};nonLettres(c).forEach(x=>{if(x.l.ob||x.l.alloc)return; // lettrage des échéances géré par les encaissements
   (grp[x.l.tiers||""]=grp[x.l.tiers||""]||[]).push(x)});
  Object.values(grp).forEach(L=>{L.sort((a,b)=>a.e.date.localeCompare(b.e.date)||a.e.numero.localeCompare(b.e.numero));
   const D=L.filter(x=>x.l.debit),K=L.filter(x=>x.l.credit),used=new Set(),lot=(xs)=>{S.seq.lettrage=(S.seq.lettrage||0)+1;const code="LA"+String(S.seq.lettrage).padStart(5,"0");xs.forEach(x=>{x.l.lettre=code;x.l.lm=true;x.l.lettre_le=today();used.add(x)});n+=xs.length};
   D.forEach(d=>{if(used.has(d))return;const k=K.find(x=>!used.has(x)&&x.l.credit===d.l.debit);if(k)lot([d,k])});
   const R=L.filter(x=>!used.has(x));if(R.length>=2&&sum(R,x=>x.l.debit)===sum(R,x=>x.l.credit)&&sum(R,x=>x.l.debit)>0)lot(R)})});
 audit("Lettrage automatique",(compte||"tous comptes de tiers")+" : "+n+" ligne(s)");return n;
}
function etatNonLettres(compte){
 const R=[];(compte?[compte]:cptsTiers()).forEach(c=>{const g={};nonLettres(c).forEach(x=>{const k=x.l.tiers||"";const o=g[k]=g[k]||{compte:c,tiers:k,nb:0,debit:0,credit:0};o.nb++;o.debit+=x.l.debit||0;o.credit+=x.l.credit||0});
  Object.values(g).forEach(o=>R.push({...o,solde:o.debit-o.credit,nom:o.tiers?(tiersDe(o.tiers).nom||o.tiers):"(sans tiers)"}))});return R;

/* ---------- Rapprochement bancaire ---------- */
const bkComptes=()=>[...new Set([cdef("treso_banque"),cdef("treso_mobile")])];
const bkLignes=()=>{const cs=bkComptes(),R=[];S.entries.forEach(e=>e.lines.forEach((l,i)=>{if(cs.includes(l.compte))R.push({e,l,i,ref:e.id+":"+i,v:(l.debit||0)-(l.credit||0)})}));return R};
function bkDate(s){s=String(s||"").trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):null}
const bkMt=s=>{s=String(s==null?"":s).replace(/[\s  ]|F(CFA)?$/gi,"").replace(",",".");if(s==="")return null;const v=Number(s);return Number.isFinite(v)?Math.round(v):null};
function releveParse(txt){
 const L=String(txt||"").replace(/^﻿/,"").split(/\r?\n/).filter(x=>x.trim());if(!L.length)throw new Error("Relevé vide.");
 const sep=[";","\t",","].map(c=>[c,L[0].split(c).length]).sort((a,b)=>b[1]-a[1])[0][0],R=[],dc=!bkDate(L[0].split(sep)[0])&&/d[ée]bit/i.test(L[0])&&/cr[ée]dit/i.test(L[0]);
 L.forEach((ln,n)=>{const c=ln.split(sep).map(x=>x.replace(/^"|"$/g,"").trim());if(n===0&&!bkDate(c[0]))return; // en-tête
  const d=bkDate(c[0]);if(!d)throw new Error("Ligne "+(n+1)+" : date invalide « "+c[0]+" ».");
  let mt,ref="";
  if(dc){mt=(bkMt(c[3])||0)-(bkMt(c[2])||0);ref=c[4]||""} // colonnes débit / crédit : le crédit entre en banque, le débit en sort
  else{mt=bkMt(c[2]);ref=c[3]||""}
  if(mt===null||!mt)throw new Error("Ligne "+(n+1)+" : montant invalide.");
  R.push({date:d,libelle:c[1]||"",montant:mt,ref})});
 return R;
}
function releveImporter(txt){

 rows.forEach(r=>{const k=key(r);if(have[k]>0){have[k]--;ignores++;return}S.releve.push({id:uid("rl"),...r,pointe:null,t:now(),par:ME.nom});ajoutes++});

}

/* ---------- Clôture d'exercice (année civile), à-nouveaux, FEC ---------- */
const exoDe=a=>by(S.exercices,String(a),"annee"),exoClos=a=>{const x=exoDe(a);return!!x&&x.statut==="cloture"};
function exoSoldes(a){const R={};S.entries.forEach(e=>{if(e.date<a+"-01-01"||e.date>a+"-12-31")return;e.lines.forEach(l=>{if(l.compte[0]==="6"||l.compte[0]==="7")R[l.compte]=(R[l.compte]||0)+(l.debit||0)-(l.credit||0)})});return R}
function exoBilan(a){const R={};S.entries.forEach(e=>{if(e.date>a+"-12-31")return;e.lines.forEach(l=>{if(l.compte[0]>="1"&&l.compte[0]<="5")R[l.compte]=(R[l.compte]||0)+(l.debit||0)-(l.credit||0)})});
 return Object.entries(R).filter(x=>x[1]).sort().map(([c,v])=>v>0?{compte:c,debit:v}:{compte:c,credit:-v})}
function cloturerExercice(a){
 need("compta","a");a=String(a);if(!/^\d{4}$/.test(a))throw new Error("Exercice invalide.");
 if(exoClos(a))throw new Error("Exercice "+a+" déjà clôturé.");if(a>today().slice(0,4))throw new Error("L'exercice "+a+" n'a pas commencé.");
 const ant=[...new Set(S.entries.map(e=>e.date.slice(0,4)))].filter(y=>y<a&&!exoClos(y)).sort();if(ant.length)throw new Error("Clôturer d'abord l'exercice "+ant[0]+".");
 if(S.brouillard.some(b=>b.date.slice(0,4)===a))throw new Error("Des écritures en brouillard de "+a+" restent à viser ou à supprimer.");
 if(S.cash_sessions.some(s=>s.statut==="ouverte"&&s.ouverte_le.slice(0,4)===a))throw new Error("Une caisse ouverte en "+a+" doit être clôturée.");
 if(S.expenses.some(x=>x.statut==="a_valider"&&x.date.slice(0,4)===a))throw new Error("Des dépenses de "+a+" attendent validation.");
 const mois=Array.from({length:12},(_,i)=>a+"-"+String(i+1).padStart(2,"0"));
 mois.forEach(m=>{if(!by(S.periods,m))S.periods.push({id:m,statut:"ouverte"})});
 const p12=by(S.periods,a+"-12"),was=p12.statut;p12.statut="ouverte";
 const R=exoSoldes(a),lines=[];Object.entries(R).sort().forEach(([c,v])=>{if(v>0)lines.push({compte:c,credit:v});else if(v<0)lines.push({compte:c,debit:-v})});
 let e=null,res=0;
 if(lines.length){const bal=sum(lines,l=>l.debit)-sum(lines,l=>l.credit);res=bal;
  if(bal>0)lines.push({compte:cdef("res_benef"),credit:bal});else if(bal<0)lines.push({compte:cdef("res_perte"),debit:-bal});
  e=postEntry({journal:"OD",date:a+"-12-31",libelle:"Clôture de l'exercice "+a+" — solde des comptes de gestion (résultat "+(res>=0?"bénéfice":"perte")+")",piece:"CLOT-"+a,source:{type:"cloture",annee:a,kind:"solde"},lines})}
 if(!e)p12.statut=was;
 mois.forEach(m=>by(S.periods,m).statut="cloturee");
 const an=exoBilan(a),d=sum(an,l=>l.debit),k=sum(an,l=>l.credit);if(d!==k)throw new Error("Bilan d'ouverture déséquilibré (débit "+fcfa(d)+" / crédit "+fcfa(k)+") : clôture annulée.");
 const x=exoDe(a)||(S.exercices.push({annee:a,reouvertures:[]}),exoDe(a));
 Object.assign(x,{statut:"cloture",cloture_le:now(),cloture_par:ME.nom,resultat:res,entry_solde:e?e.id:null,an:{date:(+a+1)+"-01-01",lines:an}});
 audit("Exercice clôturé",a+" — résultat "+fcfa(res));return x;
}

/* Fichier des écritures comptables (FEC) d'un exercice : écritures + à-nouveaux de l'ouverture */
function fecRows(a){
 a=String(a);const R=[],jl=Object.fromEntries(JOURNAUX),ymd=d=>d.replace(/-/g,""),mt=n=>n?String(n)+",00":"0,00",cl=x=>by(S.accounts,x,"num")||{};
 const prev=exoDe(+a-1);
 if(prev&&prev.statut==="cloture"&&prev.an)prev.an.lines.forEach((l,i)=>R.push(["AN",jl.AN||"À-nouveaux","AN-"+a+"-0001",ymd(prev.an.date),l.compte,cl(l.compte).nom||"","","","A-NOUVEAUX",ymd(prev.an.date),"Bilan d'ouverture "+a,mt(l.debit),mt(l.credit),"","",ymd(prev.an.date),"",""]));
 S.entries.filter(e=>e.date>=a+"-01-01"&&e.date<=a+"-12-31").sort((x,y)=>x.date.localeCompare(y.date)||x.numero.localeCompare(y.numero)).forEach(e=>e.lines.forEach(l=>{const t=l.tiers?tiersDe(l.tiers):{};
  R.push([e.journal,jl[e.journal]||e.journal,e.numero,ymd(e.date),l.compte,cl(l.compte).nom||"",t.aux||"",t.nom||"",e.piece||"",ymd(e.date),e.libelle,mt(l.debit),mt(l.credit),l.lettre||"",l.lettre_le?ymd(l.lettre_le):"",ymd(e.date),"",""])}));
 return R;

const FEC_COLS=["JournalCode","JournalLib","EcritureNum","EcritureDate","CompteNum","CompteLib","CompAuxNum","CompAuxLib","PieceRef","PieceDate","EcritureLib","Debit","Credit","EcritureLet","DateLet","ValidDate","Montantdevise","Idevise"];

/* ---------- Grand livre par intervalle, journaux filtrables, déclaration de TVA ---------- */
function buildGrandLivreIntervalle(c1,c2,d1,d2){
 const lo=String(c1||"").padEnd(8,"0"),hi=String(c2||"").padEnd(8,"9"),ys=yStart(d1||"0000-01-01");
 return S.accounts.filter(a=>{const n=a.num.padEnd(8,"0");return(!c1||n>=lo)&&(!c2||n<=hi)}).sort((x,y)=>x.num.localeCompare(y.num)).map(a=>{
  let rep=0,d=0,c=0;const L=[];
  S.entries.forEach(e=>e.lines.forEach(l=>{if(l.compte!==a.num)return;
   if(d1&&e.date<d1){if((a.num[0]==="6"||a.num[0]==="7")&&e.date<ys)return;rep+=(l.debit||0)-(l.credit||0)}
   else if(!d2||e.date<=d2){L.push({e,l});d+=l.debit||0;c+=l.credit||0}}));
  L.sort((x,y)=>x.e.date.localeCompare(y.e.date)||x.e.numero.localeCompare(y.e.numero));let run=rep;
  return{compte:a.num,nom:a.nom,report:rep,debit:d,credit:c,solde:rep+d-c,lignes:L.map(({e,l})=>{run+=(l.debit||0)-(l.credit||0);return{date:e.date,numero:e.numero,piece:e.piece,libelle:e.libelle,debit:l.debit||0,credit:l.credit||0,solde:run,lettre:l.lettre||""}})}}).filter(g=>g.report||g.lignes.length);
}
function journalFiltre(f){f=f||{};const q=String(f.q||"").toLowerCase(),mn=f.min===""||f.min==null?null:+f.min,mx=f.max===""||f.max==null?null:+f.max;
 return S.entries.filter(e=>{const t=sum(e.lines,l=>l.debit);return(!f.j||e.journal===f.j)&&(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to)&&(mn===null||t>=mn)&&(mx===null||t<=mx)&&(!q||(e.libelle+" "+e.piece+" "+e.numero).toLowerCase().includes(q))}).sort((x,y)=>x.date.localeCompare(y.date)||x.numero.localeCompare(y.numero))}
function declarationTVA(m){
 const t=tvaMois(m),ls=S.entries.filter(e=>e.date.startsWith(m)).flatMap(e=>e.lines),[y,mo]=m.split("-").map(Number),pm=new Date(Date.UTC(y,mo-2,1)).toISOString().slice(0,7);
 const ca=sum(ls.filter(l=>l.compte===cdef("produit")),l=>(l.credit||0)-(l.debit||0)),cred=Math.max(0,soldeA(cdef("tva_credit"),monthEnd(pm))),net=t.net,due=Math.max(0,net-cred),rep=Math.max(0,cred-net);
 return{mois:m,taux:tvaTaux(),ca_ht:ca,collectee:t.coll,deductible:t.ded,net,credit_anterieur:cred,a_payer:due,credit_a_reporter:rep,liquidee:!!t.liq};
}

function pieceEntree(f){
 need("pieces","c");const p=by(S.pieces,f.piece_id);if(!p)throw new Error("Pièce introuvable.");const q=+f.qte,mt=Math.round(+f.montant||0),date=f.date||today();if(!(q>0))throw new Error("Quantité invalide.");if(mt<0)throw new Error("Montant invalide.");if(date>today())throw new Error("Date dans le futur.");
 const mv=pieceMvt({piece_id:p.id,sens:"entree",qte:q,pu:mt/q,date,motif:"Achat"+(f.fournisseur?" — "+f.fournisseur:"")});
 if(mt>0){need("depenses","c","Droit de saisie de dépense requis pour enregistrer un achat de pièces.");const e=creerDepense({date,categorie:"Entretien et réparations",fournisseur:f.fournisseur||"",montant:mt,justificatif:f.justificatif||"",source:{type:"piece-achat",id:mv.id}});mv.expense_id=e.id}
 audit("Entrée de pièces",p.nom+" × "+nb(q,2));return mv;

function pieceAjuster(id,reel,motif){
 need("pieces","e");const p=by(S.pieces,id);if(!p)throw new Error("Pièce introuvable.");if(!String(motif||"").trim())throw new Error("Motif obligatoire.");const r=+reel;if(!(r>=0))throw new Error("Quantité comptée invalide.");
 const d=r-stockPiece(id);if(Math.abs(d)<1e-9)throw new Error("Aucun écart.");pieceMvt({piece_id:id,sens:d>0?"entree":"sortie",qte:Math.abs(d),pu:d>0?pmpPiece(id):0,motif:"Inventaire : "+motif,source:{type:"ajust"}});audit("Ajustement de pièces",p.nom+" "+nb(d,2));
}
function otPieces(id,lignes){

 m.pieces_prevues=(lignes||[]).filter(l=>l.piece_id&&+l.qte>0).map(l=>{const p=by(S.pieces,l.piece_id);if(!p)throw new Error("Pièce introuvable.");return{piece_id:p.id,qte:+l.qte}});audit("Pièces de l'ordre",m.numero+" : "+m.pieces_prevues.length+" ligne(s)");

 m.pieces_conso=L.map(l=>{const mv=pieceMvt({piece_id:l.piece_id,sens:"sortie",qte:l.qte,motif:"Ordre "+m.numero,source:{type:"maintenance",id:m.id}});return{piece_id:l.piece_id,qte:l.qte,pu:mv.pu}});m.pieces_cout=Math.round(sum(m.pieces_conso,x=>x.qte*x.pu));m.pieces=m.pieces||m.pieces_conso.map(x=>nb(x.qte,1)+" "+(by(S.pieces,x.piece_id)||{}).nom).join(", ");

/* ---------- GPS ---------- */
const lastPos=did=>{let b=null;for(const p of S.gps_pos)if(p.device_id===did&&(!b||p.t>b.t))b=p;return b};
function gpsEtat(dev){const l=lastPos(dev.id);if(!l)return["Aucune donnée","mu"];const m=(Date.now()-new Date(l.t))/6e4;return m<=S.settings.gps_actif_min?["Actif","ok"]:m<=S.settings.gps_ancien_min?["Données anciennes","wa"]:["Hors ligne","er"]}
const hav=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function ingestPos(ident,lat,lng,t,vit){
 const rej=r=>{S.gps_quar.unshift({t:now(),ident,lat,lng,tt:t,raison:r});S.gps_quar.length=Math.min(S.gps_quar.length,200);return{ok:false,raison:r}};
 const dev=by(S.gps_dev,ident,"ident");
 if(!dev)return rej("Dispositif inconnu");if(!dev.actif||!dev.vehicle_id)return rej("Dispositif inactif ou non associé");
 lat=Number(lat);lng=Number(lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return rej("Coordonnées invalides");
 const tm=new Date(t).getTime();if(!Number.isFinite(tm))return rej("Horodatage invalide");
 if(tm>Date.now()+3e5)return rej("Horodatage dans le futur");if(tm<Date.now()-7*864e5)return rej("Horodatage trop ancien");
 vit=Number(vit)||0;if(vit<0||vit>250)return rej("Vitesse aberrante");
 S.gps_pos.push({id:uid("gp"),device_id:dev.id,vehicle_id:dev.vehicle_id,lat,lng,vit,t:new Date(tm).toISOString(),recu:now()});
 if(S.geofences.length&&!S.geofences.some(z=>hav(lat,lng,z.lat,z.lng)<=z.rayon)){
  if(!S.gps_alerts.some(a=>a.vehicle_id===dev.vehicle_id&&a.type==="sortie_zone"&&Date.now()-new Date(a.t)<18e5))S.gps_alerts.unshift({id:uid("ga"),t:now(),vehicle_id:dev.vehicle_id,type:"sortie_zone",texte:"Sortie de zone autorisée"});
 }
 const lim=Date.now()-S.settings.gps_retention_jours*864e5;S.gps_pos=S.gps_pos.filter(p=>new Date(p.t).getTime()>=lim);
 return{ok:true};
}

function comptabiliserAttente(){ // idempotent : ne génère que les écritures manquantes (jamais de doublon, numérotation continue par journal)
 need("compta","a");
 const rep={ob:0,pay:0,exp:0,cash:0,immo:0,dot:0,erreurs:[]},EI=new Set(S.entries.map(e=>e.id)),err=(w,e)=>rep.erreurs.push(w+" : "+e.message);
 const done=new Set();S.entries.forEach(e=>e.lines.forEach(l=>{if(l.ob)done.add(l.ob)}));
 // échéances sans écriture, regroupées par date
 const P={};S.obligations.filter(o=>o.montant>0&&!done.has(o.id)).forEach(o=>(P[o.date_ech]=P[o.date_ech]||[]).push(o));
 Object.keys(P).sort().forEach(d=>{try{const pr=by(S.periods,per(d));if(pr&&pr.statut==="cloturee")throw new Error("période "+per(d)+" clôturée");
  const lines=[];P[d].forEach(o=>{const dr=by(S.drivers,o.driver_id);if(!dr)throw new Error("chauffeur introuvable");lines.push(...ventesLignes(dr.tiers_id,o,o.montant))});
  postEntry({journal:"VT",date:d,libelle:"Échéances du "+fd(d)+" (rattrapage)",piece:"ECH-"+d,source:{type:"echeances",date:d,rattrapage:true},lines});rep.ob+=P[d].length}catch(e){err("Échéances du "+d,e)}});
 // versements confirmés sans écriture
 S.payments.filter(p=>p.statut==="confirme"&&!(p.entry_id&&EI.has(p.entry_id))).forEach(p=>{try{
  const d=by(S.drivers,p.driver_id),rec=by(S.receipts,p.receipt_id)||{},esp=p.mode==="especes";
  let treso;if(esp){const mv=S.cash_mv.find(m=>m.source&&m.source.type==="receipt"&&m.source.id===rec.id);treso=cptCaisse(mv&&by(S.cash_sessions,mv.session_id))}else treso=p.mode==="mobile"?cdef("treso_mobile"):cdef("treso_banque");
  const lines=[{compte:treso,debit:p.montant}];
  if(p.type==="depot")lines.push({compte:cdef("depot"),tiers:d&&d.tiers_id,credit:p.montant});
  else S.allocs.filter(a=>a.payment_id===p.id&&a.actif).forEach(a=>{const o=by(S.obligations,a.obligation_id);lines.push({compte:cdef("client"),tiers:d&&d.tiers_id,credit:a.montant,ob:a.obligation_id,veh:o&&o.vehicle_id,alloc:a.id})});

 // dépenses validées sans écriture
 S.expenses.filter(x=>x.statut==="validee"&&!(x.entry_id&&EI.has(x.entry_id))).forEach(x=>{try{
  const esp=x.mode==="caisse",mv=esp&&S.cash_mv.find(m=>m.source&&m.source.type==="expense"&&m.source.id===x.id),tre=esp?cptCaisse(mv&&by(S.cash_sessions,mv.session_id)):cdef("treso_banque");
  const e=postEntry({journal:esp?"CAI":"BQ",date:x.date>today()?today():x.date,libelle:x.categorie+" — "+(x.fournisseur||x.numero)+" (rattrapage)",piece:x.numero,source:{type:"expense",id:x.id},lines:[...chargeLignes(x),{compte:tre,credit:x.montant}]});x.entry_id=e.id;rep.exp++}catch(e){err("Dépense "+x.numero,e)}});
 // bons de caisse validés sans écriture
 S.cash_mv.filter(m=>m.statut==="validee"&&m.numero&&!m.source&&!(m.entry_id&&EI.has(m.entry_id))).forEach(m=>{try{postSortie(m,true);if(m.entry_id)rep.cash++;else throw new Error("catégorie sans compte associé")}catch(e){err("Bon "+m.numero,e)}});
 // immobilisations, puis dotations dues
 S.vehicles.filter(v=>v.valeur_acq>0&&!v.immo_ecr).forEach(v=>{try{immoVehicule(v,{valeur_acq:0,date_service:""});if(v.immo_ecr)rep.immo++}catch(e){err("Immobilisation "+v.immat,e)}});
 try{rep.dot=dotationsAuto()}catch(e){err("Dotations",e)}

const FILES=new Map(),PEND=[];let IDBF=null;

function idbOuvrir(){return new Promise(ok=>{try{const r=indexedDB.open("angels_transport_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});r.onsuccess=()=>{IDBF=r.result;ok(IDBF)};r.onerror=r.onblocked=()=>ok(null)}catch(e){ok(null)}})}
function idbEcrire(id,data){if(!IDBF){PEND.push([id,data]);return Promise.resolve(false)}return new Promise(ok=>{try{const t=IDBF.transaction("f","readwrite");t.objectStore("f").put({id,data});t.oncomplete=()=>ok(true);t.onerror=t.onabort=()=>ok(false)}catch(e){ok(false)}})}

 while(PEND.length){const[id,d]=PEND.shift();await idbEcrire(id,d)}

 let m=false;for(const a of (S&&S.attachments)||[]){if(a.data){FILES.set(a.id,a.data);if(await idbEcrire(a.id,a.data)){delete a.data;m=true}}}

async function compresserImage(f,max){
 const url=URL.createObjectURL(f);
 try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error("Image illisible."));i.src=url});
  for(const[dim,q]of[[1600,.75],[1280,.65],[1000,.55],[760,.5]]){const k=Math.min(1,dim/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
   const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",q);if(d.length*3/4<=max)return d}
  throw new Error("Image trop volumineuse même après compression (max "+Math.round(max/1024)+" Ko).")}
 finally{URL.revokeObjectURL(url)}
}

  if(f.size>max||f.size>stv("pj_compress_ko")*1024){data=await compresserImage(f,max);type="image/jpeg"}}

function login(uidv,pin){
 const u=by(S.users,uidv);if(!u)return"Compte inconnu.";
 const t=S.tries[u.id]||{n:0,until:0};if(Date.now()<t.until)return"Compte bloqué "+stv("blocage_min")+" minute(s) (trop de tentatives).";
 if(!u.actif)return"Compte désactivé.";
 if(u.h===hashPin(u.id,pin)){ouvrirSession(u,false);return null}
 t.n++;if(t.n>=stv("tentatives_max")){t.until=Date.now()+stv("blocage_min")*6e4;t.n=0}S.tries[u.id]=t;try{save()}catch(e){}return"PIN incorrect.";
}

function setTheme(k){if(!THEMES.some(t=>t[0]===k))return;if(k===THEME_DEF)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=k;try{localStorage.setItem("angels_theme",k)}catch(e){}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--b").trim()}

/* ---------- PWA : installation, mise à jour, hors ligne ---------- */
let DEF=null,MAJ=false;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const installe=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaBtn=()=>installe()?"":(DEF||estIOS())?`<a data-a="pwa.inst">📲 Installer l'application</a>`:"";
A["pwa.inst"]=async()=>{if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()}else alert("Sur iPhone / iPad : ouvrir cette page dans Safari, toucher « Partager », puis « Sur l'écran d'accueil ».")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEF=e;if(!document.querySelector(".md"))render()});
window.addEventListener("appinstalled",()=>{DEF=null;render()});
function barre(){
 let b=$("#pwaBar");
 if(!MAJ&&navigator.onLine){if(b)b.remove();return}
 if(!b){b=document.createElement("div");b.id="pwaBar";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px;text-align:center;font-weight:600";document.body.appendChild(b)}
 if(MAJ){b.style.background="var(--b)";b.style.color="#fff";b.innerHTML="Nouvelle version disponible — <a href='#' id='pwaUp' style='color:#fff;text-decoration:underline'>recharger</a>";$("#pwaUp").onclick=ev=>{ev.preventDefault();location.reload()}}
 else{b.style.background="var(--wabg)";b.style.color="var(--wa)";b.textContent="Mode hors ligne — vos données restent enregistrées sur cet appareil"}
}
window.addEventListener("online",barre);window.addEventListener("offline",barre);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let avait=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(avait){MAJ=true;barre()}avait=true});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
barre();
load();
try{const id=sessionStorage.getItem("tr_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
fichiersCharger().then(()=>{if(S&&S.attachments.length&&!document.querySelector(".md"))render()});
