<script>
"use strict";
const KEY="angels_transport_v3";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10);
const fd=d=>d?new Date(d.length>10?d:d+"T00:00:00Z").toLocaleDateString("fr-FR",{timeZone:"UTC"}):"—";
const fdt=t=>t?new Date(t).toLocaleString("fr-FR",{timeZone:"UTC"}):"—";
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const addMonths=(d,n)=>{const[y,m,j]=d.split("-").map(Number),l=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+n,Math.min(j,l))).toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const daysTo=d=>d?diffDays(d,today()):null;
const by=(arr,id,k="id")=>arr.find(x=>x[k]===id);
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
let S=null,ME=null,view="dashboard";

/* ---------- Rôles & droits (v=consulter c=créer e=modifier a=valider x=annuler p=exporter) ---------- */
const ROLES={admin:"Administrateur général",directeur:"Directeur / propriétaire",flotte:"Gestionnaire de flotte",caissier:"Caissier",comptable:"Comptable",controleur:"Contrôleur",chauffeur:"Chauffeur"};
const MODS={vehicules:"Véhicules",chauffeurs:"Chauffeurs",contrats:"Contrats",planning:"Planning",echeances:"Échéances",encaissements:"Encaissements",recus:"Reçus",caisse:"Caisse",depenses:"Dépenses",compta:"Comptabilité",tiers:"Comptes tiers",etats:"États comptables",gps:"GPS",maintenance:"Maintenance",entretien:"Entretien préventif",pieces:"Pièces détachées",agenda:"Agenda atelier",sinistres:"Sinistres",documents:"Documents & alertes",rapports:"Rapports",users:"Utilisateurs & droits",audit:"Audit & paramètres",portail:"Portail chauffeur"};
const ACT={v:"Consulter",c:"Créer",e:"Modifier",a:"Valider",x:"Annuler",p:"Exporter"};
function defPerms(){
 const R={},set=(r,o)=>{R[r]={};Object.keys(MODS).forEach(m=>R[r][m]=(o[m]||"").split(""))};
 set("admin",{vehicules:"vcep",chauffeurs:"vcep",contrats:"vp",planning:"vp",echeances:"vp",encaissements:"v",recus:"vp",caisse:"v",depenses:"vp",compta:"vp",tiers:"vp",etats:"vp",gps:"vcexp",maintenance:"vp",entretien:"vp",pieces:"vp",agenda:"vp",sinistres:"vp",documents:"vcep",rapports:"vp",users:"vcexp",audit:"vpe"});
 set("directeur",{vehicules:"vap",chauffeurs:"vp",contrats:"vap",planning:"vap",echeances:"vp",encaissements:"vp",recus:"vpx",caisse:"vapx",depenses:"vap",compta:"vapx",tiers:"vp",etats:"vp",gps:"vp",maintenance:"vap",entretien:"vap",pieces:"vp",agenda:"vp",sinistres:"vp",documents:"vp",rapports:"vp",users:"v",audit:"vp"});
 set("flotte",{vehicules:"vcep",chauffeurs:"vcep",contrats:"vcep",planning:"vce",echeances:"v",recus:"v",depenses:"vc",gps:"vcep",maintenance:"vcepa",entretien:"vcexp",pieces:"vcep",agenda:"vp",sinistres:"vcep",documents:"vcep",rapports:"vp"});
 set("caissier",{vehicules:"v",chauffeurs:"v",contrats:"v",echeances:"vp",encaissements:"vcea",recus:"vp",caisse:"vce",depenses:"vc",tiers:"v"});
 set("comptable",{vehicules:"v",chauffeurs:"v",contrats:"v",echeances:"vp",encaissements:"v",recus:"vp",caisse:"vp",depenses:"vceap",compta:"vceap",tiers:"vp",etats:"vp",maintenance:"v",entretien:"v",pieces:"vp",agenda:"v",documents:"v",rapports:"vp"});
 set("controleur",Object.fromEntries(Object.keys(MODS).filter(m=>m!=="portail").map(m=>[m,"vp"])));
 set("chauffeur",{portail:"v"});
 return R;
}
const can=(m,a="v")=>!!ME&&((S.perms[ME.role]||{})[m]||[]).includes(a);
const needAny=(m,acts,msg)=>{if(!acts.some(a=>can(m,a)))throw new Error(msg||"Droits insuffisants ("+MODS[m]+").")};
const need=(m,a,msg)=>{if(!can(m,a))throw new Error(msg||"Droits insuffisants ("+MODS[m]+" : "+ACT[a]+").")};

/* ---------- Persistance, audit, transactions ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){throw new Error("Stockage plein : données non enregistrées. Un backend est requis.")}};
const audit=(a,d)=>{S.audit.unshift({t:now(),u:ME?ME.nom:"système",r:ME?ME.role:"",a,d:d||""});if(S.audit.length>2000)S.audit.length=2000};
function atomic(fn,quiet){
 const snap=JSON.stringify(S),me=ME&&ME.id;
 try{const r=fn();recomputeLettrage();save();return r===undefined?true:r}
 catch(e){S=JSON.parse(snap);fichiersNettoyer();if(me)ME=by(S.users,me)||null;if(!quiet)alert(e.message);return false}
}
const seq=(k,pref)=>{S.seq[k]=(S.seq[k]||0)+1;const f=S.fmt[k]||pref;return f+"-"+new Date().getFullYear()+"-"+String(S.seq[k]).padStart(5,"0")};

/* ---------- Comptabilité (partie double, périodes, extourne, lettrage) ---------- */
const PLAN=[["101","Capital social","Passif"],["121","Report à nouveau créditeur","Passif"],["129","Report à nouveau débiteur","Passif"],["165","Dépôts et cautionnements reçus","Passif"],["245","Matériel de transport","Actif"],["401","Fournisseurs","Tiers"],["411","Clients (chauffeurs)","Tiers"],["521","Banques et mobile money","Trésorerie"],["571","Caisse","Trésorerie"],["604","Achats de matières et fournitures consommables (carburant)","Charge"],["624","Entretien, réparations et maintenance","Charge"],["638","Autres charges externes","Charge"],["462","Associés, comptes courants","Passif"],["572","Caisse succursale A","Trésorerie"],["573","Caisse succursale B","Trésorerie"],["658","Charges diverses (amendes, pénalités)","Charge"],["758","Produits divers","Produit"],["706","Services vendus (recettes et loyers)","Produit"],["481","Fournisseurs d'investissements","Tiers"],["4431","TVA facturée sur ventes","Passif"],["4441","État, TVA due","Passif"],["4449","État, crédit de TVA à reporter","Actif"],["4452","TVA récupérable sur achats","Actif"],["681","Dotations aux amortissements","Charge"],["2845","Amortissements du matériel de transport","Actif"]];
const JOURNAUX=[["VT","Produits (recettes et loyers)"],["CAI","Caisse"],["BQ","Banque / Mobile Money"],["AC","Achats et charges"],["OD","Opérations diverses"],["AN","À-nouveaux"]];
const CATS={"Carburant":"604","Entretien et réparations":"624","Amendes et pénalités":"658","Frais divers":"638"}; // libellés ; les comptes viennent des comptes par défaut
const DEF_CPT={
 client:["Clients — chauffeurs","411","Tiers"],produit:["Produit — recettes et loyers","706","Produit"],depot:["Dépôts de garantie reçus","165","Passif"],
 treso_banque:["Trésorerie — Banque","521","Trésorerie"],treso_mobile:["Trésorerie — Mobile Money","521","Trésorerie"],treso_caisse:["Trésorerie — Caisse (compte par défaut)","571","Trésorerie"],
 fournisseur:["Fournisseurs","401","Tiers"],apport:["Compte courant associé (apports)","462","Passif"],produit_div:["Produits divers","758","Produit"],
 tva_coll:["TVA facturée (collectée)","4431","Passif"],tva_ded:["TVA récupérable","4452","Actif"],tva_due:["État — TVA due","4441","Passif"],tva_credit:["État — crédit de TVA à reporter","4449","Actif"],
 c_carburant:["Charge — carburant","604","Charge"],c_entretien:["Charge — entretien et réparations","624","Charge"],c_amende:["Charge — amendes et pénalités","658","Charge"],c_frais:["Charge — frais divers","638","Charge"],
 ecart_manquant:["Écart de caisse — manquant (charge)","658","Charge"],ecart_excedent:["Écart de caisse — excédent (produit)","758","Produit"],
 immo:["Immobilisations — véhicules","245","Actif"],amort_dot:["Amortissements — dotation (charge)","681","Charge"],amort_cumul:["Amortissements — cumul véhicules","2845","Actif"],immo_contre:["Contrepartie d'acquisition (fournisseurs d'investissements)","481","Tiers"]};

function immoVehicule(v,prev){

 v.valeur_acq=val;v.date_service=d;v.immo_ecr=e.id;v.amort_cumul=0;audit("Immobilisation comptabilisée",v.immat+" "+fcfa(val));

function dotationsAuto(){ // linéaire mensuel, mois révolus, un mois à la fois, s'arrête à une période clôturée
 let n=0;
 S.vehicles.forEach(v=>{if(!v.immo_ecr||!(v.valeur_acq>0))return;
  const duree=+v.duree_amort||S.settings.amort_duree||5,men=Math.round(v.valeur_acq/(duree*12));
  let m=v.amort_jusqu?monthNext(v.amort_jusqu):per(v.date_service);
  for(;m<per(today());m=monthNext(m)){
   const dot=Math.min(men,v.valeur_acq-(v.amort_cumul||0));if(dot<=0)break;
   const p=by(S.periods,m);if(p&&p.statut==="cloturee")break;
   postEntry({journal:"OD",date:monthEnd(m),libelle:"Dotation aux amortissements "+m+" — "+v.immat,piece:"AMORT-"+v.immat+"-"+m,source:{type:"amort",id:v.id,mois:m},lines:[{compte:cdef("amort_dot"),debit:dot,veh:v.id},{compte:cdef("amort_cumul"),credit:dot,veh:v.id}]});
   v.amort_cumul=(v.amort_cumul||0)+dot;v.amort_jusqu=m;n++}});
 return n}
function tvaMois(m){const ls=S.entries.filter(e=>e.date.startsWith(m)).flatMap(e=>e.lines);
 const coll=sum(ls.filter(l=>l.compte===cdef("tva_coll")),l=>(l.credit||0)-(l.debit||0)),ded=sum(ls.filter(l=>l.compte===cdef("tva_ded")),l=>(l.debit||0)-(l.credit||0));
 return{coll,ded,net:coll-ded,liq:(S.tva_liq||[]).find(x=>x.mois===m)}}
function liquiderTVA(m){
 need("compta","a");const t=tvaMois(m);if(t.liq)throw new Error("TVA de "+m+" déjà liquidée.");if(!t.coll&&!t.ded)throw new Error("Aucune TVA sur "+m+".");
 const lines=[{compte:cdef("tva_coll"),debit:t.coll},{compte:cdef("tva_ded"),credit:t.ded}];
 if(t.net>0)lines.push({compte:cdef("tva_due"),credit:t.net});else if(t.net<0)lines.push({compte:cdef("tva_credit"),debit:-t.net});
 const e=postEntry({journal:"OD",date:monthEnd(m),libelle:"Liquidation de la TVA — "+m,piece:"TVA-"+m,source:{type:"tva",mois:m},lines});

 lines.forEach(l=>{if(!by(S.accounts,l.compte,"num"))throw new Error("Compte inconnu : "+l.compte);if(l.debit&&l.credit)throw new Error("Une ligne ne peut être à la fois au débit et au crédit.")});

const suspendu=(c,d)=>!!((c.susp&&d>=c.susp.from)||(c.suspensions||[]).some(s=>d>=s.from&&d<s.to));
const montantA=(c,d)=>{let m=c.versions[0].montant;for(const v of c.versions)if(v.from<=d)m=v.montant;return m};
const chauffeurNom=id=>(by(S.drivers,id)||{}).nom||"—",vehImmat=id=>(by(S.vehicles,id)||{}).immat||"—";

function creerAffectation(vid,did,debut){

function creerContrat(f){
 need("contrats","c");
 const v=by(S.vehicles,f.vehicle_id),d=by(S.drivers,f.driver_id);

 if(v.statut==="sorti")throw new Error("Véhicule sorti du parc.");
 if(!(f.montant>0))throw new Error("Montant invalide.");
 if(f.fin&&f.fin<f.debut)throw new Error("Date de fin antérieure au début.");
 if(chevauche(v.id,f.debut,f.fin||null))throw new Error("Un contrat couvre déjà ce véhicule sur la période : double obligation interdite.");

 if(!(montant>0))throw new Error("Montant invalide.");
 if(from<today()){need("contrats","a","Modification rétroactive : validation requise (droits insuffisants).");if(!motif)throw new Error("Motif obligatoire pour une modification rétroactive.")}
 if(S.obligations.some(o=>o.contract_id===cid&&o.date_ech>=from&&S.allocs.some(a=>a.obligation_id===o.id&&a.actif)))throw new Error("Des échéances déjà encaissées existent après cette date : régulariser d'abord.");

 if(!internal)needAny("contrats",["e","a"]);const c=by(S.contracts,cid);if(!c||!["actif","suspendu"].includes(c.statut))throw new Error("Contrat inactif.");
 if(!motif)throw new Error("Motif obligatoire.");if(effet<c.debut)throw new Error("Date d'effet antérieure au début.");

const ctOuvert=c=>c&&["actif","suspendu"].includes(c.statut);
function modifierContrat(cid,f){

 const obs=S.obligations.filter(o=>o.contract_id===cid),am=allocMap(),fin=f.fin||null,repos=f.repos||c.repos,depot=+f.depot||0;
 if(depot<(c.depot_verse||0))throw new Error("Dépôt inférieur au dépôt déjà versé ("+fcfa(c.depot_verse)+").");
 if(!obs.length){ // aucune échéance : modification complète
  const v=by(S.vehicles,f.vehicle_id||c.vehicle_id),d=by(S.drivers,f.driver_id||c.driver_id),debut=f.debut||c.debut,mode=f.mode||c.mode,montant=+f.montant;
  if(!v||!d)throw new Error("Véhicule et chauffeur requis.");if(v.statut==="sorti")throw new Error("Véhicule sorti du parc.");if(!(montant>0))throw new Error("Montant invalide.");
  if(fin&&fin<debut)throw new Error("Date de fin antérieure au début.");if(chevauche(v.id,debut,fin,cid))throw new Error("Un contrat couvre déjà ce véhicule sur la période : double obligation interdite.");
  const i=S.assignments.findIndex(a=>a.vehicle_id===c.vehicle_id&&a.driver_id===c.driver_id&&!a.fin&&a.debut===c.debut);
  if(v.id!==c.vehicle_id||d.id!==c.driver_id){if(i>=0)S.assignments.splice(i,1);creerAffectation(v.id,d.id,debut)}else if(i>=0)S.assignments[i].debut=debut;
  Object.assign(c,{vehicle_id:v.id,driver_id:d.id,mode,montant,periodicite:mode==="recette"?"jour":(f.periodicite||c.periodicite||"mois"),debut,fin,repos,depot});delete c.gen;

  if(fin){if(fin<c.debut)throw new Error("Date de fin antérieure au début.");const dp=obs.filter(o=>am[o.id]).map(o=>o.date_ech).sort().pop();

 S.entries.filter(e=>e.lines.some(l=>l.ob&&ids.has(l.ob)&&!l.ext)).forEach(e=>extourner(e,"Suppression du contrat "+c.numero+" : "+motif,l=>l.ob&&ids.has(l.ob)));

 const e=S.entries.find(x=>x.journal==="VT"&&x.lines.some(l=>l.ob===o.id&&!l.ext));
 if(e)extourner(e,"Exonération : "+motif,l=>l.ob===o.id);

function generer(upTo,sys){
 if(!sys)need("planning","c");
 const out={n:0,skip:0},byDate={};
 S.contracts.forEach(c=>{
  if(c.statut==="supprime")return;
  const end=contractEnd(c),stop=end<upTo?end:upTo;if(stop<c.debut)return;
  const have=new Set(S.obligations.filter(o=>o.contract_id===c.id).map(o=>o.date_ech)),dates=[];
  if(c.mode==="recette"){for(let d=c.gen?addDays(c.gen,1):c.debut;d<=stop;d=addDays(d,1)){if(c.repos==="dimanche"&&new Date(d+"T00:00:00Z").getUTCDay()===0)continue;dates.push(d)}}
  else for(let k=0;;k++){const d=c.periodicite==="mois"?addMonths(c.debut,k):addDays(c.debut,k*(c.periodicite==="semaine"?7:1));if(d>stop)break;dates.push(d)}
  dates.splice(0,dates.length,...dates.filter(d=>!suspendu(c,d)));
  let skipped=false;
  dates.forEach(d=>{
   if(have.has(d))return;

const hav=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function ingestPos(ident,lat,lng,t,vit){
 const rej=r=>{S.gps_quar.unshift({t:now(),ident,lat,lng,tt:t,raison:r});S.gps_quar.length=Math.min(S.gps_quar.length,200);return{ok:false,raison:r}};

 if(!dev)return rej("Dispositif inconnu");if(!dev.actif||!dev.vehicle_id)return rej("Dispositif inactif ou non associé");
 lat=Number(lat);lng=Number(lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return rej("Coordonnées invalides");
 const tm=new Date(t).getTime();if(!Number.isFinite(tm))return rej("Horodatage invalide");
 if(tm>Date.now()+3e5)return rej("Horodatage dans le futur");if(tm<Date.now()-7*864e5)return rej("Horodatage trop ancien");
 vit=Number(vit)||0;if(vit<0||vit>250)return rej("Vitesse aberrante");

 if(t==="ecritures"){
  const list=S.entries.filter(e=>(!f.j||e.journal===f.j)&&(!f.p||per(e.date)===f.p)&&(!f.o||(f.o==="auto"?!(e.source&&e.source.type==="manual"):(e.source&&e.source.type==="manual")))).sort((a,b)=>b.date.localeCompare(a.date)||b.numero.localeCompare(a.numero));

  tbl(["N°","Date","Journal","Libellé","Origine","Pièce","Montant","État",""],list.map(e=>tr([esc(e.numero),fd(e.date),esc(e.journal),esc(e.libelle),esc(SRC_LIB[(e.source||{}).type]||"—"),esc(e.piece),fcfa(sum(e.lines,l=>l.debit)),e.extournee_par?badge("Extournée","mu"):e.lines.some(l=>l.ext)?badge("Partiellement extournée","wa"):badge("Validée","ok"),`<div class="flex">${btn("ec.det",e.id,"Détail","ghost")}${e.source&&e.source.type==="manual"&&!e.extournee_par&&can("compta","a")?btn("ec.ext",e.id,"Extourner","er"):""}</div>`])));
 }
 if(t==="brouillard"){const tot=b=>sum(b.lines,l=>l.debit||0);
  h+=`<div class="flex" style="margin-bottom:10px">${can("compta","c")?`<button class="btn" data-a="od.new">➕ Nouvelle écriture manuelle</button>`:""}</div>`+tbl(["Date","Journal","Libellé","Lignes","Débit","Crédit","Saisi par",""],S.brouillard.map(b=>{const d=sum(b.lines,l=>l.debit),c=sum(b.lines,l=>l.credit);return tr([fd(b.date),esc(b.journal),esc(b.libelle),b.lines.length,fcfa(d),fcfa(c)+(d!==c?" "+badge("Déséquilibrée","er"):""),esc(b.par),`<div class="flex">${btn("bo.det",b.id,"Détail","ghost")}${can("compta","a")?btn("bo.vis",b.id,"✅ Viser","ok"):""}${can("compta","c")?btn("bo.del",b.id,"Supprimer","er"):""}</div>`])}),"Aucune écriture en brouillard")+`<div class="sm mu">Une écriture manuelle reste en brouillard jusqu'à son visa par un autre utilisateur (séparation des tâches). Le visa vérifie l'équilibre, les comptes et la période ouverte. Une écriture visée est définitive : correction par extourne.</div>`}
 if(t==="cd"){const w=can("compta","a"),c=S.settings.comptes||{};
  h+=`<div class="sm mu" style="margin-bottom:8px">Aucune valeur n'est codée en dur : chaque écriture automatique prend ses comptes ici. Si un compte est vide ou inconnu du plan, l'opération est bloquée. Un code inexistant est créé automatiquement au plan (à affiner). Un compte de bilan déjà mouvementé ne peut plus être changé (reclasser par écriture).</div><datalist id="dl-plan">${S.accounts.map(a=>`<option value="${esc(a.num)}" label="${esc(a.num+" — "+a.nom)}"></option>`).join("")}</datalist>`+
  tbl(["Usage","Compte","Intitulé au plan"],Object.entries(DEF_CPT).map(([k,v])=>tr([esc(v[0]),`<input data-cd="${k}" list="dl-plan" value="${esc(c[k]||"")}" style="width:110px" ${w?"":"disabled"}>`,esc(cptNom(c[k]||"")||"— inconnu —")])))+
  `<div class="card flex"><div><label>Taux de TVA (%) — 0 si non assujetti</label><input id="tva_t" type="number" min="0" max="30" step="0.5" value="${tvaTaux()}" style="width:110px" ${w?"":"disabled"}></div><div><label>Durée d'amortissement par défaut (années)</label><input id="am_d" type="number" min="1" max="20" value="${S.settings.amort_duree||5}" style="width:110px" ${w?"":"disabled"}></div>${w?`<button class="btn" data-a="cd.save">💾 Enregistrer</button>`:""}</div>`}
 if(t==="budgets"){const m=today().slice(0,7);h+=(can("compta","a")?`<p><button class="btn" data-a="bg.add">➕ Budget mensuel</button></p>`:"")+tbl(["Compte","Plafond mensuel","Consommé ("+m+")","%",""],S.budgets.map(g=>{const u=budgetConso(g.compte,m),p=Math.round(u/g.max*100);return tr([esc(g.compte+" "+cptNom(g.compte)),fcfa(g.max),fcfa(u),badge(p+" %",p>=100?"er":p>=80?"wa":"ok"),can("compta","a")?btn("bg.del",g.id,"Supprimer","er"):""])}),"Aucun budget défini")+`<div class="sm mu">Une alerte apparaît dans la synthèse dès 80 % du plafond.</div>`}
 if(t==="plan")h+=(can("compta","c")?`<p><button class="btn" data-a="ac.add">+ Compte</button></p>`:"")+tbl(["N°","Intitulé","Type","Solde"],S.accounts.slice().sort((a,b)=>a.num.localeCompare(b.num)).map(a=>{const s=sum(S.entries.flatMap(e=>e.lines.filter(l=>l.compte===a.num)),l=>(l.debit||0)-(l.credit||0));return tr([a.num,esc(a.nom),esc(a.type),fcfa(Math.abs(s))+(s<0?" C":s>0?" D":"")])}));

function login(uidv,pin){
 const u=by(S.users,uidv);if(!u)return"Compte inconnu.";
 const t=S.tries[u.id]||{n:0,until:0};if(Date.now()<t.until)return"Compte bloqué 1 minute (trop de tentatives).";
 if(!u.actif)return"Compte désactivé.";
 if(u.h===hashPin(u.id,pin)){ouvrirSession(u,false);return null}
 t.n++;if(t.n>=5){t.until=Date.now()+6e4;t.n=0}S.tries[u.id]=t;try{save()}catch(e){}return"PIN incorrect.";
}

const THEMES=[["turquoise","Turquoise","#0e7490"],["bleu","Bleu","#1a3aa8"],["emeraude","Vert émeraude","#0f7b5f"],["orange","Orange énergie","#c9500a"],["violet","Violet","#6a32c9"],["or","Nuit & or","#15171d"]],THEME_DEF="orange";

const themeDots=()=>`<div class="themes" title="Couleur du logiciel">${THEMES.map(([k,t,c])=>`<button type="button" class="${themeCur()===k?"on":""}" style="background:${c}" data-a="theme" data-id="${k}" aria-label="${t}" title="${t}"></button>`).join("")}</div>`;
function setTheme(k){if(!THEMES.some(t=>t[0]===k))return;if(k===THEME_DEF)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=k;try{localStorage.setItem("angels_theme",k)}catch(e){}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--b").trim()}

const clkT=()=>new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),clkD=()=>new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

const demoOK=()=>S.settings.acces_demo!==false;
const HERO=`<div class="hero-l"><div style="font-size:13px;letter-spacing:2px;opacity:.8">ANGEL'S GROUP</div><h1>Chaque taxi suivi, chaque versement encaissé, chaque chauffeur en règle.</h1><p>Le logiciel de gestion de votre parc de taxis communaux — du contrat à la recette du jour.</p><ul><li><span class="i">💵</span><div><b>Versements journaliers et arriérés suivis</b>Échéances, imputation automatique, reçus confirmés.</div></li><li><span class="i">🧾</span><div><b>Comptabilité SYSCOHADA intégrée</b>Partie double, caisse, périodes, états comptables.</div></li><li><span class="i">📍</span><div><b>Carte GPS et alertes</b>Position des taxis, zones, dispositifs.</div></li><li><span class="i">🛠️</span><div><b>Entretien préventif, pièces et agenda</b>Plan par taxi, rappels WhatsApp, stock de pièces.</div></li><li><span class="i">🪪</span><div><b>Dossiers complets</b>Documents du véhicule, photo, permis et carte d'identité du chauffeur.</div></li></ul></div>`;
function demoFill(b){const f=document.getElementById("lf");if(!f)return;const d=f.closest("details");if(d)d.open=true;f.u.value=b.dataset.id;(f.p||f.pin).value=b.dataset.pin||"";document.querySelectorAll(".pcard").forEach(c=>c.classList.toggle("on",c===b));const s=f.querySelector("button");if(s)s.focus()}

const DEMO_P=[["admin","🛡️","Administrateur","Tout voir et tout régler"],["directeur","📊","Directeur","Tableau de bord, validations"],["flotte","🚕","Gestionnaire de flotte","Véhicules, contrats, entretien"],["caissier","💰","Caissier","Encaissements, caisse"],["comptable","📒","Comptable","Comptabilité, états"],["controleur","🔍","Contrôleur","Consultation et audit"],["chauffeur","🧑‍✈️","Chauffeur","Mon compte, mes reçus"]];
function ouvrirSession(u,demo){S.tries[u.id]={n:0,until:0};ME=u;try{sessionStorage.setItem("tr_me",u.id)}catch(x){}view=NAV.find(showNav).v;atomic(()=>{audit(demo?"Connexion (accès démo)":"Connexion");generer(today(),true)},true)}

 const form=`<form id="lf" style="margin-top:8px"><label>Utilisateur<select name="u">${act.map(u=>`<option value="${u.id}">${esc(u.nom)} — ${esc(ROLES[u.role])}</option>`).join("")}</select></label><label style="margin-top:10px">Code PIN<input name="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required></label><p id="le" class="mu sm"></p><button class="btn" style="width:100%">Se connecter</button><p class="mu sm">PIN oublié ? Demander la réinitialisation à l'administrateur.</p></form>`;

}

}

/* ---------- PWA : installation, mise à jour, hors ligne ---------- */
let DEF=null,MAJ=false;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const installe=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaBtn=()=>installe()?"":(DEF||estIOS())?`<a data-a="pwa.inst">📲 Installer l'application</a>`:"";
A["pwa.inst"]=async()=>{if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()}else alert("Sur iPhone / iPad : ouvrir cette page dans Safari, toucher « Partager », puis « Sur l'écran d'accueil ».")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEF=e;if(!document.querySelector(".md"))render()});
window.addEventListener("appinstalled",()=>{DEF=null;render()});
function barre(){
 let b=$("#pwaBar");
 if(!MAJ&&navigator.onLine){if(b)b.remove();return}
 if(!b){b=document.createElement("div");b.id="pwaBar";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px;text-align:center;font-weight:600";document.body.appendChild(b)}
 if(MAJ){b.style.background="var(--b)";b.style.color="#fff";b.innerHTML="Nouvelle version disponible — <a href='#' id='pwaUp' style='color:#fff;text-decoration:underline'>recharger</a>";$("#pwaUp").onclick=ev=>{ev.preventDefault();location.reload()}}
 else{b.style.background="var(--wabg)";b.style.color="var(--wa)";b.textContent="Mode hors ligne — vos données restent enregistrées sur cet appareil"}
}
window.addEventListener("online",barre);window.addEventListener("offline",barre);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let avait=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(avait){MAJ=true;barre()}avait=true});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
barre();
load();
try{const id=sessionStorage.getItem("tr_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
fichiersCharger().then(()=>{if(S&&S.attachments.length&&!document.querySelector(".md"))render()});
