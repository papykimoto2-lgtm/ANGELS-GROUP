const hav=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function ingestPos(ident,lat,lng,t,vit){

 if(!dev)return rej("Dispositif inconnu");if(!dev.actif||!dev.vehicle_id)return rej("Dispositif inactif ou non associé");

 if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return rej("Coordonnées invalides");
 const tm=new Date(t).getTime();if(!Number.isFinite(tm))return rej("Horodatage invalide");
 if(tm>Date.now()+3e5)return rej("Horodatage dans le futur");if(tm<Date.now()-7*864e5)return rej("Horodatage trop ancien");

async function compresserImage(f,max){
 const url=URL.createObjectURL(f);
 try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error("Image illisible."));i.src=url});
  for(const[dim,q]of[[1600,.75],[1280,.65],[1000,.55],[760,.5]]){const k=Math.min(1,dim/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
   const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",q);if(d.length*3/4<=max)return d}
  throw new Error("Image trop volumineuse même après compression (max "+Math.round(max/1024)+" Ko).")}
 finally{URL.revokeObjectURL(url)}
}

/* Mots de passe : l'administrateur ne choisit jamais le mot de passe d'un autre ; un mot de passe temporaire est généré, montré une fois, et doit être changé à la première connexion. */
async function mdpTemp(uid_,titre){const mdp=ANGELS_AUTH.generer(),u0=by(S.users,uid_);if(!u0)return;const pwd=await ANGELS_AUTH.creer(mdp);const u=by(S.users,uid_);if(!u)return;u.pwd=pwd;u.chg=true;delete u.h;delete S.tries[u.id];save();await ANGELS_AUTH.afficherTemp({titre:titre||"Mot de passe temporaire",nom:u.nom,mdp});render()}

A["us.pin"]=id=>{if(!confirm("Réinitialiser le mot de passe de cet utilisateur ? Un mot de passe temporaire sera généré et l'utilisateur devra le changer à la prochaine connexion."))return;if(atomic(()=>{need("users","e");const u=by(S.users,id);if(!u)throw new Error("Compte introuvable.");u.pwd=null;u.chg=true;delete u.h;S.tries[u.id]={n:0,until:0};audit("Mot de passe réinitialisé",u.nom)})!==false)mdpTemp(id,"Mot de passe réinitialisé")};

 if(!String(f.ref_liquidation||"").trim())throw new Error("Référence de la liquidation obligatoire.");if(f.conteste&&+f.conteste>m)throw new Error("Le montant contesté dépasse le montant liquidé.");
 if(d.douane.entry_id){const old=by(S.entries,d.douane.entry_id);if(old)extourner(old,"Nouvelle liquidation "+d.ref)}
 const dg=tiersVN("fournisseur_veh","Direction des douanes"),e=postEntry({journal:"AC",date,libelle:"Droits et taxes de douane — "+d.ref+" (liquidation "+String(f.ref_liquidation).trim()+")",piece:String(f.ref_liquidation).trim(),source:{type:"imp_douane",id:d.id},

 Object.assign(d.douane,{liquide:m,tva,conteste:Math.round(+f.conteste||0),echeance:f.echeance||"",ref_liquidation:String(f.ref_liquidation).trim(),date_liquidation:date,entry_id:e.id,tiers_id:dg.id,att:f.pj||null});audit("Liquidation des droits et taxes",d.ref+" "+fcfa(m))}

 if(!(m>0))throw new Error("Montant invalide.");if(m>dgRestant(d))throw new Error("Montant supérieur au reste dû en douane ("+fcfa(dgRestant(d))+").");
 const q=String(f.quittance||"").trim().toUpperCase();if(!q)throw new Error("Référence de quittance obligatoire : un paiement ne s'enregistre pas sans justificatif.");
 if(S.imports.some(x=>x.douane.paiements.some(p=>p.quittance===q)))throw new Error("Cette quittance est déjà enregistrée : un même paiement ne peut pas être comptabilisé deux fois.");

function faireEtape(id,k,f){
 const d=impById(id);impOuvert(d);const i=d.etapes.findIndex(e=>e.k===k),e=d.etapes[i];if(!e)throw new Error("Étape non applicable à ce dossier.");if(e.fait||e.na)throw new Error("Étape déjà traitée.");
 if(ME.role==="transitaire"){if(!IMP_EXT.includes(k))throw new Error("Cette étape est réservée à l'équipe interne.");impGarde(d,"ext")}else impGarde(d,"e");
 const prev=d.etapes.slice(0,i).find(x=>!x.fait&&!x.na);if(prev)throw new Error("Étape précédente non terminée : « "+nomEtape(prev.k)+" » (la marquer faite ou non applicable).");
 const last=[...d.etapes.slice(0,i)].reverse().find(x=>x.fait),date=vnDate(f.date||today(),last&&last.fait.date);const ref=String(f.preuve||"").trim();
 if(IMP_PREUVE.includes(k)&&!ref&&!f.pj)throw new Error("« "+nomEtape(k)+" » : référence ou pièce justificative obligatoire.");if(f.pj)pjVerif(f.pj);
 if(k==="liquidation"&&!(dgLiq(d)>0))throw new Error("Enregistrer d'abord la liquidation (onglet Douane).");
 if(k==="paiement"&&!(dgLiq(d)>0&&dgRestant(d)===0))throw new Error("Paiement douanier incomplet : restant dû "+fcfa(dgRestant(d))+".");
 if(k==="declaration")d.ref_douane=ref||d.ref_douane;if(k==="arrive_port")d.arrivee_reelle=date;
 if(k==="reception")receptionImport(d,date,ref);
 const de=impStatut(d);e.fait={date,t:now(),par:ME.nom,note:String(f.note||"").trim(),ref,att:f.pj||null};d.hist.push({t:now(),par:ME.nom,k,de,a:nomEtape(k),note:String(f.note||"").trim(),ref,att:f.pj||null});
 if(k==="reception"){d.statut="clos";d.clos_le=now()}audit("Dossier "+d.ref,nomEtape(k))}
function naEtape(id,k,motif){const d=impById(id);impGarde(d,"e");impOuvert(d);const e=stp(d,k);if(!e)throw new Error("Étape inconnue.");if(k==="reception")throw new Error("Cette étape est obligatoire.");if(e.fait)throw new Error("Étape déjà réalisée.");if(!String(motif||"").trim())throw new Error("Motif obligatoire.");
 e.na={motif:String(motif).trim(),par:ME.nom,t:now()};d.hist.push({t:now(),par:ME.nom,k,de:impStatut(d),a:nomEtape(k)+" — non applicable",note:String(motif).trim(),ref:"",att:null});audit("Étape non applicable",d.ref+" "+nomEtape(k))}
function receptionImport(d,date,ref){ // transfère le coût capitalisé en cours de route vers le stock, réparti entre les véhicules selon la clé du dossier
 const V=impVeh(d);if(!V.length)throw new Error("Aucun véhicule dans le dossier.");if(d.frais.some(f=>f.statut==="propose"))throw new Error("Des frais proposés par le transitaire sont à valider avant la réception.");
 const cles=V.map(v=>({id:v.id,w:d.cle==="valeur"?v.achat.ht:d.cle==="poids"?v.poids:d.cle==="volume"?v.volume:1})),communs=sum(fraisReels(d).filter(f=>!f.vn_id),f=>f.montant)+dgCapital(d),part=repartir(communs,cles);
 const tot=cap381(d);let n=0;const lignes=[];
 V.forEach(v=>{const direct=sum(fraisReels(d).filter(f=>f.vn_id===v.id),f=>f.montant),alloc=part[v.id]+direct;if(alloc>0)v.frais.push({id:uid("fr"),date,type:"Frais d'importation (répartis — "+d.ref+")",libelle:"Clé : "+(IMP_CLES.find(c=>c[0]===d.cle)||[0,d.cle])[1],montant:alloc,mode:"import",entry_id:null});n+=v.achat.ht+alloc});
 if(n!==tot)throw new Error("Répartition incohérente ("+fcfa(n)+" ≠ "+fcfa(tot)+").");
 const e=postEntry({journal:"OD",date,libelle:"Réception des véhicules — "+d.ref+" (transfert du stock en cours de route)",piece:ref||d.ref,source:{type:"imp_reception",id:d.id},lines:[{compte:cdef("stock_veh"),debit:tot},{compte:cdef("stock_route"),credit:tot}]});
 V.forEach(v=>{v.statut="stock";v.reception={date,import_id:d.id};v.frais.forEach(f=>{if(f.mode==="import"&&!f.entry_id)f.entry_id=e.id})});d.reception_entry=e.id}

 if(stp(d,"enlevement")&&fait(d,"mainlevee")&&!fait(d,"enlevement")&&depuis(d,"mainlevee")>=+stv("imp_delai_enlevement_j"))push("wa","Véhicule dédouané mais non encore enlevé");

/* ===== Modules 9 et 10 : stock commercial, clients, devis, réservations, échéanciers, livraison ; module 15 : centre d'alertes ; module 14 : tableau commercial =====
   Le stock commercial est distinct du parc d'exploitation. Un véhicule en transit ou en douane n'est jamais présenté comme disponible physiquement (précommande explicite possible).
   Processus de vente : devis → validation (responsable habilité) → réservation éventuelle → facture (écritures) → acompte → échéancier → paiements imputés dans l'ordre des échéances →
   autorisation de livraison → livraison (statut physique, documents remis) → clôture. Rien ne s'efface : annulations motivées et historiques. */

function ctrlReception(id,f){
 need("stock_veh","e");const v=by(S.vn,id);if(!v)throw new Error("Véhicule introuvable.");if(v.statut!=="stock")throw new Error("Le contrôle de réception concerne un véhicule entré en stock (reçu au parc).");
 if(!["conforme","dommages"].includes(f.etat))throw new Error("État invalide.");const dom=String(f.dommages||"").trim();if(f.etat==="dommages"&&!dom)throw new Error("Décrire les dommages constatés.");
 const date=vnDate(f.date,v.achat.date);if(f.pj)pjVerif(f.pj);(v.ctrls=v.ctrls||[]).push({date,par:ME.nom,t:now(),etat:f.etat,dommages:dom,cout_est:Math.round(+f.cout_est||0),note:String(f.note||"").trim(),pj:f.pj||null});audit("Contrôle de réception",v.ref+" — "+(f.etat==="dommages"?"dommages : "+dom:"conforme"))}
function transfererVN(id,f){
 need("stock_veh","e");const v=by(S.vn,id);if(!v)throw new Error("Véhicule introuvable.");if(!["stock","vendu"].includes(v.statut)||(v.statut==="vendu"&&((vvDe(v)||{}).livraison||{}).statut==="livree"))throw new Error("Seul un véhicule présent au parc peut être déplacé.");
 const loc=String(f.loc||"").trim();if(!loc)throw new Error("Nouvelle localisation requise.");if(loc===(v.loc||""))throw new Error("Le véhicule est déjà à cet emplacement.");if(!String(f.motif||"").trim())throw new Error("Motif du transfert obligatoire.");
 (v.transferts=v.transferts||[]).push({t:now(),par:ME.nom,de:v.loc||"—",a:loc,motif:String(f.motif).trim()});v.loc=loc;audit("Transfert de véhicule",v.ref+" → "+loc)}
function docVN(id,f){need("stock_veh","e");const v=by(S.vn,id);if(!v)throw new Error("Véhicule introuvable.");if(!STK_DOCS.some(x=>x[0]===f.type))throw new Error("Type de document invalide.");if(!f.pj&&!String(f.ref||"").trim())throw new Error("Joindre le fichier ou indiquer une référence.");
 if(f.pj)pjVerif(f.pj);(v.docs=v.docs||[]).push({id:uid("dv"),type:f.type,att:f.pj||null,ref:String(f.ref||"").trim(),t:now(),par:ME.nom});audit("Document véhicule",v.ref+" — "+(STK_DOCS.find(x=>x[0]===f.type)||[0,f.type])[1])}
function reserverVN(f){
 need("ventes_veh","c");const v=by(S.vn,f.vn_id);if(!v)throw new Error("Véhicule introuvable.");if(!["stock","route"].includes(v.statut))throw new Error("Véhicule non réservable (vendu ou disparu).");if(resActive(v))throw new Error("Véhicule déjà réservé.");
 const pre=v.statut==="route";if(pre&&f.precommande!=="oui")throw new Error("Véhicule en transit ou en douane : une précommande doit être confirmée explicitement (aucune disponibilité physique n'est garantie).");
 const cl=tiersVN("client_veh",f.client,f.tel),date=vnDate(f.date||today()),expire=f.expire||addDays(date,+stv("res_delai_j"));if(expire<date)throw new Error("La date d'expiration précède la réservation.");
 const r={id:uid("rs"),ref:seq("rs","RES"),vn_id:v.id,client_id:cl.id,type:pre?"precommande":"reservation",date,expire,statut:"active",devis_id:f.devis_id||null,hist:[{t:now(),par:ME.nom,statut:"active",note:pre?"Précommande":"Réservation"}],par:ME.nom,t:now()};
 S.reservations.push(r);audit(pre?"Précommande":"Réservation",r.ref+" — "+v.ref+" — "+cl.nom);return r}
function annulerReservation(id,motif){
 need("ventes_veh","x");const r=by(S.reservations,id);if(!r||r.statut!=="active")throw new Error("Réservation inactive ou introuvable.");if(String(motif||"").trim().length<5)throw new Error("Motif d'annulation obligatoire (5 caractères minimum).");
 r.statut="annulee";r.annulation={par:ME.nom,t:now(),motif:String(motif).trim()};r.hist.push({t:now(),par:ME.nom,statut:"annulee",note:String(motif).trim()});audit("Réservation annulée",r.ref+" — "+String(motif).trim())}
function prolongerReservation(id,date){need("ventes_veh","e");const r=by(S.reservations,id);if(!r||r.statut!=="active")throw new Error("Réservation inactive.");if(!date||date<=r.expire)throw new Error("La nouvelle date doit dépasser l'expiration actuelle.");
 r.hist.push({t:now(),par:ME.nom,statut:"active",note:"Prolongée jusqu'au "+date+" (avant : "+r.expire+")"});r.expire=date;audit("Réservation prolongée",r.ref)}
const vinCode=v=>String(v.vin||v.ref).toUpperCase();
function ouvrirInventaireVN(){
 need("stock_veh","c");if(S.inventaires_vn.some(i=>i.statut==="ouvert"))throw new Error("Un inventaire est déjà ouvert : le valider d'abord.");
 const phys=v=>v.statut==="stock"||(v.statut==="vendu"&&(()=>{const x=vvDe(v);return!!x&&!x.export&&x.livraison.statut!=="livree"})()),L=S.vn.filter(phys);
 const inv={id:uid("iv"),ref:seq("ivv","INV-VN"),date:today(),statut:"ouvert",lignes:L.map(v=>({vn_id:v.id,vin:vinCode(v),loc:v.loc||"",compte:false})),hors:[],par:ME.nom,t:now()};S.inventaires_vn.push(inv);audit("Inventaire de véhicules ouvert",inv.ref+" — "+L.length+" véhicule(s) attendu(s)");return inv}
function compterVN(id,code,note){
 need("stock_veh","e");const inv=by(S.inventaires_vn,id);if(!inv||inv.statut!=="ouvert")throw new Error("Inventaire clos ou introuvable.");const c=String(code||"").trim().toUpperCase();if(!c)throw new Error("N° de châssis requis.");
 const l=inv.lignes.find(x=>x.vin===c);if(l){if(l.compte)throw new Error("Véhicule déjà compté.");l.compte=true;l.compte_par=ME.nom;l.compte_t=now();return"présent"}
 const v=S.vn.find(x=>vinCode(x)===c);if(v)throw new Error("Châssis "+c+" connu mais non attendu au parc (statut : "+statutCom(v)[0]+").");if(inv.hors.some(h=>h.vin===c))throw new Error("Déjà signalé hors liste.");
 inv.hors.push({vin:c,note:String(note||"").trim(),par:ME.nom,t:now()});return"excédent"}
function validerInventaireVN(id,motifs){
 need("stock_veh","a");const inv=by(S.inventaires_vn,id);if(!inv||inv.statut!=="ouvert")throw new Error("Inventaire clos ou introuvable.");motifs=motifs||{};const ec=[];
 inv.lignes.filter(l=>!l.compte).forEach(l=>{const m=String(motifs[l.vn_id]||"").trim();if(m.length<5)throw new Error("Motif obligatoire (5 caractères minimum) pour le véhicule manquant "+l.vin+".");ec.push({type:"manquant",vn_id:l.vn_id,vin:l.vin,motif:m})});
 inv.hors.forEach((h,i)=>{const m=String(motifs["h"+i]||"").trim();if(m.length<5)throw new Error("Motif obligatoire pour l'excédent "+h.vin+".");ec.push({type:"excedent",vin:h.vin,motif:m})});
 ec.filter(e=>e.type==="manquant").forEach(e=>{const v=by(S.vn,e.vn_id),cout=vnCout(v);let en=null;if(v.statut==="vendu"){const x=vvDe(v);if(x)x.hist.push({t:now(),par:ME.nom,statut:x.statut,note:"Véhicule déclaré disparu à l'inventaire "+inv.ref+" — "+e.motif})}else if(cout>0)en=postEntry({journal:"OD",date:today(),libelle:"Écart d'inventaire — véhicule manquant "+v.ref+" ("+inv.ref+")",piece:inv.ref,source:{type:"inv_manquant",id:v.id},lines:coutLignes(v,cout,"stock")});
  v.statut_avant=v.statut;v.statut="disparu";v.disparu={inv:inv.id,date:today(),motif:e.motif,entry_id:en?en.id:null,par:ME.nom}});
 inv.statut="valide";inv.ecarts=ec;inv.valide_par=ME.nom;inv.valide_le=now();audit("Inventaire de véhicules validé",inv.ref+" — "+ec.length+" écart(s)")}
function retrouverVN(id,motif){need("stock_veh","a");const v=by(S.vn,id);if(!v||v.statut!=="disparu")throw new Error("Ce véhicule n'est pas déclaré disparu.");if(String(motif||"").trim().length<5)throw new Error("Motif obligatoire.");
 if(v.disparu.entry_id){const e=by(S.entries,v.disparu.entry_id);if(e)extourner(e,"Véhicule retrouvé — "+String(motif).trim())}v.statut=v.statut_avant||"stock";(v.transferts=v.transferts||[]).push({t:now(),par:ME.nom,de:"Disparu",a:v.loc||"—",motif:"Retrouvé : "+String(motif).trim()});v.disparu=null;audit("Véhicule retrouvé",v.ref)}

async function majPortailVehicules(force){ // le portail n'expose que les fiches catalogue : jamais coût, fournisseur, châssis, emplacement ni marge
 if(pVehEnCours||!S||!Array.isArray(S.vn))return false;pVehEnCours=true;

  if(!force&&!pVehDerniere){const rec=await pVehGet().catch(()=>null);if(rec&&rec.sig===sig){pVehDerniere=sig;return false}}

/* ---------- Application chauffeur (?app=chauffeur) : aucun accès à la base partagée ----------
   Le téléphone ne reçoit JAMAIS la clé de synchronisation ni les données des autres : il s'identifie avec le mot de passe du chauffeur auprès de la fonction « chauffeur »,
   reçoit un jeton signé et n'obtient que ses propres données. Ses saisies (courses, position, déclarations, demandes) sont mises en file d'attente locale puis envoyées
   et REVALIDÉES par le serveur (voir supabase/functions/_shared/chauffeur.js). La file survit à la perte de réseau. */
const CH={jeton:null,file:[],occupe:false};
const chLire=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}},chEcrire=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const chUrl=()=>String((window.ANGELS_PASSERELLE||{}).url||"").replace(/\/+$/,"")+"/functions/v1/chauffeur";
function chToast(m,err){const e=document.createElement("div");e.setAttribute("role","status");e.textContent=m;e.style.cssText="position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:99999;max-width:90vw;padding:10px 16px;border-radius:10px;font-size:14px;color:#fff;background:"+(err?"#b91c1c":"#166534");document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}
async function srv(action,corps){
 const c=window.ANGELS_PASSERELLE||{},r=await fetch(chUrl(),{method:"POST",headers:{"content-type":"application/json",apikey:c.key||"",authorization:"Bearer "+(c.key||"")},body:JSON.stringify({action,jeton:CH.jeton,...(corps||{})})});
 let b;try{b=await r.json()}catch(e){b={ok:false,erreur:"Réponse illisible du serveur."}}b.status=r.status;return b;
}
function chargerChauffeur(){
 try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
 if(!S||!S.perms||!S.__ch){seed();S.users=[];S.__ch=1;S.settings.acces_demo=false}
 CH.jeton=chLire("tr_ch_jeton",null);CH.file=chLire("tr_ch_file",[]);migrerNegoce();
 if(CH.jeton&&S.users[0]&&S.users[0].role==="chauffeur")ME=S.users[0];
}
function hydrater(M){
 const loc=CH.file.map(o=>o.loc).filter(Boolean),idsC=new Set(M.mes_courses.map(c=>c.id));
 S.users=[M.utilisateur];S.drivers=[M.chauffeur];S.tiers=M.tiers?[M.tiers]:[];S.contracts=M.contrats;S.assignments=M.affectations;S.vehicles=M.vehicules;S.obligations=M.obligations;S.allocs=M.allocations;
 S.payments=M.paiements;S.receipts=M.recus;S.declarations=M.declarations;S.requests=M.demandes;S.notifs=M.notifs;S.lignes=M.lignes;S.__solde=M.solde;
 S.courses=[...M.courses_flotte.filter(c=>!idsC.has(c.id)),...M.mes_courses];Object.assign(S.settings,M.reglages);
 /* saisies pas encore acceptées par le serveur : on les garde à l'écran */
 CH.file.forEach(o=>{if(!o.loc)return;if(o.a==="course"&&!S.courses.some(c=>c.id===o.loc.id))S.courses.push(o.loc);
  if(o.a==="declarer_recette"&&!S.declarations.some(c=>c.id===o.loc.id))S.declarations.push(o.loc);if(o.a==="demande"&&!S.requests.some(c=>c.id===o.loc.id))S.requests.push(o.loc);
  if(o.a==="retirer_course")S.courses=S.courses.filter(c=>c.id!==o.c.id);if(o.a==="retirer_declaration"){const x=by(S.declarations,o.c.id);if(x)x.statut="retiree"}});
 ME=S.users[0];try{save()}catch(e){}
}
function chPousser(a,c,loc){
 if(a==="position")CH.file=CH.file.filter(o=>o.a!=="position"&&o.a!=="arret_position");if(a==="arret_position")CH.file=CH.file.filter(o=>o.a!=="position");
 CH.file.push({a,c,loc:loc||null,id:uid("op")});chEcrire("tr_ch_file",CH.file);chVider();
}
async function chVider(){
 if(CH.occupe||!CH.jeton)return;CH.occupe=true;let refus=false;
 try{while(CH.file.length){const o=CH.file[0];let r;try{r=await srv(o.a,o.c)}catch(e){break}
   if(r.status===401&&r.reconnecter){chDeconnecter(true);return}
   if(r.ok||(r.status>=400&&r.status<500&&r.status!==429)){if(!r.ok){refus=true;chToast("Refusé par le serveur : "+(r.erreur||"erreur"),true)}CH.file.shift();chEcrire("tr_ch_file",CH.file)}else break}
 }finally{CH.occupe=false}
 if(refus||!CH.file.length)chRafraichir();
}
async function chRafraichir(){
 if(!CH.jeton||CH.file.length&&CH.occupe)return;let M;try{M=await srv("moi",{})}catch(e){return}
 if(M.status===401&&M.reconnecter)return chDeconnecter(true);if(!M.ok)return;hydrater(M);if(ME&&!document.querySelector(".md"))render();
}
function chDeconnecter(expire){
 CH.jeton=null;try{localStorage.removeItem("tr_ch_jeton");localStorage.removeItem("tr_ch_file");localStorage.removeItem(KEY);sessionStorage.removeItem("tr_me")}catch(e){}
 if(expire)chToast("Session expirée : reconnectez-vous.",true);setTimeout(()=>location.reload(),expire?1200:0);
}
const CH_VER="v184",CH_DIAG={etat:"test",txt:"Test du serveur…",t:null,sw:""};
const chDiagHTML=()=>`<div id="chdiag" class="sm mu" style="margin-top:14px;padding:8px 10px;border:1px dashed var(--bd,#ccc);border-radius:8px"><b>Diagnostic</b> · application ${CH_VER}${CH_DIAG.sw?" · cache "+esc(CH_DIAG.sw):""} · ${navigator.onLine?"réseau : oui":"réseau : NON"}<br>Serveur chauffeur : <b style="color:${CH_DIAG.etat==="ok"?"var(--ok,#166534)":CH_DIAG.etat==="test"?"inherit":"var(--er,#b91c1c)"}">${esc(CH_DIAG.txt)}</b>${CH_DIAG.t?" ("+esc(CH_DIAG.t)+")":""} <a data-a="ch.diag" style="cursor:pointer;text-decoration:underline">Retester</a></div>`;
function chDiagMaj(etat,txt){CH_DIAG.etat=etat;CH_DIAG.txt=txt;CH_DIAG.t=new Date().toLocaleTimeString("fr-FR");const e=document.getElementById("chdiag");if(e)e.outerHTML=chDiagHTML()}
async function chListe(){

  else chDiagMaj("ko","erreur "+r.status+(r.erreur?" « "+r.erreur+" »":""))}
 catch(e){chDiagMaj("ko","injoignable ("+(e&&e.message||"réseau")+")")}
}

if(APP_CHAUF){
 const _dc=declarerCourse,_rc=retirerCourse,_dr=declarerRecette,_rd=retirerDeclaration,_cd=creerDemande,_ep=enregistrerPosChauf,_rp=retirerPosChauf;
 declarerCourse=f=>{const x=_dc(f);chPousser("course",{id:x.id,zone:x.zone,passagers:x.passagers,montant:x.montant,t:x.t},x);return x};

 declarerRecette=f=>{const x=_dr(f);chPousser("declarer_recette",{id:x.id,date:x.date,montant:x.montant,mode:x.mode,ref:x.ref,note:x.note},x);return x};
 retirerDeclaration=id=>{_rd(id);chPousser("retirer_declaration",{id})};
 creerDemande=f=>{const r=_cd(f);chPousser("demande",{id:r.id,type:f.type,texte:f.texte,ob:f.ob||null,payload:f.payload||null},r);return r};
 signalerIncident=f=>creerDemande({type:"incident",texte:"Incident "+f.type+" du "+f.date+" : "+f.description});
 enregistrerPosChauf=(la,ln,v,pr)=>{const it=_ep(la,ln,v,pr);chPousser("position",{lat:it.lat,lng:it.lng,vit:it.vit,prec:it.prec,t:it.t});return it};
 retirerPosChauf=()=>{_rp();chPousser("arret_position",{})};
 login=async(uidv,mdp)=>{
  let r;try{r=await srv("login",{uid:uidv,mdp})}catch(e){return"Pas de réseau : la première connexion exige internet."}
  if(!r.ok)return r.erreur||"Connexion impossible.";
  if(r.changer){let r2=null;const nom=(by(S.users,uidv)||{}).nom||"";
   await ANGELS_AUTH.ouvrirChangement({titre:"Créez votre mot de passe",nom,min:Math.max(10,+((S.settings||{}).mdp_min)||10),obligatoire:true,intro:"Votre mot de passe est temporaire : choisissez un mot de passe personnel pour continuer.",
    enregistrer:async n=>{const x=await srv("changer_mdp",{uid:uidv,mdp,nouveau:n});if(!x.ok)throw new Error(x.erreur||"Changement refusé.");r2=x}});
   if(!r2)return"Changement de mot de passe annulé.";r=r2}
  CH.jeton=r.jeton;chEcrire("tr_ch_jeton",CH.jeton);let M;try{M=await srv("moi",{})}catch(e){return"Pas de réseau : réessayez."}
  if(!M.ok)return M.erreur||"Données indisponibles.";hydrater(M);ouvrirSession(S.users[0],false);chVider();return null;
 };
 A["out"]=()=>{if(CH.file.length&&!confirm("Des saisies n'ont pas encore été envoyées au serveur. Se déconnecter les perdra. Continuer ?"))return;chDeconnecter(false)};
 A["p.pin"]=()=>{const m0=ME;let ancien="";return ANGELS_AUTH.ouvrirChangement({titre:"Changer mon mot de passe",nom:m0.nom,min:Math.max(10,+((S.settings||{}).mdp_min)||10),obligatoire:false,
  ancien:async m=>{const r=await srv("login",{uid:m0.id,mdp:m});if(r.ok)ancien=m;return !!r.ok},
  enregistrer:async n=>{const x=await srv("changer_mdp",{uid:m0.id,mdp:ancien,nouveau:n});if(!x.ok)throw new Error(x.erreur||"Changement refusé.");CH.jeton=x.jeton;chEcrire("tr_ch_jeton",x.jeton)}})};
}
