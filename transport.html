<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://unpkg.com; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>ANGEL'S &amp; CO Transport</title>
<style>
:root{--b:#c2410c;--b2:#7c2d12;--bg:#faf5f1;--card:#fff;--tx:#2a1a12;--mu:#7a6a60;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#ead9cd;--okbg:#e3f5ea;--wabg:#fff1d6;--erbg:#fde5e5;--bbg:#ffe8db}
@media(prefers-color-scheme:dark){:root{--bg:#1b110c;--card:#2a1b14;--tx:#f5e9e1;--mu:#b8a396;--bd:#4a3226;--okbg:#14351f;--wabg:#3d2e0c;--erbg:#431616;--bbg:#4a2615}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
aside{width:236px;background:var(--b2);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;font-size:16px;padding:6px 8px 12px;line-height:1.2}
aside .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
aside .gt{margin:12px 10px 3px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;font-weight:700}
aside a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:#ffe8db;cursor:pointer;text-decoration:none}
aside a:hover{background:rgba(255,255,255,.12)}aside a.on{background:#fff;color:var(--b2);font-weight:700}
aside .who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:12px}
main{flex:1;padding:18px;min-width:0}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .v{font-size:21px;font-weight:800}.kpi .l{color:var(--mu);font-size:12px}
.kpi.w .v{color:var(--wa)}.kpi.e .v{color:var(--er)}.kpi.o .v{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{background:var(--b2)}.btn.sm{padding:4px 9px;font-size:12px;min-height:0}
.btn.ghost{background:transparent;color:var(--b);border:1px solid var(--b)}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn:disabled{opacity:.5}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bbg);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.er{background:var(--erbg);color:var(--er)}.badge.mu{background:var(--bd);color:var(--mu)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu)}.sm{font-size:12px}.r{text-align:right}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 9px;background:var(--card);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-top:8px}
.fg{display:grid;gap:0 10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md>div{background:var(--card);border-radius:14px;padding:16px;max-width:880px;width:100%;max-height:92vh;overflow:auto}
.login{max-width:350px;margin:10vh auto;padding:0 16px}
.burger{display:none}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--wabg);color:var(--wa);font-weight:600}.al.er{background:var(--erbg);color:var(--er)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--b);border-color:var(--b)}
.note{background:var(--wabg);color:var(--wa);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:12px}
#map{height:380px;border-radius:12px;border:1px solid var(--bd);margin-bottom:12px}
@media(max-width:800px){.shell{display:block}aside{position:fixed;z-index:40;height:100%;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.burger{display:inline-block;margin-bottom:10px}main{padding:12px}}
@media print{aside,.noprint,.burger{display:none!important}.md{position:static;background:none;padding:0}.md>div{max-height:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY="angels_transport_v3";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10);
const fd=d=>d?new Date(d.length>10?d:d+"T00:00:00Z").toLocaleDateString("fr-FR",{timeZone:"UTC"}):"—";
const fdt=t=>t?new Date(t).toLocaleString("fr-FR",{timeZone:"UTC"}):"—";
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const addMonths=(d,n)=>{const[y,m,j]=d.split("-").map(Number),l=new Date(Date.UTC(y,m-1+n+1,0)).getUTCDate();return new Date(Date.UTC(y,m-1+n,Math.min(j,l))).toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const daysTo=d=>d?diffDays(d,today()):null;
const by=(arr,id,k="id")=>arr.find(x=>x[k]===id);
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
let S=null,ME=null,view="dashboard";
const UI={tab:{},f:{}};

/* ---------- Rôles & droits (v=consulter c=créer e=modifier a=valider x=annuler p=exporter) ---------- */
const ROLES={admin:"Administrateur général",directeur:"Directeur / propriétaire",flotte:"Gestionnaire de flotte",caissier:"Caissier",comptable:"Comptable",controleur:"Contrôleur",chauffeur:"Chauffeur"};
const MODS={vehicules:"Véhicules",chauffeurs:"Chauffeurs",contrats:"Contrats",planning:"Planning",echeances:"Échéances",encaissements:"Encaissements",recus:"Reçus",caisse:"Caisse",depenses:"Dépenses",compta:"Comptabilité",tiers:"Comptes tiers",etats:"États comptables",gps:"GPS",maintenance:"Maintenance",entretien:"Entretien préventif",pieces:"Pièces détachées",agenda:"Agenda atelier",sinistres:"Sinistres",documents:"Documents & alertes",rapports:"Rapports",users:"Utilisateurs & droits",audit:"Audit & paramètres",portail:"Portail chauffeur"};
const ACT={v:"Consulter",c:"Créer",e:"Modifier",a:"Valider",x:"Annuler",p:"Exporter"};
function defPerms(){
 const R={},set=(r,o)=>{R[r]={};Object.keys(MODS).forEach(m=>R[r][m]=(o[m]||"").split(""))};
 set("admin",{vehicules:"vcep",chauffeurs:"vcep",contrats:"vp",planning:"vp",echeances:"vp",encaissements:"v",recus:"vp",caisse:"v",depenses:"vp",compta:"vp",tiers:"vp",etats:"vp",gps:"vcexp",maintenance:"vp",entretien:"vp",pieces:"vp",agenda:"vp",sinistres:"vp",documents:"vcep",rapports:"vp",users:"vcexp",audit:"vpe"});
 set("directeur",{vehicules:"vap",chauffeurs:"vp",contrats:"vap",planning:"vap",echeances:"vp",encaissements:"vp",recus:"vpx",caisse:"vapx",depenses:"vap",compta:"vapx",tiers:"vp",etats:"vp",gps:"vp",maintenance:"vap",entretien:"vap",pieces:"vp",agenda:"vp",sinistres:"vp",documents:"vp",rapports:"vp",users:"v",audit:"vp"});
 set("flotte",{vehicules:"vcep",chauffeurs:"vcep",contrats:"vcep",planning:"vce",echeances:"v",recus:"v",depenses:"vc",gps:"vcep",maintenance:"vcepa",entretien:"vcexp",pieces:"vcep",agenda:"vp",sinistres:"vcep",documents:"vcep",rapports:"vp"});
 set("caissier",{vehicules:"v",chauffeurs:"v",contrats:"v",echeances:"vp",encaissements:"vcea",recus:"vp",caisse:"vce",depenses:"vc",tiers:"v"});
 set("comptable",{vehicules:"v",chauffeurs:"v",contrats:"v",echeances:"vp",encaissements:"v",recus:"vp",caisse:"vp",depenses:"vceap",compta:"vceap",tiers:"vp",etats:"vp",maintenance:"v",entretien:"v",pieces:"vp",agenda:"v",documents:"v",rapports:"vp"});
 set("controleur",Object.fromEntries(Object.keys(MODS).filter(m=>m!=="portail").map(m=>[m,"vp"])));
 set("chauffeur",{portail:"v"});
 return R;
}
const can=(m,a="v")=>!!ME&&((S.perms[ME.role]||{})[m]||[]).includes(a);
const needAny=(m,acts,msg)=>{if(!acts.some(a=>can(m,a)))throw new Error(msg||"Droits insuffisants ("+MODS[m]+").")};
const need=(m,a,msg)=>{if(!can(m,a))throw new Error(msg||"Droits insuffisants ("+MODS[m]+" : "+ACT[a]+").")};

/* ---------- Persistance, audit, transactions ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){throw new Error("Stockage plein : données non enregistrées. Un backend est requis.")}};
const audit=(a,d)=>{S.audit.unshift({t:now(),u:ME?ME.nom:"système",r:ME?ME.role:"",a,d:d||""});if(S.audit.length>2000)S.audit.length=2000};
function atomic(fn,quiet){
 const snap=JSON.stringify(S),me=ME&&ME.id;
 try{const r=fn();recomputeLettrage();save();return r===undefined?true:r}
 catch(e){S=JSON.parse(snap);if(me)ME=by(S.users,me)||null;if(!quiet)alert(e.message);return false}
}
const seq=(k,pref)=>{S.seq[k]=(S.seq[k]||0)+1;const f=S.fmt[k]||pref;return f+"-"+new Date().getFullYear()+"-"+String(S.seq[k]).padStart(5,"0")};

/* ---------- Comptabilité (partie double, périodes, extourne, lettrage) ---------- */
const PLAN=[["101","Capital social","Passif"],["121","Report à nouveau créditeur","Passif"],["129","Report à nouveau débiteur","Passif"],["165","Dépôts et cautionnements reçus","Passif"],["245","Matériel de transport","Actif"],["401","Fournisseurs","Tiers"],["411","Clients (chauffeurs)","Tiers"],["521","Banques et mobile money","Trésorerie"],["571","Caisse","Trésorerie"],["604","Achats de matières et fournitures consommables (carburant)","Charge"],["624","Entretien, réparations et maintenance","Charge"],["638","Autres charges externes","Charge"],["658","Charges diverses (amendes, pénalités)","Charge"],["706","Services vendus (recettes et loyers)","Produit"]];
const JOURNAUX=[["VT","Produits (recettes et loyers)"],["CAI","Caisse"],["BQ","Banque / Mobile Money"],["AC","Achats et charges"],["OD","Opérations diverses"],["AN","À-nouveaux"]];
const CATS={"Carburant":"604","Entretien et réparations":"624","Amendes et pénalités":"658","Frais divers":"638"};
const per=d=>d.slice(0,7);
function periodOpen(d){const p=by(S.periods,per(d));if(p&&p.statut==="cloturee")throw new Error("Période comptable clôturée : "+per(d)+".");if(!p)S.periods.push({id:per(d),statut:"ouverte"})}
function postEntry({journal,date,libelle,piece,source,lines}){
 lines=lines.filter(l=>l.debit||l.credit);
 const d=sum(lines,l=>l.debit),c=sum(lines,l=>l.credit);
 if(lines.length<2||d!==c||d<=0)throw new Error("Écriture déséquilibrée ou incomplète (débit "+fcfa(d)+" / crédit "+fcfa(c)+").");
 lines.forEach(l=>{if(!by(S.accounts,l.compte,"num"))throw new Error("Compte inconnu : "+l.compte);if(l.debit&&l.credit)throw new Error("Une ligne ne peut être à la fois au débit et au crédit.")});
 periodOpen(date);
 const e={id:uid("je"),numero:seq("je","EC"),journal,date,libelle,piece:piece||"",source:source||null,statut:"validee",lines,created:now(),par:ME?ME.nom:"système"};
 S.entries.push(e);return e;
}
function extourner(e,motif,filter){
 const orig=e.lines.filter(l=>!l.ext&&(!filter||filter(l)));
 if(!orig.length)throw new Error("Aucune ligne à extourner.");
 const x=postEntry({journal:e.journal,date:today(),libelle:"Extourne "+e.numero+" — "+motif,piece:e.piece,source:{type:"extourne",id:e.id},lines:orig.map(l=>({compte:l.compte,tiers:l.tiers,debit:l.credit||0,credit:l.debit||0,ob:l.ob,veh:l.veh,ext:true}))});
 const code="X"+x.numero.slice(-5);
 orig.forEach(l=>{l.ext=true;l.lettre=code});x.lines.forEach(l=>l.lettre=code);
 if(!e.lines.some(l=>!l.ext))e.extournee_par=x.id;
 (e.log=e.log||[]).push({t:now(),x:x.id,motif});
 return x;
}
const allocMap=()=>{const m={};S.allocs.forEach(a=>{if(a.actif)m[a.obligation_id]=(m[a.obligation_id]||0)+a.montant});return m};
const soldeM=(o,m)=>o.exo?0:o.montant-(m[o.id]||0);
const soldeOb=o=>soldeM(o,allocMap());
function recomputeLettrage(){
 const am=allocMap(),code={};
 S.obligations.forEach(o=>{code[o.id]=(!o.exo&&soldeM(o,am)===0)?"L"+String(o.num).padStart(5,"0"):null});
 S.entries.forEach(e=>e.lines.forEach(l=>{if(l.compte==="411"&&l.ob&&!l.ext)l.lettre=code[l.ob]||null}));
}
const soldeTiers=(tid,compte="411")=>{let s=0;S.entries.forEach(e=>e.lines.forEach(l=>{if(l.compte===compte&&l.tiers===tid)s+=(l.debit||0)-(l.credit||0)}));return s};
const tiersDe=id=>by(S.tiers,id)||{};

/* ---------- Contrats, affectations, échéances ---------- */
const contractEnd=c=>c.statut==="resilie"?c.effet:(c.fin||"9999-12-31");
const montantA=(c,d)=>{let m=c.versions[0].montant;for(const v of c.versions)if(v.from<=d)m=v.montant;return m};
const chauffeurNom=id=>(by(S.drivers,id)||{}).nom||"—",vehImmat=id=>(by(S.vehicles,id)||{}).immat||"—";
const contratActif=(vid,d=today())=>S.contracts.find(c=>c.vehicle_id===vid&&c.debut<=d&&contractEnd(c)>=d);
function chevauche(vid,debut,fin,ignore){return S.contracts.some(c=>c.vehicle_id===vid&&c.id!==ignore&&c.debut<=(fin||"9999-12-31")&&contractEnd(c)>=debut)}
function creerAffectation(vid,did,debut){
 const cur=S.assignments.find(a=>a.vehicle_id===vid&&!a.fin&&a.driver_id!==did);
 if(cur)throw new Error("Véhicule déjà affecté à "+chauffeurNom(cur.driver_id)+" : terminer ou transférer d'abord.");
 if(!S.assignments.some(a=>a.vehicle_id===vid&&a.driver_id===did&&!a.fin))S.assignments.push({id:uid("as"),vehicle_id:vid,driver_id:did,debut,fin:null});
}
function creerContrat(f){
 need("contrats","c");
 const v=by(S.vehicles,f.vehicle_id),d=by(S.drivers,f.driver_id);
 if(!v||!d)throw new Error("Véhicule et chauffeur requis.");
 if(v.statut==="sorti")throw new Error("Véhicule sorti du parc.");
 if(!(f.montant>0))throw new Error("Montant invalide.");
 if(f.fin&&f.fin<f.debut)throw new Error("Date de fin antérieure au début.");
 if(chevauche(v.id,f.debut,f.fin||null))throw new Error("Un contrat couvre déjà ce véhicule sur la période : double obligation interdite.");
 creerAffectation(v.id,d.id,f.debut);
 const c={id:uid("ct"),numero:seq("ct","CTR"),mode:f.mode,vehicle_id:v.id,driver_id:d.id,montant:f.montant,periodicite:f.mode==="recette"?"jour":(f.periodicite||"mois"),debut:f.debut,fin:f.fin||null,repos:f.repos||"dimanche",depot:+f.depot||0,depot_verse:0,statut:"actif",effet:null,versions:[{from:f.debut,montant:f.montant,motif:"Création",par:ME.nom,at:now()}]};
 S.contracts.push(c);audit("Contrat créé",c.numero+" "+v.immat);return c;
}
function avenant(cid,montant,from,motif){
 needAny("contrats",["e","a"]);
 const c=by(S.contracts,cid);if(!c||c.statut!=="actif")throw new Error("Contrat inactif.");
 if(!(montant>0))throw new Error("Montant invalide.");
 if(from<today()){need("contrats","a","Modification rétroactive : validation requise (droits insuffisants).");if(!motif)throw new Error("Motif obligatoire pour une modification rétroactive.")}
 if(S.obligations.some(o=>o.contract_id===cid&&o.date_ech>=from&&S.allocs.some(a=>a.obligation_id===o.id&&a.actif)))throw new Error("Des échéances déjà encaissées existent après cette date : régulariser d'abord.");
 c.versions=c.versions.filter(v=>v.from<from);c.versions.push({from,montant,motif:motif||"Avenant",par:ME.nom,at:now()});c.versions.sort((a,b)=>a.from.localeCompare(b.from));
 S.obligations.filter(o=>o.contract_id===cid&&o.date_ech>=from&&!o.exo).forEach(o=>{const n=montantA(c,o.date_ech);if(n!==o.montant){ajusterOb(o,n-o.montant,"Avenant "+c.numero);o.montant=n}});
 c.montant=montantA(c,today());audit("Avenant",c.numero+" "+montant+" dès "+from);
}
function ajusterOb(o,delta,motif){
 const tid=by(S.drivers,o.driver_id).tiers_id,d=Math.abs(delta);
 postEntry({journal:"VT",date:today(),libelle:"Régularisation tarif — "+motif,piece:"ECH-"+o.num,source:{type:"regul",id:o.id},lines:[{compte:"411",tiers:tid,debit:delta>0?d:0,credit:delta<0?d:0,ob:o.id,veh:o.vehicle_id},{compte:"706",debit:delta<0?d:0,credit:delta>0?d:0,ob:o.id,veh:o.vehicle_id}]});
}
function resilier(cid,effet,motif,internal){
 if(!internal)needAny("contrats",["e","a"]);const c=by(S.contracts,cid);if(!c||c.statut!=="actif")throw new Error("Contrat inactif.");
 if(!motif)throw new Error("Motif obligatoire.");if(effet<c.debut)throw new Error("Date d'effet antérieure au début.");
 if(!internal&&effet<today())need("contrats","a","Résiliation rétroactive : validation requise.");
 c.statut="resilie";c.effet=effet;c.motif_resil=motif;
 const am=allocMap();
 S.obligations.filter(o=>o.contract_id===cid&&o.date_ech>effet&&!o.exo&&!am[o.id]).forEach(o=>exonerer(o,"Résiliation "+c.numero,true));
 const as=S.assignments.find(a=>a.vehicle_id===c.vehicle_id&&a.driver_id===c.driver_id&&!a.fin);if(as)as.fin=effet;
 audit("Contrat résilié",c.numero+" effet "+effet);
}
function changerMode(cid,effet,mode,montant,periodicite){
 need("contrats","c");const c=by(S.contracts,cid);if(!c||c.statut!=="actif")throw new Error("Contrat inactif.");
 if(effet<=c.debut)throw new Error("La date d'effet doit être postérieure au début du contrat actuel.");
 if(mode===c.mode&&!periodicite)throw new Error("Mode inchangé.");
 if(effet<today())need("contrats","a","Changement de mode rétroactif : validation requise.");
 resilier(cid,addDays(effet,-1),"Changement de mode d'exploitation",true);
 return creerContrat({mode,vehicle_id:c.vehicle_id,driver_id:c.driver_id,montant,periodicite,debut:effet,fin:null,repos:c.repos,depot:0});
}
function exonerer(o,motif,auto){
 if(!auto)need("planning","a");
 if(!motif)throw new Error("Motif obligatoire.");
 if(o.exo)throw new Error("Déjà exonérée.");
 if(S.allocs.some(a=>a.obligation_id===o.id&&a.actif))throw new Error("Échéance déjà encaissée (même partiellement).");
 const e=S.entries.find(x=>x.journal==="VT"&&x.lines.some(l=>l.ob===o.id&&!l.ext));
 if(e)extourner(e,"Exonération : "+motif,l=>l.ob===o.id);

function generer(upTo,sys){

 S.contracts.forEach(c=>{

  if(c.mode==="recette"){for(let d=c.gen?addDays(c.gen,1):c.debut;d<=stop;d=addDays(d,1)){if(c.repos==="dimanche"&&new Date(d+"T00:00:00Z").getUTCDay()===0)continue;dates.push(d)}}
  else for(let k=0;;k++){const d=c.periodicite==="mois"?addMonths(c.debut,k):addDays(c.debut,k*(c.periodicite==="semaine"?7:1));if(d>stop)break;dates.push(d)}
  let skipped=false;

   S.obligations.push(o);out.n++;(byDate[d]=byDate[d]||[]).push(o);
  });
  if(c.mode==="recette"&&!skipped&&stop>(c.gen||""))c.gen=stop;
 });
 Object.keys(byDate).sort().forEach(d=>{
  const lines=[];byDate[d].forEach(o=>{const tid=by(S.drivers,o.driver_id).tiers_id;lines.push({compte:"411",tiers:tid,debit:o.montant,ob:o.id,veh:o.vehicle_id},{compte:"706",credit:o.montant,ob:o.id,veh:o.vehicle_id})});
  postEntry({journal:"VT",date:d,libelle:"Échéances du "+fd(d),piece:"ECH-"+d,source:{type:"echeances",date:d},lines});

/* ---------- GPS ---------- */
const lastPos=did=>{let b=null;for(const p of S.gps_pos)if(p.device_id===did&&(!b||p.t>b.t))b=p;return b};
function gpsEtat(dev){const l=lastPos(dev.id);if(!l)return["Aucune donnée","mu"];const m=(Date.now()-new Date(l.t))/6e4;return m<=S.settings.gps_actif_min?["Actif","ok"]:m<=S.settings.gps_ancien_min?["Données anciennes","wa"]:["Hors ligne","er"]}
const hav=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function ingestPos(ident,lat,lng,t,vit){
 const rej=r=>{S.gps_quar.unshift({t:now(),ident,lat,lng,tt:t,raison:r});S.gps_quar.length=Math.min(S.gps_quar.length,200);return{ok:false,raison:r}};
 const dev=by(S.gps_dev,ident,"ident");
 if(!dev)return rej("Dispositif inconnu");if(!dev.actif||!dev.vehicle_id)return rej("Dispositif inactif ou non associé");
 lat=Number(lat);lng=Number(lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return rej("Coordonnées invalides");
 const tm=new Date(t).getTime();if(!Number.isFinite(tm))return rej("Horodatage invalide");
 if(tm>Date.now()+3e5)return rej("Horodatage dans le futur");if(tm<Date.now()-7*864e5)return rej("Horodatage trop ancien");
 vit=Number(vit)||0;if(vit<0||vit>250)return rej("Vitesse aberrante");
 S.gps_pos.push({id:uid("gp"),device_id:dev.id,vehicle_id:dev.vehicle_id,lat,lng,vit,t:new Date(tm).toISOString(),recu:now()});
 if(S.geofences.length&&!S.geofences.some(z=>hav(lat,lng,z.lat,z.lng)<=z.rayon)){
  if(!S.gps_alerts.some(a=>a.vehicle_id===dev.vehicle_id&&a.type==="sortie_zone"&&Date.now()-new Date(a.t)<18e5))S.gps_alerts.unshift({id:uid("ga"),t:now(),vehicle_id:dev.vehicle_id,type:"sortie_zone",texte:"Sortie de zone autorisée"});
 }
 const lim=Date.now()-S.settings.gps_retention_jours*864e5;S.gps_pos=S.gps_pos.filter(p=>new Date(p.t).getTime()>=lim);
 return{ok:true};
}

function journeeExceptionnelle(cid,date,motif){
 need("planning","a");const c=by(S.contracts,cid);if(!c||c.mode!=="recette"||c.statut!=="actif")throw new Error("Contrat de recette actif requis.");
 if(!motif)throw new Error("Motif obligatoire.");if(S.obligations.some(o=>o.contract_id===cid&&o.date_ech===date))throw new Error("Échéance déjà existante à cette date.");
 const o={id:uid("o"),num:S.seq.ob=(S.seq.ob||0)+1,contract_id:cid,vehicle_id:c.vehicle_id,driver_id:c.driver_id,date_ech:date,montant:montantA(c,date),jour:"exception",exo:null,motif_exc:motif};S.obligations.push(o);
 const tid=by(S.drivers,o.driver_id).tiers_id;postEntry({journal:"VT",date,libelle:"Journée exceptionnelle — "+motif,piece:"ECH-"+o.num,source:{type:"echeances",date},lines:[{compte:"411",tiers:tid,debit:o.montant,ob:o.id,veh:o.vehicle_id},{compte:"706",credit:o.montant,ob:o.id,veh:o.vehicle_id}]});audit("Journée exceptionnelle",c.numero+" "+date);
}
const JOUR={prevue:["Prévue","mu"],exploitee:["Exploitée","ok"],non_travaillee:["Non travaillée","wa"],exception:["Exceptionnelle","wa"]};

 const f=UI.f.plan||(UI.f.plan={d:today()}),am=allocMap();
 return head("Planning journalier",`<input type="date" data-f="plan:d" value="${f.d}" style="width:auto">${can("planning","c")?`<button class="btn" data-a="gen">Générer les échéances jusqu'à aujourd'hui</button>`:""}${can("planning","a")?`<button class="btn ghost" data-a="exc">+ Journée exceptionnelle</button>`:""}`)+
 tbl(["Échéance","Véhicule","Chauffeur","Contrat","Montant","Journée","Solde","Actions"],S.obligations.filter(o=>o.date_ech===f.d).map(o=>{const c=by(S.contracts,o.contract_id),j=JOUR[o.jour]||JOUR.prevue,v=by(S.vehicles,o.vehicle_id);
  return tr([`ECH-${String(o.num).padStart(5,"0")}`,esc(v.immat)+(v.statut!=="actif"?" "+badge(VST[v.statut],"wa"):""),esc(chauffeurNom(o.driver_id)),esc(c.numero+" · "+c.mode),fcfa(o.montant),badge(o.exo?"Exonérée":j[0],o.exo?"wa":j[1]),fcfa(soldeM(o,am)),
   `<div class="flex">${!o.exo&&can("planning","e")&&o.jour==="prevue"?btn("pl.exp",o.id,"Exploitée","ok"):""}${!o.exo&&can("planning","a")?btn("pl.exo",o.id,"Exonérer","ghost"):""}</div>`])}),{empty:"Aucune échéance à cette date."});
};

V.echeances=()=>{
 const f=UI.f.ech||(UI.f.ech={s:"impayees",d:"",v:""}),am=allocMap();
 const rows=S.obligations.filter(o=>(!f.d||o.driver_id===f.d)&&(!f.v||o.vehicle_id===f.v)).filter(o=>{const s=soldeM(o,am);return f.s==="toutes"||(f.s==="impayees"?s>0:f.s==="retard"?retardJ(o,am)>0:(s===0&&!o.exo))}).sort((a,b)=>b.date_ech.localeCompare(a.date_ech)||b.num-a.num);
 return head("Échéances et impayés",`<select data-f="ech:s" style="width:auto">${opt([["impayees","Impayées"],["retard","En retard"],["soldees","Soldées"],["toutes","Toutes"]],f.s)}</select><select data-f="ech:d" style="width:auto">${opt(drvOpts(),f.d,"Tous chauffeurs")}</select><select data-f="ech:v" style="width:auto">${opt(vehOpts(),f.v,"Tous véhicules")}</select>${csvBtn("echeances","echeances")}`)+
 `<div class="grid"><div class="kpi w"><div class="v">${fcfa(sum(rows,o=>soldeM(o,am)))}</div><div class="l">Restant dû (sélection)</div></div><div class="kpi e"><div class="v">${rows.filter(o=>retardJ(o,am)>0).length}</div><div class="l">En retard</div></div></div>`+
 tbl(["Échéance","Date","Véhicule","Chauffeur","Montant","Versé","Solde","Retard","État",""],rows.map(o=>{const s=soldeM(o,am),r=retardJ(o,am);return tr([`ECH-${String(o.num).padStart(5,"0")}`,fd(o.date_ech),esc(vehImmat(o.vehicle_id)),esc(chauffeurNom(o.driver_id)),fcfa(o.montant),fcfa(am[o.id]||0),fcfa(s),r?`<b style="color:var(--er)">${r} j</b>`:"—",o.exo?badge("Exonérée","wa"):s===0?badge("Soldée","ok"):(am[o.id]?badge("Partielle","wa"):badge(r?"En retard":"À payer",r?"er":"")),s>0&&can("encaissements","c")?btn("enc.open",o.driver_id,"Encaisser","ok"):""])}));
};
CSVS.echeances=()=>{const am=allocMap();return[["Échéance","Date","Véhicule","Chauffeur","Montant","Versé","Solde"],S.obligations.map(o=>["ECH-"+o.num,o.date_ech,vehImmat(o.vehicle_id),chauffeurNom(o.driver_id),o.montant,am[o.id]||0,soldeM(o,am)])]};
function rejeterPaiement(pid,motif){need("encaissements","a");const p=by(S.payments,pid);if(!p||p.statut!=="a_verifier")throw new Error("Paiement non rejetable.");if(!motif)throw new Error("Motif obligatoire.");p.statut="rejete";p.motif=motif;audit("Paiement rejeté",p.ref+" "+motif)}
V.encaissements=()=>{
 const att=S.payments.filter(p=>p.statut==="a_verifier");
 return head("Encaissements au bureau",can("encaissements","c")?`<button class="btn" data-a="enc.open" data-id="">+ Nouvel encaissement</button>`:"")+
 (att.length?`<h2>À vérifier avant confirmation (${att.length})</h2>`+tbl(["Date","Chauffeur","Montant","Mode","Référence","Saisi par",""],att.map(p=>tr([fdt(p.date_reelle),esc(chauffeurNom(p.driver_id)),fcfa(p.montant),esc(p.mode),esc(p.ref),esc(p.par),can("encaissements","a")?`<div class="flex">${btn("enc.ok",p.id,"Confirmer la réception","ok")}${btn("enc.rej",p.id,"Rejeter","er")}</div>`:""]))):"")+
 `<h2>Derniers encaissements</h2>`+tbl(["Reçu","Date","Chauffeur","Montant","Mode","Réf.","Statut"],S.payments.filter(p=>p.statut!=="a_verifier").slice(-40).reverse().map(p=>{const r=by(S.receipts,p.receipt_id);return tr([r?esc(r.numero):"—",fd(p.date_valeur),esc(chauffeurNom(p.driver_id)),fcfa(p.montant),esc(p.mode),esc(p.ref),badge(p.statut,p.statut==="confirme"?"ok":"er")])}));
};

A["enc.open"]=did=>{
 const idem=uid("k"),st={d:did||"",type:"echeances",sel:null};
 const m=modal("");const box=m.firstChild;
 const draw=()=>{
  const d=st.d?by(S.drivers,st.d):null,am=allocMap(),obs=d?S.obligations.filter(o=>o.driver_id===d.id&&soldeM(o,am)>0).sort((a,b)=>a.date_ech.localeCompare(b.date_ech)):[],
   cts=d?S.contracts.filter(c=>c.driver_id===d.id&&c.statut==="actif"&&(c.depot||0)>(c.depot_verse||0)):[];
  if(!st.sel)st.sel=new Set(obs.map(o=>o.id));
  const tot=sum(obs.filter(o=>st.sel.has(o.id)),o=>soldeM(o,am));
  box.innerHTML=`<div class="between"><h2 style="margin:0">Encaissement</h2><button class="btn ghost" data-x>Fermer</button></div>
  <label>Chauffeur (recherche : nom)</label><input id="q" placeholder="Rechercher…"><select id="drv">${opt(drvOpts(),st.d,"— Choisir —")}</select>
  ${d?`<div class="grid" style="margin-top:10px"><div class="kpi e"><div class="v">${fcfa(sum(obs,o=>soldeM(o,am)))}</div><div class="l">Total dû</div></div><div class="kpi"><div class="v">${obs.filter(o=>retardJ(o,am)>0).length}</div><div class="l">Échéances en retard</div></div></div>
  ${cts.length?`<div class="tabs"><button class="${st.type==="echeances"?"on":""}" data-t="echeances">Échéances</button><button class="${st.type==="depot"?"on":""}" data-t="depot">Dépôt de garantie</button></div>`:""}
  ${st.type==="echeances"?tbl(["","Échéance","Date","Solde","Retard"],obs.map(o=>tr([`<input type="checkbox" data-o="${o.id}" ${st.sel.has(o.id)?"checked":""}>`,"ECH-"+String(o.num).padStart(5,"0"),fd(o.date_ech),fcfa(soldeM(o,am)),retardJ(o,am)?retardJ(o,am)+" j":"—"])),{empty:"Aucune échéance impayée."}):`<label>Contrat</label><select id="ct">${opt(cts.map(c=>[c.id,c.numero+" — reste "+fcfa(c.depot-c.depot_verse)]),"")}</select>`}
  <div class="fg"><div><label>Montant reçu (F)</label><input id="mt" type="number" min="1" value="${st.mt??tot}"></div><div><label>Mode</label><select id="md">${opt([["especes","Espèces"],["mobile","Mobile Money"],["virement","Virement"]],st.mode||"especes")}</select></div>
  <div><label>Référence transaction ${(st.mode||"especes")==="especes"?"(non requise)":"*"}</label><input id="rf" value="${esc(st.rf||"")}"></div><div><label>Date de valeur</label><input id="dv" type="date" value="${st.dv||today()}" max="${today()}"></div></div>
  <p class="mu sm" id="pv"></p><button class="btn" id="go">Confirmer l'encaissement</button>`:""}`;
  $("[data-x]",box).onclick=()=>m.remove();
  $("#q",box).oninput=e=>{const q=e.target.value.toLowerCase();$("#drv",box).innerHTML=opt(drvOpts().filter(x=>x[1].toLowerCase().includes(q)),st.d,"— Choisir —")};
  $("#drv",box).onchange=e=>{st.d=e.target.value;st.sel=null;st.mt=undefined;draw()};
  if(!d)return;
  box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{st.type=b.dataset.t;st.mt=undefined;draw()});
  box.querySelectorAll("[data-o]").forEach(c=>c.onchange=()=>{c.checked?st.sel.add(c.dataset.o):st.sel.delete(c.dataset.o);st.mt=undefined;st.mode=$("#md",box).value;st.rf=$("#rf",box).value;draw()});
  $("#md",box).onchange=e=>{st.mode=e.target.value;st.mt=+$("#mt",box).value;st.rf=$("#rf",box).value;draw()};
  const prev=()=>{try{const mt=+$("#mt",box).value;if(st.type==="echeances"){const p=planAlloc(d.id,mt,[...st.sel]);$("#pv",box).textContent="Imputation : "+p.map(x=>"ECH-"+String(by(S.obligations,x.ob).num).padStart(5,"0")+" "+fcfa(x.m)).join(" · ")}else $("#pv",box).textContent=""}catch(x){$("#pv",box).textContent="⚠ "+x.message}};
  $("#mt",box).oninput=prev;prev();
  $("#go",box).onclick=async()=>{const b=$("#go",box);b.disabled=true;
   const f={driver_id:d.id,montant:+$("#mt",box).value,mode:$("#md",box).value,ref:$("#rf",box).value,date_valeur:$("#dv",box).value,idem,obs:[...st.sel],type:st.type,contract_id:st.type==="depot"?$("#ct",box).value:null};
   const r=atomic(()=>enregistrerPaiement(f));
   if(r===false){b.disabled=false;return}
   m.remove();render();const p=S.payments.find(x=>x.idem===idem);
   if(p&&p.statut==="confirme")recu(by(S.receipts,p.receipt_id));else alert("Paiement enregistré : en attente de vérification de la réception des fonds.");};
 };
 draw();
};
function recu(r){
 const p=by(S.payments,r.payment_id)||{},d=by(S.drivers,r.driver_id)||{},v=S.assignments.find(a=>a.driver_id===d.id&&!a.fin),am=allocMap();
 modal(`<div class="noprint flex"><button class="btn" onclick="window.print()">Imprimer</button><button class="btn ghost" onclick="this.closest('.md').remove()">Fermer</button></div>
 <h1>REÇU ${esc(r.numero)} ${r.statut==="annule"?"— ANNULÉ":""}</h1><p><b>ANGEL'S &amp; CO TRANSPORT</b> — Yopougon, Abidjan</p>

 if(hashPin("bk",JSON.stringify(o.data))!==o.sum)throw new Error("Somme de contrôle incorrecte : sauvegarde altérée.");
 const keep=S.tries,meId=ME.id;S=o.data;S.tries=keep||{};migrerAtelier();ME=by(S.users,meId)||null;audit("Sauvegarde restaurée");return integrite();
}
A["bk.imp"]=async()=>{const f=$("#bkf");if(!f||!f.files[0])return alert("Choisir un fichier.");const txt=await f.files[0].text();const snap=JSON.stringify(S);try{const pb=restaurer(txt);save();alert(pb.length?"Restauré avec anomalies :\n"+pb.join("\n"):"Restauration réussie : intégrité vérifiée.");render()}catch(e){S=JSON.parse(snap);ME=by(S.users,ME.id);alert(e.message)}};
A["bk.chk"]=()=>{const p=integrite();alert(p.length?"Anomalies :\n"+p.join("\n"):"Intégrité OK : écritures équilibrées, soldes cohérents, caisse rapprochée.")};

/* ---- Portail chauffeur ---- */
function portalData(did){
 guardDriver(did);const am=allocMap(),obs=S.obligations.filter(o=>o.driver_id===did).sort((a,b)=>b.date_ech.localeCompare(a.date_ech)||b.num-a.num);
 return{am,obs,solde:soldeTiers(by(S.drivers,did).tiers_id),recus:S.receipts.filter(r=>r.driver_id===did&&r.statut==="valide").slice().reverse()};
}
function creerDemande(f){
 const d=meDriver();if(!d)throw new Error("Réservé aux chauffeurs.");need("portail","v");
 if(!String(f.texte||"").trim())throw new Error("Message requis.");
 if(f.ob){const o=by(S.obligations,f.ob);if(!o||o.driver_id!==d.id)throw new Error("Accès refusé : échéance d'un autre chauffeur.")}
 const r={id:uid("rq"),driver_id:d.id,type:f.type,ob:f.ob||null,texte:f.texte,pj:f.pj||null,payload:f.payload||null,statut:"ouverte",t:now()};S.requests.push(r);
 S.notifs.push({id:uid("nt"),to:"staff",titre:"Demande de "+d.nom,texte:f.type,t:now(),lu:{}});audit("Demande chauffeur",f.type);return r;
}
function signalerIncident(f){const d=meDriver();if(!d)throw new Error("Réservé aux chauffeurs.");const as=S.assignments.find(a=>a.driver_id===d.id&&!a.fin);if(!as)throw new Error("Aucun véhicule affecté.");return creerIncident({vehicle_id:as.vehicle_id,driver_id:d.id,date:f.date,type:f.type,description:f.description,pj:f.pj},true)}
function changerPin(oldp,newp){if(ME.h!==hashPin(ME.id,oldp))throw new Error("PIN actuel incorrect.");if(!/^\d{4}$/.test(newp))throw new Error("Nouveau PIN : 4 chiffres.");ME.h=hashPin(ME.id,newp);by(S.users,ME.id).h=ME.h;audit("PIN modifié")}
const myNotifs=()=>{const d=meDriver();return S.notifs.filter(n=>n.to==="*"||n.to===d.id).slice().reverse()};
V.p_accueil=()=>{
 const d=meDriver();if(!d)return"<h1>Accueil</h1><div class='card'>Profil chauffeur introuvable.</div>";const P=portalData(d.id),as=S.assignments.find(a=>a.driver_id===d.id&&!a.fin),c=S.contracts.find(c=>c.driver_id===d.id&&c.statut==="actif"),next=P.obs.filter(o=>soldeM(o,P.am)>0).slice().reverse().slice(0,3),nn=myNotifs();
 return `<h1>Bonjour ${esc(d.nom.split(" ")[0])}</h1><div class="grid"><div class="kpi"><div class="v">${esc(as?vehImmat(as.vehicle_id):"—")}</div><div class="l">Mon véhicule</div></div><div class="kpi"><div class="v">${c?esc(c.mode==="recette"?"Recette "+fcfa(c.montant)+"/jour":"Location "+fcfa(c.montant)+"/"+c.periodicite):"—"}</div><div class="l">Mode d'exploitation</div></div><div class="kpi ${P.solde?"e":"o"}"><div class="v">${fcfa(P.solde)}</div><div class="l">Solde restant dû</div></div></div>
 <h2>Prochaines échéances</h2>${tbl(["Date","Montant","Solde","Retard"],next.map(o=>tr([fd(o.date_ech),fcfa(o.montant),fcfa(soldeM(o,P.am)),retardJ(o,P.am)?`<b style="color:var(--er)">${retardJ(o,P.am)} j</b>`:"—"])),{empty:"Aucune échéance impayée."})}
 <h2>Notifications (${nn.length})</h2>${nn.slice(0,10).map(n=>`<div class="card"><b>${esc(n.titre)}</b> <span class="mu sm">${fdt(n.t)}</span><br>${esc(n.texte)}</div>`).join("")||'<div class="card mu">Aucune notification.</div>'}`;
};
V.p_compte=()=>{const d=meDriver(),P=portalData(d.id);return `<h1>Mon compte</h1><div class="grid"><div class="kpi ${P.solde?"e":"o"}"><div class="v">${fcfa(P.solde)}</div><div class="l">Solde restant dû</div></div></div><div class="note">Seuls les paiements confirmés par le bureau sont affichés.</div>`+tbl(["Date","Montant","Versé","Solde","État",""],P.obs.slice(0,60).map(o=>{const s=soldeM(o,P.am);return tr([fd(o.date_ech),fcfa(o.montant),fcfa(P.am[o.id]||0),fcfa(s),o.exo?badge("Exonérée","wa"):s===0?badge("Soldée","ok"):badge(retardJ(o,P.am)?"En retard":"À payer",retardJ(o,P.am)?"er":""),btn("p.contest",o.id,"Contester","ghost")])}))};
V.p_recus=()=>{const d=meDriver(),P=portalData(d.id);return `<h1>Mes reçus</h1>`+tbl(["N°","Date","Montant",""],P.recus.map(r=>tr([esc(r.numero),fd(r.date),fcfa(r.montant),btn("rc.print",r.id,"Voir / imprimer","ghost")])),{empty:"Aucun reçu."})};
V.p_vehicule=()=>{const d=meDriver(),as=S.assignments.find(a=>a.driver_id===d.id&&!a.fin),v=as&&by(S.vehicles,as.vehicle_id),c=S.contracts.find(c=>c.driver_id===d.id&&c.statut==="actif");return `<h1>Mon véhicule</h1>`+(v?`<div class="card"><b>${esc(v.immat)}</b> — ${esc(v.marque+" "+(v.modele||""))} · ${badge(VST[v.statut],v.statut==="actif"?"ok":"wa")}<p>Assurance ${dateBadge(v.assurance_fin)} · Visite technique ${dateBadge(v.visite_fin)} · Carte de transport ${dateBadge(v.carte_fin)}</p>${c?`<p>Contrat ${esc(c.numero)} : ${esc(c.mode)} ${fcfa(c.montant)} (${esc(c.periodicite)}) depuis ${fd(c.debut)}</p>`:""}</div>`:'<div class="card mu">Aucun véhicule affecté.</div>')};
V.p_incident=()=>{const d=meDriver();return `<h1>Signaler un incident</h1><p><button class="btn" data-a="p.inc">Signaler une panne / un incident</button></p>`+tbl(["N°","Date","Type","Description","Statut"],S.incidents.filter(i=>i.driver_id===d.id).slice().reverse().map(i=>tr([esc(i.numero),fd(i.date),esc(i.type),esc(i.description),badge(SIN[i.statut],i.statut==="clos"?"ok":"wa")])),{empty:"Aucun signalement."})};
V.p_demandes=()=>{const d=meDriver();return `<h1>Mes demandes</h1><p><button class="btn" data-a="p.dem">Nouvelle demande</button></p>`+tbl(["Date","Type","Message","Statut","Réponse"],S.requests.filter(r=>r.driver_id===d.id).slice().reverse().map(r=>tr([fdt(r.t),esc(r.type),esc(r.texte),badge(r.statut,r.statut==="ouverte"?"wa":r.statut==="traitee"?"ok":"er"),esc(r.reponse||"")])),{empty:"Aucune demande."})};
V.p_profil=()=>{const d=meDriver();return `<h1>Mon profil</h1><div class="card"><p><b>${esc(d.nom)}</b><br>Téléphone : ${esc(d.tel||"—")}<br>Adresse : ${esc(d.adresse||"—")}<br>Permis : ${esc(d.permis_no||"—")} ${dateBadge(d.permis_fin)}</p><div class="flex"><button class="btn" data-a="p.prof">Modifier mes coordonnées</button><button class="btn ghost" data-a="p.pin">Changer mon PIN</button></div><p class="mu sm">Les changements de coordonnées sont soumis à validation du bureau.</p></div>`};
A["p.contest"]=id=>form("Contester une échéance",[{k:"texte",l:"Motif de la contestation",t:"area",req:1,full:1},{k:"pj",l:"Justificatif (facultatif)",t:"file"}],{},o=>creerDemande({type:"contestation",ob:id,texte:o.texte,pj:o.pj}),"Envoyer");
A["p.inc"]=()=>form("Signaler un incident",[{k:"type",l:"Type",t:"select",o:[["panne","Panne"],["accident","Accident"],["autre","Autre"]]},{k:"date",l:"Date",t:"date",req:1},{k:"description",l:"Description",t:"area",req:1,full:1},{k:"pj",l:"Photo",t:"file"}],{date:today()},o=>signalerIncident(o),"Envoyer");
A["p.dem"]=()=>form("Nouvelle demande",[{k:"type",l:"Type",t:"select",o:[["justificatif","Dépôt d'un justificatif"],["contestation","Contestation"],["autre","Autre"]]},{k:"texte",l:"Message",t:"area",req:1,full:1},{k:"pj",l:"Pièce jointe",t:"file"}],{},o=>creerDemande(o),"Envoyer");
A["p.prof"]=()=>{const d=meDriver();form("Modifier mes coordonnées",[{k:"tel",l:"Téléphone"},{k:"adresse",l:"Adresse"}],d,o=>creerDemande({type:"profil",texte:"Changement de coordonnées",payload:{tel:o.tel,adresse:o.adresse}}),"Envoyer pour validation")};
A["p.pin"]=()=>form("Changer mon PIN",[{k:"o",l:"PIN actuel",t:"password",req:1},{k:"n",l:"Nouveau PIN (4 chiffres)",t:"password",req:1}],{},o=>changerPin(o.o,o.n));

/* ---------- Navigation, rendu, événements ---------- */
const NAV=[
 {v:"dashboard",l:"Tableau de bord",i:"📊",g:"Pilotage",e:"E02",m:"*"},{v:"rapports",l:"Rapports",i:"📈",g:"Pilotage",e:"E21",m:"rapports"},
 {v:"vehicules",l:"Véhicules",i:"🚕",g:"Flotte",e:"E03",m:"vehicules"},{v:"chauffeurs",l:"Chauffeurs",i:"🧑‍✈️",g:"Flotte",e:"E04",m:"chauffeurs"},{v:"affectations",l:"Affectations",i:"🔗",g:"Flotte",e:"E05",m:"vehicules"},{v:"contrats",l:"Contrats",i:"📑",g:"Flotte",e:"E06",m:"contrats"},{v:"planning",l:"Planning journalier",i:"🗓️",g:"Flotte",e:"E07",m:"planning"},
 {v:"echeances",l:"Échéances et impayés",i:"⏳",g:"Recouvrement",e:"E08",m:"echeances"},{v:"encaissements",l:"Encaissements",i:"💵",g:"Recouvrement",e:"E09",m:"encaissements"},{v:"recus",l:"Reçus",i:"🧾",g:"Recouvrement",e:"E10",m:"recus"},
 {v:"caisse",l:"Caisse",i:"🏦",g:"Trésorerie",e:"E11",m:"caisse"},{v:"depenses",l:"Dépenses",i:"💸",g:"Trésorerie",e:"E12",m:"depenses"},
 {v:"compta",l:"Comptabilité",i:"📒",g:"Comptabilité",e:"E13",m:"compta"},{v:"tiers",l:"Comptes tiers",i:"👥",g:"Comptabilité",e:"E14",m:"tiers"},{v:"etats",l:"États comptables",i:"📚",g:"Comptabilité",e:"E15",m:"etats"},
 {v:"gps",l:"Carte GPS",i:"📍",g:"GPS",e:"E16",m:"gps"},{v:"gpsdev",l:"Dispositifs GPS",i:"📡",g:"GPS",e:"E17",m:"gps"},

 {v:"users",l:"Utilisateurs et droits",i:"🛡️",g:"Administration",e:"E23",m:"users"},{v:"audit",l:"Audit et paramètres",i:"🗂️",g:"Administration",e:"E24",m:"audit"},
 {v:"p_accueil",l:"Accueil",i:"🏠",g:"Mon espace",e:"P01",m:"portail"},{v:"p_compte",l:"Mon compte",i:"💳",g:"Mon espace",e:"P02",m:"portail"},{v:"p_recus",l:"Mes reçus",i:"🧾",g:"Mon espace",e:"P03",m:"portail"},{v:"p_vehicule",l:"Mon véhicule",i:"🚕",g:"Mon espace",e:"P04",m:"portail"},{v:"p_incident",l:"Signaler un incident",i:"⚠️",g:"Mon espace",e:"P05",m:"portail"},{v:"p_demandes",l:"Mes demandes",i:"✉️",g:"Mon espace",e:"P06",m:"portail"},{v:"p_profil",l:"Mon profil",i:"👤",g:"Mon espace",e:"P07",m:"portail"}
];
const showNav=n=>n.m==="*"?ME.role!=="chauffeur":can(n.m,"v");
function login(uidv,pin){
 const u=by(S.users,uidv);if(!u)return"Compte inconnu.";
 const t=S.tries[u.id]||{n:0,until:0};if(Date.now()<t.until)return"Compte bloqué 1 minute (trop de tentatives).";
 if(!u.actif)return"Compte désactivé.";
 if(u.h===hashPin(u.id,pin)){S.tries[u.id]={n:0,until:0};ME=u;try{sessionStorage.setItem("tr_me",u.id)}catch(x){}view=NAV.find(showNav).v;atomic(()=>{audit("Connexion");generer(today(),true)},true);return null}
 t.n++;if(t.n>=5){t.until=Date.now()+6e4;t.n=0}S.tries[u.id]=t;try{save()}catch(e){}return"PIN incorrect.";
}
function render(){
 const app=$("#app");
 if(!ME){
  app.innerHTML=`<div class="login card"><h1>🚕 ANGEL'S &amp; CO Transport</h1><form id="lf"><label>Compte</label><select name="u">${S.users.filter(u=>u.actif).map(u=>`<option value="${u.id}">${esc(u.nom)} (${esc(ROLES[u.role])})</option>`).join("")}</select><label>PIN</label><input name="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required><p id="le" class="mu sm"></p><button class="btn" style="width:100%">Connexion</button></form><p class="mu sm">PIN oublié ? Contacter l'administrateur pour une réinitialisation.</p><p class="mu sm">Démo — admin 1234 · directeur 0000 · flotte 1111 · caissier 2222 · comptable 3333 · contrôleur 4444 · chauffeurs 0001 à 0004</p>${pwaBtn()?`<p>${pwaBtn()}</p>`:""}<p><a href="index.html">← Hub</a></p></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();const r=login(e.target.u.value,e.target.p.value);if(r)$("#le").textContent=r;else render()};return;
 }
 const items=NAV.filter(showNav);if(!items.some(n=>n.v===view))view=items[0].v;
 let g="",nav="";items.forEach(n=>{if(n.g!==g){g=n.g;nav+=`<div class="gt">${esc(g)}</div>`}nav+=`<a data-a="nav" data-id="${n.v}" class="${n.v===view?"on":""}">${n.i} ${esc(n.l)}</a>`});
 AFTER=null;let body;try{body=V[view]()}catch(e){body=`<div class="card"><b>Erreur d'affichage</b><p>${esc(e.message)}</p></div>`}
 app.innerHTML=`<div class="shell"><aside id="sb"><div class="brand">🚕 ANGEL'S &amp; CO<small>Transport · Yopougon</small></div>${nav}<a href="index.html">🏠 Hub groupe</a><div class="who">${esc(ME.nom)}<br><span class="mu">${esc(ROLES[ME.role])}</span><br>${pwaBtn()?pwaBtn()+"<br>":""}<a data-a="out">Déconnexion</a></div></aside><main><button class="btn ghost burger" data-a="bg">☰ Menu</button>${body}</main></div>`;
 if(AFTER){const f=AFTER;AFTER=null;f()}
}
A["out"]=()=>{atomic(()=>audit("Déconnexion"),true);ME=null;try{sessionStorage.removeItem("tr_me")}catch(x){}render()};
A["bg"]=()=>$("#sb").classList.toggle("open");
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||!S)return;if(t.tagName==="INPUT")return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.id,t,e)}});
document.addEventListener("change",e=>{const t=e.target;if(!S)return;if(t.dataset.f){const[k,p]=t.dataset.f.split(":");(UI.f[k]=UI.f[k]||{})[p]=t.value;render();return}if(t.dataset.a&&t.tagName==="INPUT"&&t.type==="checkbox"&&A[t.dataset.a])A[t.dataset.a](t.dataset.id,t)});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue&&!document.querySelector(".md")){try{S=JSON.parse(e.newValue);if(ME)ME=by(S.users,ME.id);if(ME&&!ME.actif)ME=null;render()}catch(x){}}});
/* ---------- PWA : installation, mise à jour, hors ligne ---------- */
let DEF=null,MAJ=false;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const installe=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaBtn=()=>installe()?"":(DEF||estIOS())?`<a data-a="pwa.inst">📲 Installer l'application</a>`:"";
A["pwa.inst"]=async()=>{if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()}else alert("Sur iPhone / iPad : ouvrir cette page dans Safari, toucher « Partager », puis « Sur l'écran d'accueil ».")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEF=e;if(!document.querySelector(".md"))render()});
window.addEventListener("appinstalled",()=>{DEF=null;render()});
function barre(){
 let b=$("#pwaBar");
 if(!MAJ&&navigator.onLine){if(b)b.remove();return}
 if(!b){b=document.createElement("div");b.id="pwaBar";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px;text-align:center;font-weight:600";document.body.appendChild(b)}
 if(MAJ){b.style.background="var(--b)";b.style.color="#fff";b.innerHTML="Nouvelle version disponible — <a href='#' id='pwaUp' style='color:#fff;text-decoration:underline'>recharger</a>";$("#pwaUp").onclick=ev=>{ev.preventDefault();location.reload()}}
 else{b.style.background="var(--wabg)";b.style.color="var(--wa)";b.textContent="Mode hors ligne — vos données restent enregistrées sur cet appareil"}
}
window.addEventListener("online",barre);window.addEventListener("offline",barre);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let avait=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(avait){MAJ=true;barre()}avait=true});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
barre();
load();
try{const id=sessionStorage.getItem("tr_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
