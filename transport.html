<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9a3412">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>ANGEL'S &amp; CO Transport — Taxi communal</title>
<style>
:root{--b:#c2410c;--b2:#7c2d12;--bg:#faf5f1;--card:#fff;--tx:#2a1a12;--mu:#7a6a60;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#ead9cd;--okbg:#e3f5ea;--wabg:#fff1d6;--erbg:#fde5e5;--bbg:#ffe8db}
@media(prefers-color-scheme:dark){:root{--bg:#1b110c;--card:#2a1b14;--tx:#f5e9e1;--mu:#b8a396;--bd:#4a3226;--okbg:#14351f;--wabg:#3d2e0c;--erbg:#431616;--bbg:#4a2615}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.shell{display:flex;min-height:100vh}
aside{width:230px;background:var(--b2);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;font-size:16px;padding:6px 8px 12px;line-height:1.2}
aside .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
aside .gt{margin:12px 10px 3px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;font-weight:700}
aside a{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;color:#ffe8db;cursor:pointer;text-decoration:none}
aside a:hover{background:rgba(255,255,255,.12)}aside a.on{background:#fff;color:var(--b2);font-weight:700}
aside .who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:12px}
main{flex:1;padding:18px;min-width:0}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:800}.kpi .l{color:var(--mu);font-size:12px}
.kpi.w .v{color:var(--wa)}.kpi.e .v{color:var(--er)}.kpi.o .v{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{background:var(--b2)}.btn.sm{padding:4px 9px;font-size:12px;min-height:0}
.btn.ghost{background:transparent;color:var(--b);border:1px solid var(--b)}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bbg);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.er{background:var(--erbg);color:var(--er)}.badge.mu{background:var(--bd);color:var(--mu)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu)}.sm{font-size:12px}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 9px;background:var(--card);width:100%}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-top:8px}
.fg{display:grid;gap:0 10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md>div{background:var(--card);border-radius:14px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
.burger{display:none}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--wabg);color:var(--wa);font-weight:600}.al.er{background:var(--erbg);color:var(--er)}
@media(max-width:800px){.shell{display:block}aside{position:fixed;z-index:40;height:100%;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.burger{display:inline-block;margin-bottom:10px}main{padding:12px}}
@media print{aside,.noprint,.burger{display:none!important}.md{position:static;background:none;padding:0}.md>div{max-height:none;box-shadow:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY="angels_transport_v2";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString("fr-FR",{timeZone:"UTC"}):"—";
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const daysTo=d=>d?Math.ceil((new Date(d)-new Date(today()))/864e5):null;
let S=null,ME=null,view="dashboard";

/* ---------- Référentiels ---------- */
const VST={actif:"En service",immobilise:"Immobilisé (panne)",fourriere:"En fourrière",hors_service:"Hors service"};
const ROLES={admin:"Administrateur",direction:"Direction",exploitation:"Exploitation",comptable:"Caisse / Comptable",chauffeur:"Chauffeur"};
const NAV=[
 {v:"dashboard",l:"Tableau de bord",i:"📊",g:"Pilotage",r:["admin","direction","exploitation","comptable"]},
 {v:"mes",l:"Mon versement",i:"🧭",g:"Pilotage",r:["chauffeur"]},
 {v:"versements",l:"Versements du jour",i:"💵",g:"Caisse",r:["admin","direction","exploitation","comptable"]},
 {v:"frais",l:"Frais & amendes",i:"🧾",g:"Caisse",r:["admin","exploitation","comptable"]},
 {v:"lignes",l:"Lignes & tarifs",i:"🛣️",g:"Exploitation",r:["admin","exploitation","direction"]},
 {v:"vehicules",l:"Taxis",i:"🚕",g:"Flotte",r:["admin","exploitation","direction"]},
 {v:"chauffeurs",l:"Chauffeurs",i:"🧑‍✈️",g:"Flotte",r:["admin","exploitation","direction"]},
 {v:"carburant",l:"Carburant",i:"⛽",g:"Flotte",r:["admin","exploitation","comptable"]},
 {v:"entretiens",l:"Pannes & entretien",i:"🔧",g:"Flotte",r:["admin","exploitation"]},
 {v:"renta",l:"Rentabilité",i:"📈",g:"Pilotage",r:["admin","direction","comptable"]},
 {v:"users",l:"Utilisateurs & audit",i:"🛡️",g:"Administration",r:["admin"]}
];

/* ---------- Données ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Stockage plein ou indisponible.")}};
const audit=(a,d)=>{S.audit.unshift({t:now(),u:ME?ME.nom:"système",a,d:d||""});S.audit.length=Math.min(S.audit.length,500)};
const seq=(k,pref)=>{S.seq[k]=(S.seq[k]||0)+1;return pref+"-"+new Date().getFullYear()+"-"+String(S.seq[k]).padStart(5,"0")};
function seed(){
 const d=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
 S={seq:{},audit:[],users:[],lignes:[],vehicules:[],chauffeurs:[],versements:[],recus:[],carburant:[],entretiens:[],frais:[]};
 const mkU=(nom,role,pin)=>{const u={id:uid("u"),nom,role,actif:true};u.h=hashPin(u.id,pin);S.users.push(u);return u};
 mkU("Administrateur","admin","1234");mkU("Direction","direction","0000");mkU("Exploitation","exploitation","1111");mkU("Caisse","comptable","2222");
 const mkL=(nom,dep,arr,t)=>{const l={id:uid("l"),nom,depart:dep,arrivee:arr,tarif_place:t,places:4};S.lignes.push(l);return l};
 const l1=mkL("Yopougon – Adjamé","Yopougon Siporex","Adjamé Liberté",300),l2=mkL("Cocody Angré – Riviera","Angré 8e tranche","Riviera Palmeraie",200);
 const mkC=(nom,tel,pin)=>{const u=mkU(nom,"chauffeur",pin);const c={id:uid("ch"),user_id:u.id,nom,tel,permis_no:"P"+pin,permis_fin:d(400),cni:"",caution:50000};S.chauffeurs.push(c);return c};
 const c1=mkC("Moussa Koné","0707000001","0001"),c2=mkC("Yao Kouassi","0707000002","0002"),c3=mkC("Issouf Traoré","0707000003","0003");
 const mkV=(im,ma,l,c,vj,km,ass,vis,pat)=>{const v={id:uid("v"),immat:im,marque:ma,places:4,ligne_id:l.id,chauffeur_id:c.id,versement_jour:vj,repos:"dimanche",carb_charge:"chauffeur",statut:"actif",km,prochain_km:km+5000,assurance_fin:ass,visite_fin:vis,patente_fin:pat};S.vehicules.push(v);return v};
 mkV("1234 AB 01","Toyota Corolla",l1,c1,15000,184000,d(200),d(15),d(300));mkV("5678 CD 01","Hyundai Accent",l1,c2,14000,152500,d(12),d(120),d(300));mkV("9012 EF 01","Kia Rio",l2,c3,12000,98700,d(300),d(300),d(300));
 S.entretiens.push({id:uid("e"),date:today(),vehicule_id:S.vehicules[1].id,type:"Vidange + filtres",cout:35000,km:152000,prochain_km:157000,jours_immo:0});
 save();
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}if(!S||!S.users)seed()}
const by=(arr,id)=>arr.find(x=>x.id===id);
const lig=id=>(by(S.lignes,id)||{}).nom||"—",veh=id=>(by(S.vehicules,id)||{}).immat||"—",chf=id=>(by(S.chauffeurs,id)||{}).nom||"—";
const total=(arr,k)=>arr.reduce((s,x)=>s+(+x[k]||0),0);
const reste=x=>Math.max(0,x.du-x.verse);
const stv=x=>x.du===0?["Dispensé","mu"]:x.verse>=x.du?["Payé","ok"]:x.verse>0?["Partiel","wa"]:["Impayé","er"];
const soldeChf=id=>total(S.versements.filter(x=>x.chauffeur_id===id).map(x=>({r:reste(x)})),"r");

/* ---------- UI de base ---------- */
const can=v=>NAV.find(n=>n.v===v&&n.r.includes(ME.role));
function modal(html){const m=document.createElement("div");m.className="md";m.innerHTML="<div>"+html+"</div>";m.addEventListener("mousedown",e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function form(title,fields,init,onSave){
 const m=modal(`<h2 style="margin-top:0">${esc(title)}</h2><form class="fg">${fields.map(f=>`<div><label>${esc(f.l)}${f.req?" *":""}</label>${
  f.t==="select"?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`:
  f.t==="area"?`<textarea name="${f.k}" rows="2"></textarea>`:`<input name="${f.k}" type="${f.t||"text"}" ${f.t==="number"?'step="any" min="0"':""} ${f.req?"required":""} autocomplete="off">`}</div>`).join("")}
  <div style="grid-column:1/-1" class="flex"><button class="btn">Enregistrer</button><button type="button" class="btn ghost" data-x>Annuler</button></div></form>`);
 const fm=$("form",m);fields.forEach(f=>{const e=fm.elements[f.k];if(e&&init&&init[f.k]!=null)e.value=init[f.k]});
 $("[data-x]",m).onclick=()=>m.remove();
 fm.onsubmit=e=>{e.preventDefault();const o={};fields.forEach(f=>{let v=fm.elements[f.k].value.trim();o[f.k]=f.t==="number"?(+v||0):v});if(onSave(o)!==false){m.remove();save();render()}};
}
function csv(name,head,rows){const q=v=>'"'+String(v??"").replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';
 const b=new Blob(["﻿"+[head,...rows].map(r=>r.map(q).join(";")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const badge=(t,c)=>`<span class="badge ${c||""}">${esc(t)}</span>`;
function table(cols,rows,empty){return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${cols.length}" class="mu">${esc(empty||"Aucune donnée")}</td></tr>`}</tbody></table></div>`}
const tr=cells=>"<tr>"+cells.map(c=>`<td>${c}</td>`).join("")+"</tr>";
const dateBadge=d=>{const n=daysTo(d);return n==null?"—":badge(fd(d),n<0?"er":n<=30?"wa":"ok")};

/* ---------- Alertes ---------- */
function alertes(){
 const a=[];
 S.vehicules.forEach(v=>{
  [["assurance_fin","Assurance"],["visite_fin","Visite technique"],["patente_fin","Carte de transport"]].forEach(([k,l])=>{const n=daysTo(v[k]);if(n!=null&&n<=30)a.push([n<0,`${l} ${n<0?"expirée":"à renouveler (J-"+n+")"} : ${v.immat}`])});
  if(v.prochain_km&&v.km>=v.prochain_km-500)a.push([v.km>=v.prochain_km,`Entretien dû : ${v.immat} (${v.km} / ${v.prochain_km} km)`]);
  if(v.statut!=="actif")a.push([false,`${VST[v.statut]} : ${v.immat}`]);
 });
 S.chauffeurs.forEach(c=>{
  const n=daysTo(c.permis_fin);if(n!=null&&n<=30)a.push([n<0,`Permis ${n<0?"expiré":"à renouveler (J-"+n+")"} : ${c.nom}`]);
  const v=S.vehicules.find(x=>x.chauffeur_id===c.id),s=soldeChf(c.id);
  if(v&&v.versement_jour&&s>=3*v.versement_jour)a.push([true,`Arriérés ${c.nom} : ${fcfa(s)} (${Math.floor(s/v.versement_jour)} jours)`]);
 });
 return a;
}

/* ---------- Versements ---------- */
function genererJour(d){
 let n=0;
 S.vehicules.forEach(v=>{
  if(v.statut!=="actif"||!v.chauffeur_id||!(v.versement_jour>0))return;
  if(v.repos==="dimanche"&&new Date(d).getUTCDay()===0)return;
  if(S.versements.some(x=>x.vehicule_id===v.id&&x.date===d))return;
  S.versements.push({id:uid("vs"),date:d,vehicule_id:v.id,chauffeur_id:v.chauffeur_id,du:v.versement_jour,verse:0});n++;
 });
 audit("Versements générés",d+" ("+n+")");save();return n;
}
function encaisser(x){
 form("Encaissement — "+chf(x.chauffeur_id)+" · "+fd(x.date),[{k:"montant",l:"Montant reçu (F)",t:"number",req:1},{k:"mode",l:"Mode",t:"select",o:[["especes","Espèces"],["mobile","Mobile Money"],["virement","Virement"]]}],{montant:reste(x)},d=>{
  if(d.montant<=0||d.montant>reste(x))return alert("Montant invalide (reste "+fcfa(reste(x))+")."),false;
  const r={id:uid("r"),numero:seq("rc","RV"),versement_id:x.id,date:today(),montant:d.montant,mode:d.mode,par:ME.nom};
  S.recus.push(r);x.verse+=d.montant;audit("Encaissement",r.numero+" "+d.montant+" F");setTimeout(()=>recu(r),0);
 });
}
function recu(r){
 const x=by(S.versements,r.versement_id)||{},v=by(S.vehicules,x.vehicule_id)||{};
 modal(`<div class="noprint flex"><button class="btn" onclick="window.print()">Imprimer</button><button class="btn ghost" onclick="this.closest('.md').remove()">Fermer</button></div>
 <h1>REÇU DE VERSEMENT ${esc(r.numero)}</h1><p><b>ANGEL'S &amp; CO TRANSPORT — Taxi communal</b></p>
 <p>Date : ${fd(r.date)}<br>Chauffeur : <b>${esc(chf(x.chauffeur_id))}</b><br>Taxi : ${esc(v.immat)} · Ligne : ${esc(lig(v.ligne_id))}<br>Versement du : ${fd(x.date)}</p>
 <p>Montant reçu : <b>${fcfa(r.montant)}</b> (${esc(r.mode)})<br>Dû du jour : ${fcfa(x.du)} · Déjà versé : ${fcfa(x.verse)} · Reste : <b>${fcfa(reste(x))}</b><br>Solde total chauffeur : <b>${fcfa(soldeChf(x.chauffeur_id))}</b></p><p class="mu sm">Encaissé par ${esc(r.par)}</p>`);
}

const V={};
V.versements=()=>{
 const d=window._d||today(),rows=S.versements.filter(x=>x.date===d);
 return `<div class="between"><h1>Versements</h1><div class="flex"><input id="vd" type="date" value="${d}" style="width:auto"><button class="btn" id="gen">Générer les versements du jour</button><button class="btn ghost" data-csv="versements">CSV</button></div></div>
 <div class="grid" style="margin-bottom:14px"><div class="kpi"><div class="v">${fcfa(total(rows,"du"))}</div><div class="l">Attendu</div></div><div class="kpi o"><div class="v">${fcfa(total(rows,"verse"))}</div><div class="l">Encaissé</div></div><div class="kpi e"><div class="v">${fcfa(rows.reduce((s,x)=>s+reste(x),0))}</div><div class="l">Reste à encaisser</div></div></div>`+
 table(["Taxi","Chauffeur","Ligne","Dû","Versé","Reste","État","Solde total","Actions"],rows.map(x=>{const v=by(S.vehicules,x.vehicule_id)||{},[t,c]=stv(x);return tr([esc(v.immat),esc(chf(x.chauffeur_id)),esc(lig(v.ligne_id)),fcfa(x.du),fcfa(x.verse),fcfa(reste(x)),badge(t,c),fcfa(soldeChf(x.chauffeur_id)),
  `<div class="flex">${reste(x)>0?`<button class="btn sm ok" data-enc="${x.id}">Encaisser</button>`:""}${reste(x)>0&&["admin","direction","exploitation"].includes(ME.role)?`<button class="btn sm ghost" data-disp="${x.id}">Dispenser</button>`:""}${S.recus.some(r=>r.versement_id===x.id)?`<button class="btn sm ghost" data-rc="${x.id}">🖨</button>`:""}</div>`])}),"Aucun versement ce jour — cliquer sur « Générer ».")+
 `<h2>Chauffeurs avec arriérés</h2>`+table(["Chauffeur","Taxi","Arriérés"],S.chauffeurs.filter(c=>soldeChf(c.id)>0).map(c=>tr([esc(c.nom),esc((S.vehicules.find(v=>v.chauffeur_id===c.id)||{}).immat||"—"),`<b style="color:var(--er)">${fcfa(soldeChf(c.id))}</b>`])),"Aucun arriéré.");
};
V.dashboard=()=>{
 const d=today(),j=S.versements.filter(x=>x.date===d),al=alertes(),mois=S.versements.filter(x=>x.date.startsWith(d.slice(0,7)));
 return `<h1>Tableau de bord</h1><div class="grid">
 <div class="kpi"><div class="v">${S.vehicules.filter(v=>v.statut==="actif").length}/${S.vehicules.length}</div><div class="l">Taxis en service</div></div>
 <div class="kpi o"><div class="v">${fcfa(total(j,"verse"))}</div><div class="l">Encaissé aujourd'hui</div></div>
 <div class="kpi w"><div class="v">${fcfa(j.reduce((s,x)=>s+reste(x),0))}</div><div class="l">Reste à encaisser aujourd'hui</div></div>
 <div class="kpi o"><div class="v">${fcfa(total(mois,"verse"))}</div><div class="l">Encaissé ce mois</div></div>
 <div class="kpi e"><div class="v">${fcfa(S.versements.reduce((s,x)=>s+reste(x),0))}</div><div class="l">Arriérés totaux</div></div>
 <div class="kpi ${al.length?"e":"o"}"><div class="v">${al.length}</div><div class="l">Alertes</div></div></div>
 ${j.length?"":'<div class="al">Versements du jour non générés — menu « Versements du jour ».</div>'}
 <h2>Alertes</h2>${al.length?al.map(x=>`<div class="al ${x[0]?"er":""}">${esc(x[1])}</div>`).join(""):'<div class="card mu">Aucune alerte.</div>'}`;
};
V.mes=()=>{
 const me=S.chauffeurs.find(c=>c.user_id===ME.id);if(!me)return "<h1>Mon versement</h1><div class='card'>Profil chauffeur introuvable.</div>";
 const v=S.vehicules.find(x=>x.chauffeur_id===me.id)||{},rows=S.versements.filter(x=>x.chauffeur_id===me.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30),j=rows.find(x=>x.date===today());
 return `<h1>Mon versement</h1><div class="grid"><div class="kpi"><div class="v">${esc(v.immat||"—")}</div><div class="l">Mon taxi · ${esc(lig(v.ligne_id))}</div></div>
 <div class="kpi"><div class="v">${fcfa(v.versement_jour)}</div><div class="l">Versement par jour</div></div>
 <div class="kpi ${j&&reste(j)?"w":"o"}"><div class="v">${j?fcfa(reste(j)):"—"}</div><div class="l">Reste aujourd'hui</div></div>
 <div class="kpi ${soldeChf(me.id)?"e":"o"}"><div class="v">${fcfa(soldeChf(me.id))}</div><div class="l">Mes arriérés</div></div></div>
 <h2>Historique</h2>`+table(["Date","Dû","Versé","État"],rows.map(x=>{const[t,c]=stv(x);return tr([fd(x.date),fcfa(x.du),fcfa(x.verse),badge(t,c)])}),"Aucun versement.");
};
function crud(key,title,cols,fields){
 V[key]=()=>`<div class="between"><h1>${title}</h1><div class="flex"><button class="btn" data-add="${key}">+ Ajouter</button><button class="btn ghost" data-csv="${key}">CSV</button></div></div>`+
  table([...cols.map(c=>c[0]),"Actions"],S[key].map(x=>tr([...cols.map(c=>c[1](x)),`<button class="btn sm ghost" data-edit="${key}:${x.id}">✏️</button>`])),"Aucune donnée.");
 CR[key]={fields,cols,title};
}
const CR={};
const VSEL=()=>[["","—"],...S.vehicules.map(v=>[v.immat?v.id:v.id,v.immat])];
const SEL=(arr,f)=>[["","—"],...arr.map(x=>[x.id,f(x)])];
crud("lignes","Lignes & tarifs",[["Ligne",x=>esc(x.nom)],["Départ → Arrivée",x=>esc(x.depart+" → "+x.arrivee)],["Tarif / place",x=>fcfa(x.tarif_place)],["Places",x=>x.places],["Taxis",x=>S.vehicules.filter(v=>v.ligne_id===x.id).length]],
 ()=>[{k:"nom",l:"Nom de la ligne",req:1},{k:"depart",l:"Départ"},{k:"arrivee",l:"Arrivée"},{k:"tarif_place",l:"Tarif par place (F)",t:"number",req:1},{k:"places",l:"Places par taxi",t:"number"}]);
crud("vehicules","Taxis",[["Immat.",x=>esc(x.immat)],["Marque",x=>esc(x.marque)],["Ligne",x=>esc(lig(x.ligne_id))],["Chauffeur",x=>esc(chf(x.chauffeur_id))],["Versement/jour",x=>fcfa(x.versement_jour)],["Statut",x=>badge(VST[x.statut],x.statut==="actif"?"ok":x.statut==="hors_service"?"er":"wa")],["Assurance",x=>dateBadge(x.assurance_fin)],["Visite",x=>dateBadge(x.visite_fin)],["Carte transp.",x=>dateBadge(x.patente_fin)]],
 ()=>[{k:"immat",l:"Immatriculation",req:1},{k:"marque",l:"Marque / modèle"},{k:"places",l:"Places",t:"number"},{k:"ligne_id",l:"Ligne",t:"select",o:SEL(S.lignes,l=>l.nom)},{k:"chauffeur_id",l:"Chauffeur affecté",t:"select",o:SEL(S.chauffeurs,c=>c.nom)},{k:"versement_jour",l:"Versement journalier (F)",t:"number"},{k:"repos",l:"Jour de repos",t:"select",o:[["dimanche","Dimanche"],["aucun","Aucun"]]},{k:"carb_charge",l:"Carburant à la charge de",t:"select",o:[["chauffeur","Chauffeur"],["proprietaire","Propriétaire"]]},{k:"statut",l:"Statut",t:"select",o:Object.entries(VST)},{k:"km",l:"Kilométrage",t:"number"},{k:"prochain_km",l:"Prochain entretien (km)",t:"number"},{k:"assurance_fin",l:"Fin assurance",t:"date"},{k:"visite_fin",l:"Fin visite technique",t:"date"},{k:"patente_fin",l:"Fin carte de transport",t:"date"}]);
crud("chauffeurs","Chauffeurs",[["Nom",x=>esc(x.nom)],["Téléphone",x=>esc(x.tel)],["Taxi",x=>esc((S.vehicules.find(v=>v.chauffeur_id===x.id)||{}).immat||"—")],["Permis",x=>esc(x.permis_no)],["Fin permis",x=>dateBadge(x.permis_fin)],["Caution",x=>fcfa(x.caution)],["Arriérés",x=>soldeChf(x.id)?`<b style="color:var(--er)">${fcfa(soldeChf(x.id))}</b>`:"—"]],
 ()=>[{k:"nom",l:"Nom",req:1},{k:"tel",l:"Téléphone"},{k:"cni",l:"N° CNI"},{k:"permis_no",l:"N° permis"},{k:"permis_fin",l:"Fin de validité du permis",t:"date"},{k:"caution",l:"Caution versée (F)",t:"number"},{k:"pin",l:"PIN de connexion (4 chiffres)"}]);
crud("carburant","Carburant",[["Date",x=>fd(x.date)],["Taxi",x=>esc(veh(x.vehicule_id))],["Litres",x=>x.litres],["Montant",x=>fcfa(x.montant)],["Km",x=>x.km]],
 ()=>[{k:"date",l:"Date",t:"date",req:1},{k:"vehicule_id",l:"Taxi",t:"select",o:VSEL(),req:1},{k:"litres",l:"Litres",t:"number",req:1},{k:"montant",l:"Montant (F)",t:"number",req:1},{k:"km",l:"Km compteur",t:"number"}]);
crud("entretiens","Pannes & entretien",[["Date",x=>fd(x.date)],["Taxi",x=>esc(veh(x.vehicule_id))],["Nature",x=>esc(x.type)],["Coût",x=>fcfa(x.cout)],["Jours immobilisé",x=>x.jours_immo||0],["Manque à gagner",x=>fcfa((x.jours_immo||0)*((by(S.vehicules,x.vehicule_id)||{}).versement_jour||0))],["Km",x=>x.km]],
 ()=>[{k:"date",l:"Date",t:"date",req:1},{k:"vehicule_id",l:"Taxi",t:"select",o:VSEL(),req:1},{k:"type",l:"Nature (vidange, pneus, moteur…)",req:1},{k:"cout",l:"Coût (F)",t:"number",req:1},{k:"jours_immo",l:"Jours d'immobilisation",t:"number"},{k:"immobilise",l:"Mettre le taxi à l'arrêt maintenant ?",t:"select",o:[["non","Non"],["oui","Oui (stoppe les versements)"]]},{k:"km",l:"Km",t:"number"},{k:"prochain_km",l:"Prochain entretien (km)",t:"number"}]);
crud("frais","Frais & amendes",[["Date",x=>fd(x.date)],["Taxi",x=>esc(veh(x.vehicule_id))],["Type",x=>esc(x.type)],["Montant",x=>fcfa(x.montant)],["À la charge de",x=>esc(x.a_charge==="chauffeur"?"Chauffeur":"Propriétaire")]],
 ()=>[{k:"date",l:"Date",t:"date",req:1},{k:"vehicule_id",l:"Taxi",t:"select",o:VSEL(),req:1},{k:"type",l:"Type",t:"select",o:["Amende","Police / contrôle","Fourrière","Parking","Syndicat / gare","Autre"].map(x=>[x,x])},{k:"montant",l:"Montant (F)",t:"number",req:1},{k:"a_charge",l:"À la charge de",t:"select",o:[["proprietaire","Propriétaire"],["chauffeur","Chauffeur"]]}]);
const PFX={lignes:"l",vehicules:"v",chauffeurs:"ch",carburant:"f",entretiens:"e",frais:"d"};
function addEdit(key,x){
 const c=CR[key];
 form((x?"Modifier — ":"Ajouter — ")+c.title,c.fields(),x||{date:today(),statut:"actif",repos:"dimanche",carb_charge:"chauffeur",a_charge:"proprietaire",places:4,immobilise:"non"},d=>{
  if(key==="vehicules"&&d.chauffeur_id&&S.vehicules.some(v=>v.id!==(x&&x.id)&&v.chauffeur_id===d.chauffeur_id))return alert("Ce chauffeur conduit déjà un autre taxi."),false;
  if(key==="vehicules"&&S.vehicules.some(v=>v.id!==(x&&x.id)&&v.immat.toLowerCase()===d.immat.toLowerCase()))return alert("Immatriculation déjà enregistrée."),false;
  if(key==="chauffeurs"){
   if(d.pin&&!/^\d{4}$/.test(d.pin))return alert("PIN : 4 chiffres."),false;
   let u=x&&by(S.users,x.user_id);
   if(!u&&d.pin){u={id:uid("u"),nom:d.nom,role:"chauffeur",actif:true};S.users.push(u);d.user_id=u.id}
   if(u){u.nom=d.nom;if(d.pin)u.h=hashPin(u.id,d.pin)}
   delete d.pin;
  }
  if(key==="entretiens"){const v=by(S.vehicules,d.vehicule_id);if(v){if(d.prochain_km)v.prochain_km=d.prochain_km;if(d.immobilise==="oui")v.statut="immobilise"}delete d.immobilise}
  if(key==="carburant"){const v=by(S.vehicules,d.vehicule_id);if(v&&d.km>v.km)v.km=d.km}
  if(x)Object.assign(x,d);else S[key].unshift({id:uid(PFX[key]),...d});
  audit((x?"Modifié ":"Ajouté ")+key,d.nom||d.immat||d.type||"");
 });
}
const rentaRows=()=>S.vehicules.map(v=>{
 const vs=S.versements.filter(x=>x.vehicule_id===v.id),rev=total(vs,"verse"),
  car=v.carb_charge==="proprietaire"?total(S.carburant.filter(x=>x.vehicule_id===v.id),"montant"):0,
  ent=total(S.entretiens.filter(x=>x.vehicule_id===v.id),"cout"),
  fr=total(S.frais.filter(x=>x.vehicule_id===v.id&&x.a_charge!=="chauffeur"),"montant"),
  imm=S.entretiens.filter(x=>x.vehicule_id===v.id).reduce((s,x)=>s+(x.jours_immo||0),0),
  arr=vs.reduce((s,x)=>s+reste(x),0);
 return {v,rev,car,ent,fr,imm,arr,m:rev-car-ent-fr};});
V.renta=()=>`<div class="between"><h1>Rentabilité par taxi</h1><button class="btn ghost" data-csv="renta">CSV</button></div>`+
 table(["Taxi","Versements encaissés","Carburant (prop.)","Entretien","Frais & amendes","Marge nette","Jours immobilisés","Arriérés"],rentaRows().map(r=>tr([esc(r.v.immat),fcfa(r.rev),fcfa(r.car),fcfa(r.ent),fcfa(r.fr),`<b style="color:var(--${r.m>=0?"ok":"er"})">${fcfa(r.m)}</b>`,r.imm,fcfa(r.arr)])))+
 `<p class="mu sm">Hors amortissement, assurance et taxes. Comptabilité SYSCOHADA à raccorder : versements = 706 prestations de services, carburant 6051, entretien 6241, amendes 6581.</p>`;
V.users=()=>"<h1>Utilisateurs</h1>"+table(["Nom","Rôle","État",""],S.users.map(u=>tr([esc(u.nom),esc(ROLES[u.role]),badge(u.actif?"Actif":"Désactivé",u.actif?"ok":"er"),u.id===ME.id?"":`<button class="btn sm ghost" data-tg="${u.id}">${u.actif?"Désactiver":"Activer"}</button>`])))+
 `<h2>Journal d'audit</h2>`+table(["Date","Utilisateur","Action","Détail"],S.audit.slice(0,100).map(a=>tr([new Date(a.t).toLocaleString("fr-FR"),esc(a.u),esc(a.a),esc(a.d)])));

/* ---------- Rendu & événements ---------- */
function render(){
 const app=$("#app");
 if(!ME){
  app.innerHTML=`<div class="login card"><h1>🚕 ANGEL'S &amp; CO Transport</h1><p class="mu sm" style="margin-top:-8px">Taxi communal</p><form id="lf"><label>Compte</label><select name="u">${S.users.filter(u=>u.actif).map(u=>`<option value="${u.id}">${esc(u.nom)} (${esc(ROLES[u.role])})</option>`).join("")}</select><label>PIN</label><input name="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required><p id="le" class="mu sm"></p><button class="btn" style="width:100%">Connexion</button></form><p class="mu sm">Démo — admin 1234 · direction 0000 · exploitation 1111 · caisse 2222 · chauffeurs 0001 / 0002 / 0003</p><p><a href="hub.html">← Hub</a></p></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();const f=e.target,u=by(S.users,f.u.value);
   S.tries=S.tries||{};const t=S.tries[u.id]||{n:0,until:0};
   if(Date.now()<t.until){$("#le").textContent="Compte bloqué 1 min.";return}
   if(u.h===hashPin(u.id,f.p.value)){S.tries[u.id]={n:0,until:0};ME=u;try{sessionStorage.setItem("tr_me",u.id)}catch(x){}view=can("dashboard")?"dashboard":"mes";audit("Connexion");save();render()}
   else{t.n++;if(t.n>=5){t.until=Date.now()+6e4;t.n=0}S.tries[u.id]=t;save();$("#le").textContent="PIN incorrect."}};
  return;
 }
 if(!can(view))view=NAV.find(n=>n.r.includes(ME.role)).v;
 let g="",nav="";NAV.filter(n=>n.r.includes(ME.role)).forEach(n=>{if(n.g!==g){g=n.g;nav+=`<div class="gt">${esc(g)}</div>`}nav+=`<a data-v="${n.v}" class="${n.v===view?"on":""}">${n.i} ${esc(n.l)}</a>`});
 app.innerHTML=`<div class="shell"><aside id="sb"><div class="brand">🚕 ANGEL'S &amp; CO<small>Transport · Taxi communal</small></div>${nav}<a href="hub.html">🏠 Hub groupe</a><div class="who">${esc(ME.nom)}<br><span class="mu">${esc(ROLES[ME.role])}</span><br><a id="out">Déconnexion</a></div></aside><main><button class="btn ghost burger" id="bg">☰ Menu</button>${V[view]()}</main></div>`;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-v],[data-add],[data-edit],[data-csv],[data-enc],[data-disp],[data-rc],[data-tg],#gen,#out,#bg");if(!t||!S)return;
 if(t.id==="out"){audit("Déconnexion");ME=null;try{sessionStorage.removeItem("tr_me")}catch(x){}save();return render()}
 if(t.id==="bg")return $("#sb").classList.toggle("open");
 if(t.dataset.v){view=t.dataset.v;return render()}
 if(!ME)return;
 if(t.id==="gen"){const n=genererJour(window._d||today());alert(n+" versement(s) généré(s).");return render()}
 if(t.dataset.enc)return encaisser(by(S.versements,t.dataset.enc));
 if(t.dataset.disp){const x=by(S.versements,t.dataset.disp);if(x&&confirm("Dispenser le reste ("+fcfa(reste(x))+") ?")){x.du=x.verse;x.dispense=true;audit("Versement dispensé",chf(x.chauffeur_id)+" "+x.date);save();render()}return}
 if(t.dataset.rc){const r=S.recus.filter(r=>r.versement_id===t.dataset.rc).pop();return r&&recu(r)}
 if(t.dataset.add)return addEdit(t.dataset.add);
 if(t.dataset.edit){const[k,i]=t.dataset.edit.split(":");return addEdit(k,by(S[k],i))}
 if(t.dataset.tg){const u=by(S.users,t.dataset.tg);u.actif=!u.actif;audit("Compte "+(u.actif?"activé":"désactivé"),u.nom);save();return render()}
 if(t.dataset.csv){const k=t.dataset.csv;
  if(k==="versements")return csv(k,["Date","Taxi","Chauffeur","Dû","Versé","Reste"],S.versements.map(x=>[x.date,veh(x.vehicule_id),chf(x.chauffeur_id),x.du,x.verse,reste(x)]));
  if(k==="renta")return csv(k,["Taxi","Versements","Carburant","Entretien","Frais","Marge","Jours immobilisés","Arriérés"],rentaRows().map(r=>[r.v.immat,r.rev,r.car,r.ent,r.fr,r.m,r.imm,r.arr]));
  const c=CR[k];return csv(k,c.cols.map(x=>x[0]),S[k].map(x=>c.cols.map(col=>col[1](x).replace(/<[^>]*>/g,"").replace(/&amp;/g,"&"))))}
});
document.addEventListener("change",e=>{if(e.target.id==="vd"&&e.target.value){window._d=e.target.value;render()}});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue&&!document.querySelector(".md")){try{S=JSON.parse(e.newValue);if(ME)ME=by(S.users,ME.id)||null;if(ME&&!ME.actif)ME=null;render()}catch(x){}}});
load();
try{const id=sessionStorage.getItem("tr_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
</script>
