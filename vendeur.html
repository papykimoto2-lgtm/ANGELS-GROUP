<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e7490">
<link rel="manifest" href="manifest-vendeur-app.webmanifest">
<link rel="icon" type="image/png" href="icons/vendeur-192.png">
<link rel="apple-touch-icon" href="icons/vendeur-apple-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Espace vendeur">
<title>Vendeur — ANGEL'S GROUP</title>
<style>
:root{--b:#0e7490;--b2:#0b3b4c;--bg:#f1f6f8;--card:#fff;--tx:#1b2240;--mu:#6b7390;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#d6e4ea}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.hd{background:var(--b2);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd small{opacity:.75;display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;margin:10px 0 0}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:#fff;margin-top:4px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:var(--b);color:#fff;font-weight:700;margin-top:8px;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn.ghost{background:#fff;color:var(--b);border:1px solid var(--b)}.btn.wa{background:var(--wa)}
.btn:disabled{opacity:.5}
.mu{color:var(--mu)}.sm{font-size:13px}
.between{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.al{border-radius:10px;padding:10px;margin:10px 0;background:#fff1d6;color:#7a4a00}.al.er{background:#fde5e5;color:var(--er)}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#e3eef3;color:var(--b2)}
.hide{display:none!important}
.bg{width:auto!important;margin:0!important;padding:8px 14px!important;font-size:20px;line-height:1}
.pg{font-size:18px;margin:6px 0 2px}
.dr{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}.dr .bk{position:absolute;inset:0;background:rgba(10,20,30,.55)}
.dr nav{position:relative;background:#fff;width:min(86vw,340px);height:100%;padding:16px;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
.mi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:14px 12px;margin-top:8px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-weight:700;color:var(--b2);cursor:pointer}
.mi.on{background:#e3eef3;border-color:var(--b)}.mi.er{color:var(--er)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp>div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.kp b{display:block;font-size:20px}.kp span{font-size:12px;color:var(--mu)}
.lg{display:grid;grid-template-columns:1fr 70px 100px 40px;gap:6px;margin-top:6px}.lg input{margin-top:0}.lg button{border:1px solid var(--er);color:var(--er);background:#fff;border-radius:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmb{position:relative;display:block}.cmb input{padding-right:44px}
.cmbb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;font-size:20px;color:var(--mu);cursor:pointer;border-radius:10px;margin:0;padding:0}
.cmbb .chev{display:block;width:9px;height:9px;margin:0 auto;border-right:2.5px solid var(--mu);border-bottom:2.5px solid var(--mu);transform:translateY(-3px) rotate(45deg)}
.cmbl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;margin:0;padding:4px;list-style:none;background:#fff;border:1.5px solid var(--b);border-radius:12px;box-shadow:0 10px 28px rgba(15,40,60,.22);max-height:240px;overflow:auto;color:var(--tx)}
.cmbl li{padding:12px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-size:15px}.cmbl li em{font-style:normal;font-weight:600;color:var(--b);font-size:12px}.cmbl li small{color:var(--mu);font-size:12px}
.cmbl li:hover,.cmbl li:focus{background:#eaf3f6}.cmbl li.cmbv{color:var(--mu);font-size:13px;cursor:default}.cmbl li.cmbv:hover{background:none}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--b2);color:#fff;padding:10px 16px;border-radius:99px;z-index:40;max-width:90%}
</style>
<link rel="stylesheet" href="champs.css">
</head>
<body>
<div id="app"></div>
<div id="toast" class="hide"></div>
<script src="passerelle-config.js"></script>
<script src="marque.js"></script>
<script src="qrcode.js"></script>
<script>
/* Application VENDEUR PARTENAIRE : même charpente et même style que l'application livreur (en-tête, cartes, menu ☰, connexion serveur).
   Le vendeur n'ouvre jamais le logiciel du bureau : il ne voit que ses propres commandes, règlements et son lien client. */
"use strict";
const CFG=(()=>{const d=window.ANGELS_PASSERELLE||{};try{const o=JSON.parse(localStorage.getItem("angels_supabase")||"null");if(o&&o.off)return{};if(o&&o.url&&o.key)return{url:o.url,key:o.key}}catch(e){}return d})(),FN=String(CFG.url||"").replace(/\/+$/,"")+"/functions/v1/";
const SB_LIB="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",SB_SRI="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fcfa=n=>(Math.round(+n||0)).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const identDe=i=>String(i||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9._-]+/g,".").replace(/\.{2,}/g,".").replace(/^\.|\.$/g,"");
const emailDe=i=>{i=String(i||"").trim();return i.includes("@")?i.toLowerCase():identDe(i)+"@users.angels-erp.app"};
const LS={s:"ang_vd_sig",i:"ang_vd_ident",x:"ang_vd_idents",q:"ang_vd_file",e:"ang_vd_envoyees",f:"ang_vd_dm_faites",n:"ang_vd_push",d:"ang_vd_pushinv"};
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let sb=null,user=null,moi=null,PAGE="accueil",MENU=false,APPV="",D=null,erreur="",GPS=null,DEM=null,SIG="",SIGERR="",LIVE=undefined,LIVEEN=false,STATS=null,LIVEFORM=false;
const memoIdent=(i,n)=>{if(!i)return;const a=lsGet(LS.x,[]).find(o=>o&&o.i===i);lsSet(LS.x,[{i,n:n||(a&&a.n)||""}])};
const versionTxt=()=>APPV?"Version "+APPV:"";
const enLigne=()=>navigator.onLine!==false;
function toast(m,t){const e=$("#toast");e.textContent=m;e.style.background=t==="err"?"#c62828":"#0b3b4c";e.classList.remove("hide");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add("hide"),3500)}
function loadSb(){return new Promise((ok,ko)=>{if(window.supabase)return ok();const sc=document.createElement("script");sc.src=SB_LIB;sc.integrity=SB_SRI;sc.crossOrigin="anonymous";sc.onload=ok;sc.onerror=()=>ko(new Error("Connexion Internet requise pour se connecter"));document.head.appendChild(sc)})}
/* Session propre à l'application vendeur : l'application livreur (même adresse, même stockage du navigateur) garde la sienne, les deux peuvent être installées et connectées sur le même téléphone */
const SESSION_CLE="sb-angels-vendeur-auth";
const client=()=>sb||(sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:SESSION_CLE}}));
async function api(fn,body){let t=null;try{const{data}=await sb.auth.getSession();t=data&&data.session&&data.session.access_token}catch(e){}
 if(!t){const e=new Error("Session expirée : reconnectez-vous");e.status=401;throw e}
 let r;try{r=await fetch(FN+fn,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+t,apikey:CFG.key},body:JSON.stringify(body)})}catch(x){const e=new Error("Réseau indisponible");e.reseau=true;throw e}
 const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false){const e=new Error(j.erreur||("Erreur "+r.status));e.status=r.status;throw e}return j}

/* ---------- Connexion ---------- */
function vueLogin(msg){$("#app").innerHTML=`<div class="hd"><div><b>ANGEL'S — Vendeur</b><small>Connexion sécurisée</small></div></div><div class="wrap"><div class="card"><form id="fl" autocomplete="on"><label for="li">Identifiant</label><span class="cmb"><input id="li" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required role="combobox" aria-expanded="false" aria-controls="vdl"><button type="button" id="vdb" class="cmbb" aria-label="Choisir un vendeur dans la liste"><i class="chev" aria-hidden="true"></i></button><ul id="vdl" class="cmbl" role="listbox" hidden></ul></span><label>Mot de passe<input id="lp" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" required></label>${msg?`<div class="al er">${esc(msg)}</div>`:""}<button class="btn" type="submit">Se connecter</button></form></div><div class="inst"></div><div class="sm mu">Votre mot de passe est vérifié par le serveur. Cet espace est réservé aux vendeurs partenaires.</div><div class="sm mu sanix" style="margin-top:14px;text-align:center">Logiciel développé par <b>Sanix Africa Division Technologies</b> · WhatsApp : +225 0779181075 / 0140017751</div><div class="sm mu appv" style="text-align:center;margin-top:6px">${versionTxt()}</div></div>`;
 /* Liste déroulante des vendeurs : ceux de la base (fonction « vendeurs-liste », identifiant + nom seulement), le vendeur enregistré sur cet appareil en tête ; hors ligne : celui de l'appareil. */
 try{const ul=$("#vdl"),bt=$("#vdb"),inp=$("#li"),ouvre=v=>{ul.hidden=!v;inp.setAttribute("aria-expanded",v?"true":"false")};
  let L=lsGet(LS.x,[]).slice(0,1).map(o=>Object.assign({},o,{loc:true})),ET=CFG.url?"charge":"hors";
  const msg={charge:"Chargement des vendeurs…",hors:"Liste du serveur indisponible (hors ligne ou non activée). Saisissez votre identifiant.",vide:"Aucun vendeur actif enregistré. Saisissez votre identifiant."};
  const dessine=()=>{ul.innerHTML=L.map(o=>`<li role="option" tabindex="-1" data-i="${esc(o.i)}"><b>${esc(o.n||o.i)}${o.loc?` <em>· déjà utilisé sur ce téléphone</em>`:""}</b>${o.n?`<small>${esc(o.i)}</small>`:""}</li>`).join("")+(ET==="ok"&&L.length?"":`<li class="cmbv" aria-disabled="true">${esc(msg[ET]||msg.hors)}</li>`)};
  dessine();
  bt.onclick=()=>{dessine();ouvre(ul.hidden)};
  const auto=()=>{if(!inp.value){dessine();ouvre(true)}};inp.addEventListener("focus",auto);inp.addEventListener("click",auto);
  ul.onclick=e=>{const li=e.target.closest("li[data-i]");if(!li)return;inp.value=li.dataset.i;ouvre(false);$("#lp").focus()};
  document.addEventListener("click",e=>{if(!e.target.closest(".cmb"))ouvre(false)});
  inp.addEventListener("input",()=>ouvre(false));
  if(CFG.url){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),4000);
   fetch(FN+"vendeurs-liste",{cache:"no-store",signal:ac.signal}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{clearTimeout(to);if(!j||!j.ok||!Array.isArray(j.vendeurs))throw 0;
    const me=L[0]&&L[0].i,R=j.vendeurs.filter(x=>x&&x.ident).map(x=>({i:String(x.ident),n:String(x.nom||""),loc:x.ident===me}));
    if(!R.length){ET=L.length?"ok":"vide";return}
    R.sort((p,q)=>(q.loc?1:0)-(p.loc?1:0));L=R;ET="ok";if(!ul.hidden)dessine()}).catch(()=>{ET=L.length?"ok":"hors";if(!ul.hidden)dessine()})}}catch(e){}
 try{const q=new URLSearchParams(location.search).get("id"),i=identDe(q||"")||lsGet(LS.i,"");if(i){$("#li").value=i;$("#lp").focus()}}catch(e){}
 $("#fl").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;try{await loadSb();client();const em=emailDe($("#li").value),pw=$("#lp").value;let{error}=await sb.auth.signInWithPassword({email:em,password:pw});
   /* le clavier du téléphone ajoute souvent une espace après le dernier mot : on réessaie sans les espaces de début et de fin */
   if(error&&/invalid login/i.test(error.message)&&pw.trim()&&pw!==pw.trim())({error}=await sb.auth.signInWithPassword({email:em,password:pw.trim()}));
   if(error)throw new Error(/invalid login/i.test(error.message)?"Identifiant ou mot de passe incorrect (identifiant envoyé : "+em.split("@")[0]+")":error.message);lsSet(LS.i,identDe($("#li").value));memoIdent(identDe($("#li").value));await demarrer()}catch(x){vueLogin(x.message)}}}
const mdpValide=m=>m.length>=10&&[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(m)).length>=3;
function vueChangement(){$("#app").innerHTML=`<div class="hd"><div><b>Nouveau mot de passe</b><small>Obligatoire à la première connexion</small></div></div><div class="wrap"><div class="card"><form id="fc"><div class="sm mu">10 caractères minimum, avec au moins 3 types parmi : majuscule, minuscule, chiffre, symbole.</div><label>Nouveau mot de passe<input id="n1" type="password" autocomplete="new-password" required></label><label>Confirmer<input id="n2" type="password" autocomplete="new-password" required></label><div id="cm" class="al er hide"></div><button class="btn" type="submit">Enregistrer</button></form></div></div>`;
 $("#fc").onsubmit=async e=>{e.preventDefault();const a=$("#n1").value,b=$("#n2").value,m=$("#cm");const bad=a!==b?"Les deux mots de passe diffèrent":!mdpValide(a)?"Mot de passe trop faible : 10 caractères minimum, 3 types de caractères":"";
  if(bad){m.textContent=bad;m.classList.remove("hide");return}
  try{const{error}=await sb.auth.updateUser({password:a,data:{chg:false}});if(error)throw error;toast("Mot de passe modifié","ok");await demarrer()}catch(x){m.textContent=x.message;m.classList.remove("hide")}}}

/* ---------- Pages ---------- */
const PAGES=[["accueil","🏠 Accueil"],["demandes","📥 Demandes clients"],["nouvelle","➕ Nouvelle commande"],["commandes","📦 Mes commandes"],["reglages_v","💰 Mes règlements"],["lien","🔗 Mon lien client"],["live","🔴 Live"],["compte","⚙️ Mon compte"]];
function drawerHtml(){return`<div class="dr"><div class="bk" data-a="menu"></div><nav aria-label="Menu">${PAGES.map(([k,t])=>`<button class="mi${PAGE===k?" on":""}" data-a="page" data-p="${k}">${t}${k==="demandes"&&demandes().length?` <span class="bd" style="background:var(--er);color:#fff">${demandes().length}</span>`:""}</button>`).join("")}<button class="mi er" data-a="quitter">⎋ Se déconnecter</button><div class="sm mu appv" style="text-align:center;margin-top:12px">${versionTxt()}</div></nav></div>`}
const vide=t=>`<div class="card mu">${t}</div>`;
const file=()=>lsGet(LS.q,[]),envoyees=()=>lsGet(LS.e,[]);
const faites=()=>lsGet(LS.f,[]),demandes=()=>((D&&D.demandes)||[]).filter(d=>!faites().includes(d.ref));
const horo=t=>{try{return new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return""}};
function carteDemande(d){const tot=d.lignes.reduce((t,l)=>t+(l.pu==null?0:l.qte*l.pu),0),sansPrix=d.lignes.some(l=>l.pu==null),tel=String(d.tel||"").replace(/[^0-9+]/g,"");
 return`<div class="card"><div class="between"><b>${esc(d.nom||"Client")}</b><span class="sm mu">${esc(horo(d.cree_le))}</span></div>
 <div class="sm mu">📍 ${esc([d.quartier,d.zone].filter(Boolean).join(", "))}${d.repere?" · "+esc(d.repere):""}</div>
 <ul style="margin:8px 0 0;padding-left:18px">${d.lignes.map(l=>`<li>${l.qte} × ${esc(l.desig)} <span class="mu sm">${l.pu==null?"— prix à saisir":"— "+fcfa(l.pu)}</span></li>`).join("")}</ul>
 <div class="sm" style="margin-top:6px">${sansPrix?"Prix à compléter":"Total articles : <b>"+fcfa(tot)+"</b>"}</div>
 ${d.note?`<div class="sm mu" style="margin-top:4px">💬 ${esc(d.note)}</div>`:""}
 ${d.acompte?`<div class="sm" style="margin-top:4px">💳 Acompte annoncé par le client : ${fcfa(d.acompte.montant)} (${esc(d.acompte.op||"Mobile Money")}, réf. ${esc(d.acompte.ref||"")})</div>`:""}
 ${d.nb_photos?`<div class="sm mu" style="margin-top:4px">📷 ${d.nb_photos} capture(s) d'écran jointe(s) par le client (à consulter au bureau)</div>`:""}
 <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn" style="margin:0;flex:2" data-a="preparer" data-r="${esc(d.ref)}">🧾 Préparer la commande</button><button class="btn ghost" style="margin:0;flex:1" data-a="refuser" data-r="${esc(d.ref)}">✖ Refuser</button></div>
 ${tel?`<div style="display:flex;gap:6px;margin-top:6px"><a class="btn ghost" style="margin:0;flex:1;text-align:center;text-decoration:none" href="tel:${esc(tel)}">📞 Appeler</a><a class="btn ghost" style="margin:0;flex:1;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${esc(tel.replace(/^\+/,""))}">💬 WhatsApp</a></div>`:""}</div>`}

const refCmd=()=>"VD-"+new Date().toISOString().slice(0,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,8).toUpperCase();
function carteCmd(x){const sv=x.suivi?`<div style="display:flex;gap:6px;margin-top:8px"><button class="btn ghost" style="margin:0" data-a="suivi" data-u="${esc(x.suivi)}">📍 Suivi</button><button class="btn wa" style="margin:0" data-a="suiviwa" data-u="${esc(x.suivi)}" data-n="${esc(x.numero||"")}">💬 Envoyer au client</button></div>`:"";
 return`<div class="card"><div class="between"><b>${esc(x.numero||"")}</b><span class="bd">${esc(x.statut||"")}</span></div><div class="sm mu">${esc(x.client||"")}${x.montant!=null?" · "+fcfa(x.montant):""}${x.date?" · "+esc(x.date):""}</div>${sv}</div>`}
function cartesAttente(c){const vus=new Set(c.map(x=>x.ref).filter(Boolean));
 const q=file().map(o=>`<div class="card"><div class="between"><b>${esc(o.nom||"Client")}</b><span class="bd" style="background:#fff1d6;color:#7a4a00">⏳ À envoyer</span></div><div class="sm mu">${fcfa(o.lignes.reduce((t,l)=>t+l.qte*l.pu,0))} · partira au retour du réseau</div></div>`).join("");
 const e=envoyees().filter(o=>!vus.has(o.ref)).map(o=>`<div class="card"><div class="between"><b>${esc(o.nom||"Client")}</b><span class="bd">Transmise au bureau</span></div><div class="sm mu">${fcfa(o.total)} · en attente de confirmation par le bureau</div></div>`).join("");
 return q+e}
function formCmd(){const Z=(D&&D.zones)||[].slice(),X=DEM;if(X&&X.zone&&!Z.some(z=>z.nom===X.zone))Z.push({nom:X.zone,frais:0});return`<h2 class="pg">Nouvelle commande</h2><form id="fcmd" class="card" autocomplete="off">${X?`<div class="al" style="background:#e3f2fd;color:#0b3b4c">📥 Demande de <b>${esc(X.nom||"client")}</b> (réf. ${esc(X.ref)}) : vérifiez, complétez les prix, puis envoyez.</div>`:""}<div class="sm mu">Rien n'est livré avant la confirmation du bureau.</div>
 <label>Nom du client <span class="mu sm">(vide = client divers)</span><input name="nom" maxlength="80" value="${esc(X?X.nom:"")}"></label>
 <label>Téléphone du client <span class="mu sm">(facultatif)</span><input name="tel" inputmode="tel" maxlength="20" value="${esc(X?X.tel:"")}"></label>
 <label>Zone de livraison${Z.length?`<select name="zone" required><option value="">Choisir…</option>${Z.map(z=>`<option value="${esc(z.nom)}"${X&&X.zone===z.nom?" selected":""}>${esc(z.nom)}${z.frais?" — "+fcfa(z.frais):""}</option>`).join("")}</select>`:`<input name="zone" required maxlength="60">`}</label>
 <div class="g2"><label>Quartier<input name="quartier" maxlength="80" value="${esc(X?X.quartier:"")}"></label><label>Repère<input name="repere" maxlength="120" value="${esc(X?X.repere:"")}"></label></div>
 <div id="gpsl" class="sm mu" style="margin-top:6px">${GPS?"📍 Position du client reprise de la demande":"Position GPS : non renseignée"}</div><button type="button" class="btn ghost" data-a="gps">📍 Utiliser ma position actuelle</button>
 <div class="sec" style="margin-top:12px;font-weight:700">Articles</div><div id="lg">${X&&X.lignes.length?X.lignes.map(l=>ligneHtml(l)).join(""):ligneHtml()}</div><button type="button" class="btn ghost" data-a="addl">➕ Ajouter un article</button>
 <div id="tot" class="sm" style="margin-top:8px"></div>
 <label>Paiement<select name="pay"><option value="livraison">Le client paie à la livraison</option><option value="paye">Déjà payé au vendeur</option><option value="partiel">Acompte payé au vendeur</option></select></label>
 <label id="lpv" class="hide">Montant déjà payé<input name="pv" type="number" min="0" inputmode="numeric"></label>
 <label>Consignes de livraison <span class="mu sm">(facultatif)</span><input name="ins" maxlength="200"></label>

/* ---------- Lien signé, affiche QR, mode Live et statistiques (le vendeur est identifié par sa connexion, sans clé de relève) ---------- */
const sigCle=(n,t)=>String(n||"").trim().slice(0,80).toLowerCase().replace(/\s+/g," ")+"|"+String(t||"").replace(/\D/g,"").slice(0,20);
const ORGNOM=()=>String((D&&D.org)||"ANGEL'S GROUP");
async function signer(renouveler){const k=sigCle(D.nom,D.tel),c=lsGet(LS.s,null);if(!renouveler&&c&&c.k===k&&c.s)return c.s;
 const j=await api("portail-vendeur",{action:renouveler?"lien_renouveler":"lien_signer",boutique:D.nom,tel:String(D.tel||"").replace(/\D/g,"")});lsSet(LS.s,{k,s:String(j.sig||""),rev:j.rev||0});return String(j.sig||"")}
/* Lien court « …/commander?boutique=…&tel=…&ref=… » : on y ajoute la source (qr, live) et la signature ; un autre format de lien est rendu tel quel */
function lienDe(src){const base=D&&D.lien;if(!base)return"";try{const u=new URL(base);if(!/\/commander$/.test(u.pathname))return base;u.searchParams.delete("s");u.searchParams.delete("src");if(src&&src!=="lien")u.searchParams.set("src",src);if(SIG)u.searchParams.set("s",SIG);return u.href}catch(e){return base}}
async function preparerLien(renouveler){if(!(D&&D.lien&&D.nom))return;try{SIGERR="";SIG=await signer(renouveler)}catch(x){SIG="";SIGERR=x.message||"signature indisponible"}if(PAGE==="lien"||PAGE==="live")vue()}
async function chargerStats(){try{const j=await api("portail-vendeur",{action:"stats"});STATS=j.scans||false}catch(x){STATS=false}if(PAGE==="lien")vue()}

function qrCarte(nom,org,lien,live,signe){const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),q=qrcode(0,"M");q.addData(lien);q.make();
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0f3d2e");g.addColorStop(1,"#1d7a4f");x.fillStyle=g;x.fillRect(0,0,W,H);
 const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
 const fit=(t,size,w)=>{let f=size;x.font="800 "+f+"px system-ui,sans-serif";while(x.measureText(t).width>w&&f>28){f-=2;x.font="800 "+f+"px system-ui,sans-serif"}};
 x.textAlign="center";x.fillStyle="#fff";x.font="600 38px system-ui,sans-serif";x.fillText(String(org).toUpperCase().slice(0,40),W/2,live?66:92);
 if(live){x.fillStyle="#d32f2f";rr(W/2-190,88,380,62,31);x.fill();x.fillStyle="#fff";x.font="800 38px system-ui,sans-serif";x.fillText("● EN DIRECT",W/2,132)}
 x.fillStyle="#ffd54a";fit(nom,live?64:76,W-120);x.fillText(nom,W/2,live?226:190);
 x.fillStyle="#fff";x.font="500 42px system-ui,sans-serif";x.fillText(live?String(live).slice(0,34):"Commandez en ligne, en 1 minute",W/2,live?282:262);
 rr(110,310,860,860,44);x.fillStyle="#fff";x.fill();
 const n=q.getModuleCount(),m=Math.floor(780/n),T=m*n,ox=Math.round((W-T)/2),oy=310+Math.round((860-T)/2);x.fillStyle="#000";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(ox+k*m,oy+r*m,m,m);
 x.fillStyle="#fff";x.font="700 44px system-ui,sans-serif";x.fillText("📸 Envoyez la capture d'écran du produit",W/2,1238);
 x.font="400 32px system-ui,sans-serif";x.fillStyle="rgba(255,255,255,.85)";x.fillText(signe?"✔ VENDEUR VÉRIFIÉ · aucun paiement ni mot de passe demandé":"🔒 Lien officiel · aucun paiement ni mot de passe demandé",W/2,1296);return c}
const qrPng=c=>new Promise(ok=>c.toBlob(ok,"image/png"));
function dessinerQr(){const cv=document.getElementById("qrc");if(!cv)return;const live=PAGE==="live"&&LIVE&&LIVE.actif?LIVE.titre:"",lien=lienDe(live?"live":"qr");if(!lien||typeof qrcode==="undefined")return;
 try{const c=qrCarte(D.nom||"",ORGNOM(),lien,live,!!SIG);cv.width=c.width;cv.height=c.height;cv.getContext("2d").drawImage(c,0,0);cv.dataset.nom=(D.nom||"vendeur")+(live?"-live":"")}catch(e){}}

 setTimeout(dessinerQr,0);const lien=lienDe("live");
 return`<h2 class="pg">🔴 Live — ${esc(LIVE.titre)}</h2><div class="card"><div class="sm mu">${LIVE.actif?"Le live est <b>ouvert</b> : vos clients voient ces produits en scannant le QR ou en ouvrant le lien.":"Le live est <b>terminé</b>."}</div>

  <h3 style="margin:12px 0 6px">Produits (touchez pour « épuisé »)</h3><div class="card">${LIVE.produits.map((x,i)=>`<div class="between" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span>${x.ok?"":"<s>"}${esc(x.n)}${x.p!=null?" — "+fcfa(x.p):""}${x.ok?"":"</s>"}</span>${LIVE.actif?`<button type="button" class="btn ${x.ok?"ghost":"er"}" style="width:auto;margin:0;padding:6px 10px" data-a="liveepuise" data-i="${i}">${x.ok?"Épuisé":"Remettre"}</button>`:""}</div>`).join("")}</div>
  <button class="btn ghost" data-a="liveedit">✏ Modifier la liste</button>${LIVE.actif?'<button class="btn er" data-a="livefin">⏹ Terminer le live</button>':'<button class="btn ok" data-a="liveedit">🔴 Relancer</button>'}`}
function liveParse(t){return String(t||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,60).map(x=>{const m=/^(.*?)\s*[;|]\s*(\d[\d\s.]*)\s*(?:F|FCFA|CFA)?\s*$/i.exec(x);return m&&m[1].trim()?{n:m[1].trim().slice(0,120),p:Math.round(+m[2].replace(/[\s.]/g,"")),ok:true}:{n:x.slice(0,120),p:null,ok:true}})}
async function livePublier(l){const j=await api("portail-vendeur",{action:"live_publier",titre:l.titre,produits:l.produits,actif:l.actif});LIVE={titre:l.titre,produits:l.produits,actif:l.actif};return j}

 try{await livePublier({titre:t,produits:P,actif:true});LIVEFORM=false;toast("Live publié","ok");vue()}catch(x){m.textContent=x.message;m.classList.remove("hide")}});

 const total=lignes.reduce((t,l)=>t+l.qte*l.pu,0),bad=!o.zone?"Choisissez la zone de livraison":!lignes.length?"Ajoutez au moins un article":lignes.some(l=>!l.desig||!(l.qte>=1))?"Chaque article doit avoir un nom et une quantité":o.pay==="partiel"&&!(o.paye_vendeur>0&&o.paye_vendeur<=total)?"Indiquez le montant déjà payé (au plus le total des articles)":"";

 moi={nom:md.nom||""};if(md.nom)memoIdent(lsGet(LS.i,""),md.nom);if(md.chg)return vueChangement();

/* ---------- Notifications push (nouvelle demande de client, commande confirmée / livrée) ---------- */
const VAPID=()=>String((window.ANGELS_PASSERELLE||{}).vapid||"").trim();
const pushOk=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const cleVapid=b=>{const p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o};
let PUSHST="";
async function pushEtat(){if(!pushOk())return PUSHST="indispo";if(!VAPID())return PUSHST="bureau";if(Notification.permission==="denied")return PUSHST="refuse";
 try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();PUSHST=s&&Notification.permission==="granted"?"actif":"inactif"}catch(e){PUSHST="inactif"}return PUSHST}
async function pushActiver(){if(!pushOk()||!VAPID())return toast("Notifications push non disponibles","err"),false;
 try{const perm=await Notification.requestPermission();if(perm!=="granted"){PUSHST=perm==="denied"?"refuse":"inactif";toast("Notifications refusées : autorisez-les dans les réglages du navigateur","err");return false}
  const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:cleVapid(VAPID())});
  await api("push-abonner",{action:"abonner",subscription:s.toJSON()});lsSet(LS.n,{on:true,t:Date.now()});PUSHST="actif";toast("Notifications activées : vous serez prévenu même application fermée","ok");return true}
 catch(x){toast("Activation impossible : "+(x&&x.message||x),"err");return false}}
async function pushCouper(){try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s){try{await api("push-abonner",{action:"desabonner",endpoint:s.endpoint})}catch(e){}await s.unsubscribe()}}catch(e){}lsSet(LS.n,{on:false,t:Date.now()});PUSHST="inactif";toast("Notifications coupées","ok")}
async function pushEntretien(){try{if(!pushOk()||!VAPID()||Notification.permission!=="granted"||!sb)return;const n=lsGet(LS.n,{});if(n.on===false||(n.t&&Date.now()-n.t<864e5))return;const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:cleVapid(VAPID())});await api("push-abonner",{action:"abonner",subscription:s.toJSON()});lsSet(LS.n,{on:true,t:Date.now()})}catch(e){}}
function pushBandeau(){if(PUSHST!=="inactif"||!VAPID()||lsGet(LS.d,0)||Notification.permission==="denied")return"";return`<div class="al" style="background:#e3f2fd;color:#0b3b4c">🔔 <b>Activez les notifications</b> pour être prévenu d'une nouvelle demande de client ou d'une commande livrée, même application fermée. <a href="#" data-a="pushon">Activer</a> · <a href="#" data-a="pushnon">Plus tard</a></div>`}
function pushCarte(){const E={actif:`<span style="color:var(--ok)">✔ actives</span>`,inactif:"désactivées",refuse:`<span style="color:var(--er)">✖ refusées</span> : autorisez-les dans les réglages du navigateur`,indispo:"non disponibles sur cet appareil",bureau:"non configurées par le bureau","":"vérification…"}[PUSHST]||"";
 return`<div class="card"><b>🔔 Notifications sur le téléphone</b><div class="sm mu" style="margin:4px 0 8px">Nouvelles demandes de vos clients, commandes confirmées, livrées ou échouées, même quand l'application est fermée.</div><div>État : ${E}</div>
  ${PUSHST==="actif"?'<button class="btn ghost" data-a="pushoff">🔕 Couper les notifications</button><button class="btn ghost" data-a="pushtest">🔔 Tester</button>':PUSHST==="inactif"?'<button class="btn" data-a="pushon">🔔 Activer les notifications</button>':""}</div>`}
/* Installation sur l'écran d'accueil */
let IPROMPT=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function majInstall(){let h="";
 if(!standalone()&&/^https?:$/.test(location.protocol)){
  if(IPROMPT)h='<button type="button" class="btn ghost" data-a="installer">📲 Installer l\'application Vendeur</button>';
  else if(estIOS())h='<div class="al">📲 Pour installer : touchez <b>Partager</b> puis <b>Sur l\'écran d\'accueil</b>.</div>'}
 document.querySelectorAll(".inst").forEach(e=>{e.innerHTML=h;e.style.display=h?"block":"none"})}

addEventListener("appinstalled",()=>{IPROMPT=null;majInstall()});
document.addEventListener("click",async e=>{const b=e.target.closest('[data-a="installer"]');if(!b||!IPROMPT)return;IPROMPT.prompt();try{await IPROMPT.userChoice}catch(x){}IPROMPT=null;majInstall()});
new MutationObserver(()=>{if(document.querySelector(".inst:empty"))majInstall()}).observe(document.getElementById("app"),{childList:true});

 const avait=!!navigator.serviceWorker.controller;let rech=false;
