<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="description" content="Site et boutique en ligne : commandez, découvrez nos activités, devenez vendeur partenaire, contactez-nous.">
<link rel="manifest" href="manifest-portail.webmanifest">
<link rel="icon" type="image/png" href="icons/hub-192.png">
<link rel="apple-touch-icon" href="icons/hub-apple-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Portail">
<title>ANGEL'S GROUP</title>
<style>
:root{--c:#0e7490;--c2:color-mix(in srgb,var(--c) 55%,#000);--or:#f5a524;--sable:#faf5ec;--bg:var(--sable);--card:#fff;--tx:#1d2433;--mu:#6b6559;--bd:#eadfce;--serif:Georgia,"Times New Roman",serif}
@media(prefers-color-scheme:dark){:root{--sable:#101a20;--card:#162830;--tx:#ecf2f4;--mu:#a3b4ba;--bd:#25414d}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Avenir Next","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
/* bandeau défilant */
.bandeau{background:var(--c);color:#fff;overflow:hidden;white-space:nowrap;padding:9px 0;font-size:.88rem;font-weight:500}
.bandeau-contenu{display:inline-block;padding-left:100%;animation:defile 38s linear infinite}.bandeau-contenu span{margin:0 26px}
@keyframes defile{to{transform:translateX(-100%)}}@media(prefers-reduced-motion:reduce){.bandeau-contenu{animation:none;padding-left:16px}}
/* en-tête */
.site-header{background:var(--card);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--bd)}
.header-flex{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo-area{cursor:pointer;line-height:1.1}.logo-area b{font-family:var(--serif);font-size:1.25rem;letter-spacing:.3px}.logo-area small{display:block;color:var(--mu);font-size:.7rem;margin-top:2px}
.header-actions{list-style:none;margin:0;padding:0;display:flex;gap:8px}
.nav-dropdown{position:relative}
.nav-dropdown-trigger{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;background:var(--c2);color:#fff;padding:10px 15px;font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.3px;cursor:pointer;min-height:42px}
.p-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--or);color:#1d2433;font-size:.75rem;font-weight:800}
.nav-dropdown-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.16);z-index:30}
.nav-dropdown-menu.open{display:grid;gap:2px}.p-activites .nav-dropdown-menu{right:auto;left:0}
.parcours{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,#fff),var(--card) 60%);border-top:1px solid var(--bd)}
.parcours-in{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;padding-top:4px;padding-bottom:4px}.parcours-in::-webkit-scrollbar{display:none}
.p-etape{display:flex;align-items:center;gap:6px;flex:none;padding-right:6px}
.p-hd{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);white-space:nowrap}
.p-hd b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c2);color:#fff;font-size:.75rem}
.p-liste{list-style:none;margin:0;padding:0;display:flex;gap:2px}
.tab-link{display:inline-flex;align-items:center;gap:6px;padding:9px 11px;font:inherit;font-size:.76rem;font-weight:700;letter-spacing:.2px;color:var(--tx);background:transparent;border:0;border-radius:99px;cursor:pointer;white-space:nowrap;min-height:40px;text-decoration:none}
.tab-link:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}.tab-link.active{background:var(--c);color:#fff}
.nav-dropdown-menu .tab-link{border-radius:10px;width:100%;justify-content:flex-start}
.p-activites>.nav-dropdown-trigger{background:transparent;color:var(--tx);padding:9px 11px;font-size:.76rem;border:1px solid var(--bd)}
/* héros */
.hero{background:linear-gradient(135deg,var(--c) 0%,var(--c2) 100%);color:#fff;padding:54px 0 74px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-flex{display:flex;gap:30px;align-items:center;flex-wrap:wrap;position:relative}.hero-text{flex:1 1 380px}
.hero h2{font-family:var(--serif);font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.04;margin:0 0 14px;max-width:18ch;text-wrap:balance}
.hero p{margin:0;max-width:560px;font-size:1.08rem;opacity:.95}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.hero-btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:99px;border:0;font:inherit;font-weight:800;font-size:.9rem;text-decoration:none;cursor:pointer;background:#fff;color:#1d2433;min-height:46px}.hero-btn.principal{background:#1d2433;color:#fff}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px}.hero-stat b{display:block;font-size:1.9rem;line-height:1}.hero-stat span{font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.hero-video{flex:1 1 340px}.hero-video video{width:100%;display:block;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:360px;object-fit:cover;background:#000}
.atouts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:-42px;position:relative;padding:0 20px}
.atout{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.atout .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--c),var(--or));flex:none}.atout b{display:block;font-size:.95rem}.atout span{font-size:.8rem;color:var(--mu)}
/* pages */
.pg{padding:34px 0 18px}.pg h2{font-family:var(--serif);font-size:clamp(1.5rem,3.6vw,2.2rem);margin:0 0 6px}.pg .sub{margin:0 0 18px;color:var(--mu)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.card .ic{font-size:30px}.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--mu);font-size:14px;flex:1}
.go{align-self:flex-start;margin-top:6px;padding:10px 16px;border-radius:99px;background:var(--c);color:#fff;font-weight:800;text-decoration:none;font-size:14px;min-height:42px;display:inline-flex;align-items:center;border:0;cursor:pointer;font-family:inherit}
.band{background:linear-gradient(135deg,var(--c2),var(--c));color:#fff;border-radius:22px;padding:26px;margin:26px 0;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.band h3{margin:0 0 4px;font-family:var(--serif);font-size:1.4rem}.band p{margin:0;opacity:.92;max-width:560px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;min-height:42px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:8px}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--mu)}
.ct{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.ct .card{gap:4px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}label{display:block;font-size:13px;color:var(--mu);font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);min-height:44px;margin-top:4px}
input[type=radio]{width:auto;min-height:0;margin:0 8px 0 0}label.rd{display:flex;align-items:center;font-size:15px;color:var(--tx)}
.bp{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.qty{display:flex;align-items:center;gap:8px}.bn{min-width:24px;text-align:center}
.tot{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:4px}.tot div{display:flex;justify-content:space-between}.tot .big{font-size:18px}
.err{background:#fde8e8;color:#b42318;border-radius:10px;padding:10px 12px;font-size:14px}h3{margin:10px 0 4px;font-size:16px}
.mu{color:var(--mu)}.empty{padding:16px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu)}
.avis{font-style:italic}.avis b{font-style:normal;display:block;margin-top:6px;color:var(--c)}
footer{margin-top:28px;padding:22px 0 30px;color:var(--mu);font-size:13px;border-top:1px solid var(--bd);text-align:center}footer button{background:none;border:0;color:var(--c);cursor:pointer;font:inherit;text-decoration:underline}
dialog{max-width:640px;width:calc(100% - 32px);border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:18px}dialog::backdrop{background:rgba(0,0,0,.5)}
@media(max-width:640px){.hero{padding:36px 0 64px}.header-flex{padding:10px 16px}}
</style>
</head>
<body>
<div class="bandeau" id="bandeau-w" hidden><div class="bandeau-contenu" id="bandeau"></div></div>
<header class="site-header">
 <div class="container header-flex">
  <div class="logo-area" data-go="accueil"><b id="brand"></b><small id="brandsub"></small></div>
  <ul class="header-actions"><li class="nav-dropdown"><button class="nav-dropdown-trigger" type="button" data-dd="espace-menu" aria-haspopup="true"><span class="p-num">4</span> MON ESPACE ▾</button>
   <div class="nav-dropdown-menu" id="espace-menu"><button class="tab-link" data-go="espace-client">🛍️ Espace client</button><button class="tab-link" data-go="espace-vendeur">🤝 Espace vendeur partenaire</button></div></li></ul>
 </div>
 <nav class="parcours" aria-label="Parcours du visiteur"><div class="container parcours-in" id="parcours"></div></nav>
</header>
<main id="page"></main>
<footer><div class="container"><span id="copy"></span> · <button id="lm" type="button">Mentions légales</button></div></footer>
<dialog id="dlg"><h3 style="margin-top:0">Mentions légales</h3><div id="mentions" style="white-space:pre-wrap"></div><p style="text-align:right"><button class="go" onclick="this.closest('dialog').close()">Fermer</button></p></dialog>
<script>
const KEY="angels_portail_v1",SKEY="angels_portail_cfg";
const DEF={v:3,nom:"ANGEL'S GROUP",slogan:"Commandez en ligne, faites-vous livrer. Vendez avec nous.",apropos:"Distribution, transport, négoce de véhicules et agro : commandez dans notre boutique en ligne, ou devenez vendeur partenaire et faites livrer vos produits.",couleur:"#0e7490",
 societe:"Le groupe réunit plusieurs activités complémentaires au service de ses clients et de ses partenaires : la livraison à moto et la vente en ligne, le transport de personnes, le négoce et l'import de véhicules, et l'élevage.",
 bandeau:["🛒 Commandez en ligne, livraison rapide.","🤝 Devenez vendeur partenaire : postulez en quelques minutes.","📲 Paiement à la livraison ou par Mobile Money."],
 hero:{titre:"Commandez en ligne. Faites-vous livrer.",texte:"Une boutique, des livreurs, des partenaires : tout le groupe, au même endroit.",video:""},
 stats:[],
 atouts:[{icone:"🛵",titre:"Livraison rapide",texte:"À moto, jusqu'à votre porte"},{icone:"📲",titre:"Paiement simple",texte:"Espèces ou Mobile Money"},{icone:"🤝",titre:"Vendeurs partenaires",texte:"Vendez avec notre réseau"}],
 contact:{tel:"",whatsapp:"",email:"",adresse:"",horaires:""},boutique:"",vendeurs:{actif:true,texte:"Vous vendez des produits et vous cherchez un partenaire de livraison fiable ? Postulez : nous étudions votre candidature et vous contactons."},
 activites:[{icone:"🛵",nom:"Distributions",texte:"Livraison à moto et vente en ligne.",detail:"Nous livrons vos commandes rapidement à votre adresse, avec suivi. Commandez dans la boutique en ligne ou faites livrer vos propres produits."},
  {icone:"🚕",nom:"Transport",texte:"Transport de personnes et négoce de véhicules.",detail:"Une flotte suivie au quotidien, et des véhicules à vendre : demandez-nous un devis."},
  {icone:"🌱",nom:"Agro",texte:"Des produits frais issus de notre élevage.",detail:"Œufs, volaille et produits de l'élevage, directement du producteur."}],
 avis:[],
 faq:[{q:"Comment commander ?",r:"Choisissez vos produits dans la boutique, indiquez votre adresse et envoyez la commande par WhatsApp : nous la confirmons et vous livrons."},{q:"Comment devenir vendeur partenaire ?",r:"Remplissez le formulaire « Devenir vendeur partenaire » : votre candidature nous parvient sur WhatsApp et nous revenons vers vous."}],
 mentions:""};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Aucun lien vers l'application de gestion : seules les adresses externes (https, tel, mailto) et les pages du portail sont admises. */
const okLien=u=>{u=String(u||"").trim();if(/^#\/?[a-z\-]+$/i.test(u))return u;if(/^(https:\/\/|tel:|mailto:)/i.test(u)&&!/(distribution|transport|agro|parametres|compta-groupe|hub|index)\.html/i.test(u))return u;return""};
const okCol=c=>/^#[0-9a-f]{6}$/i.test(String(c||""))?c:DEF.couleur;
const okVideo=u=>{u=String(u||"").trim();return /^https:\/\/[^\s"'<>]+\.(mp4|webm)(\?[^\s"'<>]*)?$/i.test(u)?u:""};
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=t=>JSON.parse(decodeURIComponent(escape(atob(String(t).replace(/-/g,"+").replace(/_/g,"/")))));
const digits=s=>String(s||"").replace(/\D/g,"");
const telWA=t=>{t=digits(t);return t.length===10?"225"+t:t};
const F=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
function tokBoutique(v){ // accepte le lien complet de la boutique ou son jeton ; renvoie le catalogue assaini ou null
 let t=String(v||"").trim();const m=/#boutique=([A-Za-z0-9_-]+)/.exec(t);if(m)t=m[1];if(!/^[A-Za-z0-9_-]{20,}$/.test(t))return null;
 try{const p=unb64(t);if(!p||!Array.isArray(p.p)||!Array.isArray(p.z))return null;
  return{tok:t,org:String(p.o||"").slice(0,80),w:digits(p.w).slice(0,20),zones:p.z.slice(0,60).map(z=>({nom:String(z[0]).slice(0,60),frais:Math.max(0,Math.round(+z[1]||0))})),
   items:p.p.slice(0,200).map(x=>({c:String(x[0]).slice(0,30),n:String(x[1]).slice(0,100),pu:Math.max(0,Math.round(+x[2]||0)),sv:+x[3]<0,st:+x[3]<0?99:Math.max(0,Math.floor(+x[3]||0))})),mm:(p.m||[]).map(x=>String(x).slice(0,60)).slice(0,6)}}catch(e){return null}}
function dec(h){try{return JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){return null}}
const S2=(a,n)=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==="object").slice(0,n);
function charger(){ // priorité : lien partagé (#p=…, mémorisé pour la visite) → réglages du Hub (même appareil) → valeurs par défaut
 let c=null;const m=/[#&]p=([^&]+)/.exec(location.hash);
 if(m){c=dec(m[1]);if(c){try{sessionStorage.setItem(SKEY,m[1])}catch(e){}}}
 if(!c){try{const k=sessionStorage.getItem(SKEY);if(k)c=dec(k)}catch(e){}}
 if(!c){try{c=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){c=null}}
 c=c&&typeof c==="object"?c:{};
 const T={...DEF,...c,contact:{...DEF.contact,...(c.contact||{})},vendeurs:{...DEF.vendeurs,...(c.vendeurs||{})},hero:{...DEF.hero,...(c.hero||{})}};
 const tx=(v,n)=>String(v==null?"":v).slice(0,n);
 T.nom=tx(T.nom||DEF.nom,60);T.slogan=tx(T.slogan,160);T.apropos=tx(T.apropos,500);T.societe=tx(T.societe,1500);T.mentions=tx(T.mentions,4000);
 T.hero={titre:tx(T.hero.titre,120),texte:tx(T.hero.texte,300),video:okVideo(T.hero.video)};
 T.bandeau=(Array.isArray(c.bandeau)?c.bandeau:DEF.bandeau).map(x=>tx(x,160)).filter(Boolean).slice(0,10);
 T.stats=S2(c.stats,3).map(x=>({v:tx(x.v,16),l:tx(x.l,40)})).filter(x=>x.v);
 T.atouts=S2(Array.isArray(c.atouts)?c.atouts:DEF.atouts,3).map(x=>({icone:tx(x.icone||"•",4),titre:tx(x.titre,60),texte:tx(x.texte,100)})).filter(x=>x.titre);
 T.activites=S2(Array.isArray(c.activites)?c.activites:DEF.activites,8).map((x,i)=>({id:"act"+(i+1),icone:tx(x.icone||"•",4),nom:tx(x.nom,60),texte:tx(x.texte,200),detail:tx(x.detail,1500)})).filter(x=>x.nom);
 T.avis=S2(c.avis,12).map(x=>({nom:tx(x.nom,60),texte:tx(x.texte,400)})).filter(x=>x.texte);
 T.faq=(Array.isArray(c.faq)?c.faq:DEF.faq).filter(f=>f&&f.q).slice(0,30).map(f=>({q:tx(f.q,200),r:tx(f.r,800)}));
 T.couleur=okCol(T.couleur);T.vendeurs={actif:T.vendeurs.actif!==false,texte:tx(T.vendeurs.texte,500)};
 T.shop=tokBoutique(T.boutique);for(const k of Object.keys(T.contact))T.contact[k]=tx(T.contact[k],120);return T;
}
let T=charger(),ST={q:{},gps:null,vs:"form",vc:"form"};
const ref6=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x%32]).join("");
const waNum=()=>telWA(T.contact.whatsapp||(T.shop&&T.shop.w)||"");
function lienWA(msg){const n=waNum();return n?"https://wa.me/"+n+"?text="+encodeURIComponent(msg):""}
function envoi(titre,msg,ref,back){ // dernière étape : WhatsApp, ou copie du message si aucun numéro n'est publié
 const u=lienWA(msg);return `<div class="card" style="align-items:center;text-align:center"><div style="font-size:42px">📲</div><h3>Dernière étape</h3><p>Référence <b style="font-size:20px;letter-spacing:2px">${esc(ref)}</b></p><p class="mu">${titre}</p>
 ${u?`<a class="go" href="${esc(u)}" target="_blank" rel="noopener">💬 Envoyer sur WhatsApp</a>`:'<div class="empty">Numéro WhatsApp non publié : copiez le message ci-dessous et envoyez-le.</div>'}
 <button type="button" class="chip" data-cp="1">📋 Copier le message</button><textarea class="msg" readonly rows="6" style="width:100%;font-size:12px">${esc(msg)}</textarea><button type="button" class="chip" data-vue="${back}">← Nouvelle demande</button></div>`}
function rendreShop(){
 const el=document.getElementById("shop"),S=T.shop;
 if(!S||!S.items.length){el.innerHTML='<div class="empty">La boutique ouvre bientôt. Contactez-nous pour commander.</div>';return}
 if(ST.vs==="cmd"){el.innerHTML=envoi("Touchez le bouton pour envoyer votre commande à <b>"+esc(T.nom)+"</b>. Elle est vérifiée puis confirmée avant livraison.",ST.msg,ST.ref,"shop");return}
 const row=i=>`<div class="bp" data-c="${esc(i.c)}"><div style="flex:1"><b>${esc(i.n)}</b><br><span class="mu">${F(i.pu)}${i.sv?" · prestation":""}${i.st<=0?" · <b>Épuisé</b>":""}</span></div><div class="qty"><button type="button" class="chip" data-b="-" aria-label="Retirer" ${i.st<=0?"disabled":""}>−</button><b class="bn">${ST.q[i.c]||0}</b><button type="button" class="chip" data-b="+" aria-label="Ajouter" ${i.st<=0?"disabled":""}>+</button></div></div>`;
 el.innerHTML=`<div class="card"><h3>1. Produits</h3>${S.items.map(row).join("")}
 <h3>2. Vous</h3><div class="fg"><label>Votre nom<input id="b_nom" maxlength="80" autocomplete="name"></label><label>Téléphone / WhatsApp<input id="b_tel" inputmode="tel" autocomplete="tel"></label></div>
 <h3>3. Où livrer ?</h3><div class="fg"><label>Zone<select id="b_zone"><option value="">— choisir —</option>${S.zones.map(z=>`<option value="${esc(z.nom)}">${esc(z.nom)} (livraison ${F(z.frais)})</option>`).join("")}</select></label><label>Quartier<input id="b_q" maxlength="120"></label></div>
 <label>Point de repère (pharmacie, école, couleur du portail…)<input id="b_rep" maxlength="200"></label><div><button type="button" class="chip" id="b_gpsb">📍 Utiliser ma position</button> <span id="b_gps" class="mu">Recommandé : le livreur vous trouvera plus facilement.</span></div>
 <label>Message (facultatif)<textarea id="b_note" rows="2" maxlength="300"></textarea></label>
 <h3>4. Paiement</h3><label class="rd"><input type="radio" name="b_pm" value="esp" checked> Espèces à la livraison</label>

 <div class="tot"><div><span>Produits</span><b id="b_sub">0 F</b></div><div><span>Livraison</span><b id="b_fee">—</b></div><div class="big"><span>Total à payer</span><b id="b_tot">0 F</b></div></div>

 const $b=id=>document.getElementById(id),zf=()=>(S.zones.find(z=>z.nom===$b("b_zone").value)||{}).frais,lines=()=>S.items.filter(i=>ST.q[i.c]>0),sub=()=>lines().reduce((t,i)=>t+i.pu*ST.q[i.c],0);
 const calc=()=>{const s=sub(),f=zf();$b("b_sub").textContent=F(s);$b("b_fee").textContent=f==null?"— (choisir la zone)":F(f);$b("b_tot").textContent=F(s+(f||0))};
 el.querySelectorAll(".bp").forEach(r=>{const i=S.items.find(x=>x.c===r.dataset.c);r.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const q=(ST.q[i.c]||0)+(b.dataset.b==="+"?1:-1);ST.q[i.c]=Math.max(0,Math.min(i.st,99,q));r.querySelector(".bn").textContent=ST.q[i.c];calc()})});
 $b("b_zone").onchange=calc;el.querySelectorAll("[name=b_pm]").forEach(r=>r.onchange=()=>{const m=$b("b_mm");if(m)m.style.display=el.querySelector("[name=b_pm]:checked").value==="mm"?"block":"none"});
 $b("b_gpsb").onclick=()=>{if(!navigator.geolocation){$b("b_gps").textContent="Géolocalisation indisponible : indiquez votre quartier et un repère.";return}
  navigator.geolocation.getCurrentPosition(g=>{ST.gps={lat:+g.coords.latitude.toFixed(6),lng:+g.coords.longitude.toFixed(6),acc:Math.round(g.coords.accuracy||0)};$b("b_gps").textContent="✔ Position enregistrée (±"+ST.gps.acc+" m)"},()=>{$b("b_gps").textContent="Position impossible : autorisez la localisation ou indiquez votre quartier."},{enableHighAccuracy:true,timeout:20000})};
 $b("b_send").onclick=()=>{const err=m=>{const e=$b("b_err");e.textContent=m;e.style.display="block";e.scrollIntoView({block:"center"})},val=id=>$b(id).value.trim(),L=lines();
  if(!L.length)return err("Choisissez au moins un produit");if(!val("b_nom"))return err("Indiquez votre nom");if(digits(val("b_tel")).length<8)return err("Indiquez un numéro de téléphone valide");
  if(!val("b_zone"))return err("Choisissez votre zone de livraison");if(!val("b_q")&&!val("b_rep")&&!ST.gps)return err("Indiquez votre quartier, un point de repère ou envoyez votre position");
  const pm=(el.querySelector("[name=b_pm]:checked")||{}).value||"esp",op=pm==="mm"?$b("b_op").value:"",rf=pm==="mm"?val("b_rf"):"";if(pm==="mm"&&rf.length<4)return err("Indiquez la référence de votre paiement Mobile Money");
  const total=sub()+zf(),ref=ref6();
  const pl={f:ref,n:val("b_nom"),t:val("b_tel"),z:val("b_zone"),q:val("b_q"),r:val("b_rep"),a:ST.gps?ST.gps.lat:null,o:ST.gps?ST.gps.lng:null,l:L.map(i=>[i.c,ST.q[i.c]]),p:pm==="mm"?"m":"e",op,rf,m:val("b_note"),tt:total};
  ST.msg=`🛒 Commande en ligne — ${S.org||T.nom} (réf. ${ref})\nNom : ${pl.n}\nTél : ${pl.t}\nZone : ${pl.z}${pl.q?" · "+pl.q:""}${pl.r?" · "+pl.r:""}\n${ST.gps?"📍 https://maps.google.com/?q="+ST.gps.lat+","+ST.gps.lng+"\n":""}Articles :\n${L.map(i=>"- "+ST.q[i.c]+" x "+i.n+" ("+F(i.pu)+")").join("\n")}\nLivraison : ${F(zf())}\nTotal : ${F(total)}\nPaiement : ${pm==="mm"?"Mobile Money "+op+" — réf. "+rf:"espèces à la livraison"}${pl.m?"\nMessage : "+pl.m:""}\n[BOUTIQUE:${b64(pl)}]`;
  ST.ref=ref;ST.vs="cmd";rendreShop()};
 calc()}
function rendreVend(){
 const el=document.getElementById("vend");
 if(!T.vendeurs.actif){el.innerHTML='<div class="empty">Les candidatures sont fermées pour le moment.</div>';return}
 if(ST.vc==="cand"){el.innerHTML=envoi("Touchez le bouton pour envoyer votre candidature à <b>"+esc(T.nom)+"</b>. Nous étudions votre dossier et vous recontactons.",ST.cmsg,ST.cref,"vend");return}
 el.innerHTML=`<p class="sub">${esc(T.vendeurs.texte)}</p><div class="card"><div class="fg"><label>Nom ou nom de votre boutique<input id="c_nom" maxlength="80" autocomplete="name"></label><label>Téléphone / WhatsApp<input id="c_tel" inputmode="tel" autocomplete="tel"></label></div>
 <div class="fg"><label>Ville / quartier<input id="c_ville" maxlength="80"></label><label>Votre activité<input id="c_act" maxlength="200" placeholder="Ex. vente de vêtements, cosmétiques…"></label></div>
 <label>Produits que vous souhaitez faire livrer<input id="c_prod" maxlength="300"></label><label>Message (facultatif)<textarea id="c_msg" rows="2" maxlength="400"></textarea></label>
 <div id="c_err" class="err" style="display:none"></div><button type="button" class="go" id="c_send" style="justify-content:center">Envoyer ma candidature</button>
 <p class="mu">Votre candidature part par WhatsApp. Aucun compte n'est créé tant que nous ne l'avons pas étudiée et approuvée.</p></div>`;
 const $c=id=>document.getElementById(id),val=id=>$c(id).value.trim();
 $c("c_send").onclick=()=>{const err=m=>{const e=$c("c_err");e.textContent=m;e.style.display="block"};
  if(!val("c_nom"))return err("Indiquez votre nom");if(digits(val("c_tel")).length<8)return err("Indiquez un numéro de téléphone valide");if(!val("c_act")&&!val("c_prod"))return err("Décrivez votre activité ou vos produits");
  const ref=ref6(),pl={f:ref,n:val("c_nom"),t:val("c_tel"),v:val("c_ville"),a:val("c_act"),p:val("c_prod"),m:val("c_msg")};
  ST.cmsg=`🤝 Candidature vendeur partenaire — ${T.nom} (réf. ${ref})\nNom : ${pl.n}\nTél : ${pl.t}\nVille : ${pl.v||"—"}\nActivité : ${pl.a||"—"}\nProduits : ${pl.p||"—"}${pl.m?"\nMessage : "+pl.m:""}\n[VENDEUR:${b64(pl)}]`;ST.cref=ref;ST.vc="cand";rendreVend()}}

/* ---------- Pages (parcours : 1 Découvrir · 2 Comprendre · 3 Passer à l'action · 4 Mon espace) ---------- */
const shopOk=()=>!!(T.shop&&T.shop.items.length);
const PARC=()=>[
 {n:1,t:"Découvrir",l:[["accueil","🏠 ACCUEIL"],["boutique","🛒 BOUTIQUE"],["@act","ACTIVITÉS ▾"]]},
 {n:2,t:"Comprendre",l:[["societe","🏢 SOCIÉTÉ"],...(T.avis.length?[["avis","⭐ AVIS"]]:[]),["faq","❓ FAQ"]]},
 {n:3,t:"Passer à l'action",l:[["boutique","🛍️ COMMANDER"],...(T.vendeurs.actif?[["vendeur","🤝 VENDEUR PARTENAIRE"]]:[]),["contact","✉️ CONTACT"]]}];
const titreSec=(t,s)=>`<h2>${t}</h2>${s?`<p class="sub">${esc(s)}</p>`:""}`;
const PAGES={
 accueil:()=>{const hv=T.hero.video?`<div class="hero-video"><video controls preload="none"><source src="${esc(T.hero.video)}"></video></div>`:"";
  return `<section class="hero"><div class="container hero-flex"><div class="hero-text"><h2>${esc(T.hero.titre)}</h2><p>${esc(T.hero.texte)}</p>
   <div class="hero-cta"><button type="button" class="hero-btn principal" data-go="boutique">🛒 Commander en ligne</button>${T.vendeurs.actif?'<button type="button" class="hero-btn" data-go="vendeur">🤝 Devenir vendeur partenaire</button>':""}<button type="button" class="hero-btn" data-go="contact">Parler à un conseiller</button></div>
   ${T.stats.length?`<div class="hero-stats">${T.stats.map(s=>`<div class="hero-stat"><b>${esc(s.v)}</b><span>${esc(s.l)}</span></div>`).join("")}</div>`:""}</div>${hv}</div></section>
  ${T.atouts.length?`<div class="container"><div class="atouts">${T.atouts.map(a=>`<div class="atout"><div class="ic">${esc(a.icone)}</div><div><b>${esc(a.titre)}</b><span>${esc(a.texte)}</span></div></div>`).join("")}</div></div>`:""}
  <section class="pg"><div class="container">${titreSec("Nos activités","Choisissez une activité pour en savoir plus.")}<div class="grid">${T.activites.map(a=>`<div class="card"><div class="ic">${esc(a.icone)}</div><h3>${esc(a.nom)}</h3><p>${esc(a.texte)}</p><button type="button" class="go" data-go="${a.id}">En savoir plus →</button></div>`).join("")||'<div class="empty">Nos activités seront publiées prochainement.</div>'}</div>
   ${T.vendeurs.actif?`<div class="band"><div><h3>Vendez avec nous</h3><p>${esc(T.vendeurs.texte)}</p></div><button type="button" class="hero-btn" data-go="vendeur">Devenir vendeur partenaire</button></div>`:""}</div></section>`},
 boutique:()=>`<section class="pg"><div class="container">${titreSec("🛒 Boutique en ligne","Choisissez vos produits, indiquez votre adresse : la commande part par WhatsApp.")}<div id="shop"></div></div></section>`,
 vendeur:()=>`<section class="pg"><div class="container">${titreSec("🤝 Devenir vendeur partenaire","")}<div id="vend"></div></div></section>`,
 societe:()=>`<section class="pg"><div class="container">${titreSec("Notre société","")}<div class="card"><p style="color:var(--tx);font-size:16px;white-space:pre-wrap">${esc(T.societe)}</p></div><div class="grid" style="margin-top:14px">${T.activites.map(a=>`<div class="card"><div class="ic">${esc(a.icone)}</div><h3>${esc(a.nom)}</h3><p>${esc(a.texte)}</p></div>`).join("")}</div></div></section>`,
 avis:()=>`<section class="pg"><div class="container">${titreSec("Avis de nos clients","")}<div class="grid">${T.avis.map(a=>`<div class="card avis"><p style="color:var(--tx)">« ${esc(a.texte)} »</p><b>${esc(a.nom)}</b></div>`).join("")}</div></div></section>`,
 faq:()=>`<section class="pg"><div class="container">${titreSec("Questions fréquentes","")}${T.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.r)}</p></details>`).join("")||'<div class="empty">Aucune question publiée.</div>'}</div></section>`,
 contact:()=>{const c=T.contact,ct=[];if(c.tel)ct.push(`<a class="card" href="tel:${esc(c.tel.replace(/[^\d+]/g,""))}"><div class="ic">📞</div><h3>Téléphone</h3><p>${esc(c.tel)}</p></a>`);
  if(c.whatsapp)ct.push(`<a class="card" href="https://wa.me/${telWA(c.whatsapp)}"><div class="ic">💬</div><h3>WhatsApp</h3><p>${esc(c.whatsapp)}</p></a>`);
  if(c.email)ct.push(`<a class="card" href="mailto:${esc(c.email)}"><div class="ic">✉️</div><h3>E-mail</h3><p>${esc(c.email)}</p></a>`);
  if(c.adresse||c.horaires)ct.push(`<div class="card"><div class="ic">📍</div><h3>Adresse</h3><p>${esc(c.adresse)}${c.adresse&&c.horaires?"<br>":""}${esc(c.horaires)}</p></div>`);
  return `<section class="pg"><div class="container">${titreSec("Nous contacter","")}<div class="ct">${ct.join("")||'<div class="empty">Les coordonnées seront publiées prochainement.</div>'}</div></div></section>`},
 "espace-client":()=>`<section class="pg"><div class="container">${titreSec("🛍️ Espace client","Commandez, puis suivez votre commande par WhatsApp.")}<div class="grid"><div class="card"><div class="ic">🛒</div><h3>Passer une commande</h3><p>Choisissez vos produits et envoyez votre commande.</p><button type="button" class="go" data-go="boutique">Ouvrir la boutique →</button></div>
  <div class="card"><div class="ic">📍</div><h3>Suivre ma commande</h3><p>Indiquez la référence reçue à l'envoi de votre commande : nous vous répondons sur WhatsApp.</p><label>Référence<input id="suivi_ref" maxlength="12" autocapitalize="characters"></label><a class="go" id="suivi_go" href="#/espace-client">Demander le suivi sur WhatsApp</a></div></div></div></section>`,
 "espace-vendeur":()=>`<section class="pg"><div class="container">${titreSec("🤝 Espace vendeur partenaire","")}<div class="grid"><div class="card"><div class="ic">📝</div><h3>Je souhaite devenir partenaire</h3><p>${esc(T.vendeurs.texte)}</p>${T.vendeurs.actif?'<button type="button" class="go" data-go="vendeur">Déposer ma candidature →</button>':'<p class="mu">Les candidatures sont fermées pour le moment.</p>'}</div>
  <div class="card"><div class="ic">💬</div><h3>Je suis déjà partenaire</h3><p>Vos commandes et vos règlements sont gérés avec votre responsable : contactez-le sur WhatsApp. Vos accès de travail vous sont communiqués par l'entreprise.</p>${waNum()?`<a class="go" href="https://wa.me/${waNum()}">Contacter sur WhatsApp</a>`:""}</div></div></div></section>`
};
const actPage=id=>{const a=T.activites.find(x=>x.id===id);return a?`<section class="pg"><div class="container">${titreSec(esc(a.icone)+" "+esc(a.nom),a.texte)}<div class="card"><p style="color:var(--tx);font-size:16px;white-space:pre-wrap">${esc(a.detail||a.texte)}</p>${shopOk()?'<button type="button" class="go" data-go="boutique">Commander en ligne →</button>':""}<button type="button" class="go" data-go="contact">Nous contacter →</button></div></div></section>`:""};
let PAGE="accueil";
function pageDe(){const h=location.hash;const m=/^#\/([a-z0-9\-]+)/i.exec(h);return m?m[1]:"accueil"}
function allerA(p){const cur=location.hash.replace(/^#\/?[a-z0-9\-]*/i,"");location.hash="#/"+p;}
function navRendre(){
 const cur=PAGE,act=T.activites;
 document.getElementById("parcours").innerHTML=`<ul class="p-liste">`+PARC().map(e=>`<li class="p-etape"><div class="p-hd"><b>${e.n}</b><span>${e.t}</span></div><ul class="p-liste">`+e.l.map(([k,l])=>k==="@act"?(act.length?`<li class="nav-dropdown p-activites"><button type="button" class="nav-dropdown-trigger" data-dd="act-menu">${l}</button><div class="nav-dropdown-menu" id="act-menu">${act.map(a=>`<button class="tab-link" data-go="${a.id}">${esc(a.icone)} ${esc(a.nom)}</button>`).join("")}</div></li>`:""):`<li><button type="button" class="tab-link ${cur===k&&e.n!==3?"active":""}" data-go="${k}">${l}</button></li>`).join("")+`</ul></li>`).join("")+`</ul>`;
}
function rendre(){
 PAGE=pageDe();document.documentElement.style.setProperty("--c",T.couleur);document.querySelector('meta[name=theme-color]').content=T.couleur;document.title=T.nom;
 document.getElementById("brand").textContent=T.nom;document.getElementById("brandsub").textContent=T.slogan;
 const bw=document.getElementById("bandeau-w");bw.hidden=!T.bandeau.length;document.getElementById("bandeau").innerHTML=T.bandeau.map(x=>`<span>${esc(x)}</span>`).join("");
 navRendre();
 const html=PAGES[PAGE]?PAGES[PAGE]():actPage(PAGE)||PAGES.accueil();
 document.getElementById("page").innerHTML=html;
 if(document.getElementById("shop"))rendreShop();if(document.getElementById("vend"))rendreVend();
 const sg=document.getElementById("suivi_ref");if(sg){const go=document.getElementById("suivi_go"),maj=()=>{const r=sg.value.trim().toUpperCase(),n=waNum();go.href=n?"https://wa.me/"+n+"?text="+encodeURIComponent("Bonjour, je souhaite le suivi de ma commande"+(r?" (réf. "+r+")":"")+"."):"#/espace-client"};sg.oninput=maj;maj()}
 document.getElementById("copy").textContent="© "+new Date().getFullYear()+" "+T.nom;
 document.getElementById("mentions").textContent=T.mentions||"Les mentions légales seront publiées prochainement. "+T.nom+".";
 window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const dd=e.target.closest("[data-dd]");document.querySelectorAll(".nav-dropdown-menu.open").forEach(m=>{if(!dd||m.id!==dd.dataset.dd)m.classList.remove("open")});
 if(dd){const m=document.getElementById(dd.dataset.dd);m.classList.toggle("open");if(m.classList.contains("open")&&dd.closest(".parcours")){const r=dd.getBoundingClientRect();m.style.position="fixed";m.style.left=Math.max(8,Math.min(r.left,innerWidth-250))+"px";m.style.top=(r.bottom+6)+"px";m.style.right="auto"}return}
 const g=e.target.closest("[data-go]");if(g){document.querySelectorAll(".nav-dropdown-menu.open").forEach(m=>m.classList.remove("open"));allerA(g.dataset.go);return}
 if(e.target.id==="lm")document.getElementById("dlg").showModal();
 const v=e.target.closest("[data-vue]");if(v){if(v.dataset.vue==="shop"){ST.vs="form";ST.q={};ST.gps=null;rendreShop()}else{ST.vc="form";rendreVend()}}
 if(e.target.dataset.cp){const t=e.target.parentElement.querySelector("textarea");(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>t.select())}});
addEventListener("storage",ev=>{if(ev.key===KEY){T=charger();rendre()}});
addEventListener("hashchange",()=>{if(/[#&]p=/.test(location.hash)){T=charger();location.hash="#/accueil"}else rendre()});
if(/[#&]p=/.test(location.hash)){T=charger();history.replaceState(null,"",location.pathname+"#/accueil")}
rendre();
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
