<style>
:root{--c:#0e7490;--c2:color-mix(in srgb,var(--c) 55%,#000);--c3:color-mix(in srgb,var(--c) 80%,#000);--or:#f5a524;--sable:#faf5ec;--bg:var(--sable);--card:#fff;--tx:#1d2433;--mu:#6b6559;--bd:#eadfce;--serif:Georgia,"Times New Roman",serif}

*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Avenir Next","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit}
.container{max-width:1180px;margin:0 auto;padding:0 20px}
/* bandeau défilant */
.bandeau{background:var(--c);color:#fff;overflow:hidden;white-space:nowrap;padding:9px 0;font-size:.88rem;font-weight:500}
.bandeau-contenu{display:inline-block;padding-left:100%;animation:defile 38s linear infinite}.bandeau-contenu span{margin:0 26px}

/* en-tête */
.site-header{background:var(--card);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--bd)}
.header-flex{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo-area{cursor:pointer;line-height:1.1}.logo-area b{font-family:var(--serif);font-size:1.25rem;letter-spacing:.3px}.logo-area small{display:block;color:var(--mu);font-size:.7rem;margin-top:2px}
.header-actions{list-style:none;margin:0;padding:0;display:flex;gap:8px}
.nav-dropdown{position:relative}
.nav-dropdown-trigger{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;background:var(--c2);color:#fff;padding:10px 15px;font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.3px;cursor:pointer;min-height:42px}
.p-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--or);color:#1d2433;font-size:.75rem;font-weight:800}

.nav-dropdown-menu.open{display:grid;gap:2px}.p-activites .nav-dropdown-menu{right:auto;left:0}
.parcours{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,#fff),var(--card) 60%);border-top:1px solid var(--bd)}
.parcours-in{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding-top:6px;padding-bottom:6px}
.p-etape{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;flex:0 1 auto;padding-right:6px}
.p-hd{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);white-space:nowrap}
.p-hd b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c2);color:#fff;font-size:.75rem}
.p-liste{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px}@media(max-width:700px){.p-etape{flex:1 1 100%;flex-direction:column;align-items:flex-start;padding:2px 0 4px;border-bottom:1px dashed var(--bd)}.p-etape:last-child{border-bottom:0}}
.tab-link{display:inline-flex;align-items:center;gap:6px;padding:9px 11px;font:inherit;font-size:.76rem;font-weight:700;letter-spacing:.2px;color:var(--tx);background:transparent;border:0;border-radius:99px;cursor:pointer;white-space:nowrap;min-height:40px;text-decoration:none}
.tab-link:hover{background:color-mix(in srgb,var(--c3) 14%,transparent)}.go:hover,.hero-btn:hover{filter:brightness(.92)}.go{background:var(--c3)}.tab-link.active{background:var(--c);color:#fff}
.nav-dropdown-menu .tab-link{border-radius:10px;width:100%;justify-content:flex-start}
.p-activites>.nav-dropdown-trigger{background:transparent;color:var(--tx);padding:9px 11px;font-size:.76rem;border:1px solid var(--bd)}
/* héros */
.hero{background:linear-gradient(135deg,var(--c) 0%,var(--c2) 100%);color:#fff;padding:54px 0 74px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero-flex{display:flex;gap:30px;align-items:center;flex-wrap:wrap;position:relative}.hero-text{flex:1 1 380px}
.hero h2{font-family:var(--serif);font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.04;margin:0 0 14px;max-width:18ch;text-wrap:balance}
.hero p{margin:0;max-width:560px;font-size:1.08rem;opacity:.95}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.hero-btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:99px;border:0;font:inherit;font-weight:800;font-size:.9rem;text-decoration:none;cursor:pointer;background:#fff;color:#1d2433;min-height:46px}.hero-btn.principal{background:#1d2433;color:#fff}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px}.hero-stat b{display:block;font-size:1.9rem;line-height:1}.hero-stat span{font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.hero-video{flex:1 1 340px}.hero-video video{width:100%;display:block;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:360px;object-fit:cover;background:#000}
.atouts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:-42px;position:relative;padding:0 20px}
.atout{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.atout .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--c),var(--or));flex:none}.atout b{display:block;font-size:.95rem}.atout span{font-size:.8rem;color:var(--mu)}
/* pages */
.pg{padding:34px 0 18px}.pg h2{font-family:var(--serif);font-size:clamp(1.5rem,3.6vw,2.2rem);margin:0 0 6px}.pg .sub{margin:0 0 18px;color:var(--mu)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.card .ic{font-size:30px}.card h3{margin:0;font-size:17px}.card p{margin:0;color:var(--mu);font-size:14px;flex:1}
.go{align-self:flex-start;margin-top:6px;padding:10px 16px;border-radius:99px;background:var(--c);color:#fff;font-weight:800;text-decoration:none;font-size:14px;min-height:42px;display:inline-flex;align-items:center;border:0;cursor:pointer;font-family:inherit}
.band{background:linear-gradient(135deg,var(--c2),var(--c));color:#fff;border-radius:22px;padding:26px;margin:26px 0;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.band h3{margin:0 0 4px;font-family:var(--serif);font-size:1.4rem}.band p{margin:0;opacity:.92;max-width:560px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;min-height:42px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:8px}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--mu)}
.ct{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.ct .card{gap:4px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}label{display:block;font-size:13px;color:var(--mu);font-weight:600}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);min-height:44px;margin-top:4px}
input[type=radio]{width:auto;min-height:0;margin:0 8px 0 0}label.rd{display:flex;align-items:center;font-size:15px;color:var(--tx)}
.bp{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.qty{display:flex;align-items:center;gap:8px}.bn{min-width:24px;text-align:center}
.tot{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:4px}.tot div{display:flex;justify-content:space-between}.tot .big{font-size:18px}
.err{background:#fde8e8;color:#b42318;border-radius:10px;padding:10px 12px;font-size:14px}h3{margin:10px 0 4px;font-size:16px}
.tl{list-style:none;padding:0;margin:16px 0 8px}.tl li{position:relative;margin-left:8px;padding:8px 0 8px 22px;border-left:3px solid var(--bd);color:var(--mu)}.tl li:before{content:"";position:absolute;left:-9px;top:11px;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--bd)}.tl li.done{border-color:var(--c);color:var(--tx)}.tl li.done:before{background:var(--c);border-color:var(--c)}.tl li.cur{font-weight:700;color:var(--tx)}.tl small{display:block;font-weight:400;color:var(--mu)}.svmap{position:relative;height:300px;border-radius:12px;overflow:hidden;background:#dfe7ea repeating-linear-gradient(45deg,transparent 0 14px,rgba(0,0,0,.04) 14px 28px);border:1px solid var(--bd);margin:12px 0;touch-action:pan-y}.svmap img.t{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}.svmap .pin{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:700;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff;pointer-events:none}.svmap .pin svg{width:30px;height:30px;display:block;margin:0 auto}.svmap .att{position:absolute;right:4px;bottom:2px;font-size:10px;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:4px}.svmap .hors{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;color:#333;background:rgba(255,255,255,.88)}.cert{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;border:1px solid var(--bd)}.cert.ok{color:#1f8a4c;border-color:#1f8a4c}.cert.wa{color:#b26a00;border-color:#b26a00}.cert.ko{color:#b3261e;border-color:#b3261e}.lgn{display:grid;grid-template-columns:1fr 70px 110px auto;gap:6px;align-items:end;margin:6px 0}@media(max-width:560px){.lgn{grid-template-columns:1fr 60px}}
.qrb{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.qrb .qrimg{width:180px;height:180px;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--bd)}.qrb .qrimg svg{width:100%;height:100%;display:block}.scan{position:relative;max-width:420px;margin:10px 0;border-radius:12px;overflow:hidden;background:#000}.scan video{display:block;width:100%}.scan .cadre{position:absolute;inset:18% 18%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.mu{color:var(--mu)}.empty{padding:16px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu)}
.avis{font-style:italic}.avis b{font-style:normal;display:block;margin-top:6px;color:var(--c)}
.logo-area img{height:40px;max-width:180px;object-fit:contain;display:block}
.gal{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.gal figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}.gal figcaption{padding:10px 12px;font-size:13px;color:var(--mu)}.gal figcaption b{display:block;color:var(--tx);font-size:14px}
.vid{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000;margin-bottom:10px}.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.docs a{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;text-decoration:none;margin-bottom:8px}.docs small{color:var(--mu);display:block}
.slides{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);background:#000;flex:1 1 340px;max-height:380px}.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s}.slides img.on{opacity:1}
.slides .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);font-size:.85rem}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}#lb.on{display:flex}#lb img{max-width:100%;max-height:80vh;border-radius:10px}#lb p{color:#fff;margin:0;text-align:center}#lb button{position:absolute;top:14px;right:14px}
.motdg{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;margin:6px 0 22px}.motdg-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);align-items:stretch}.motdg.sans-photo .motdg-grid{grid-template-columns:minmax(0,1fr)}
.motdg-photo{margin:0;min-height:280px;background:#efe7d6}.motdg-photo img{width:100%;height:100%;min-height:280px;object-fit:cover;object-position:center top;display:block}.motdg-texte{padding:26px 28px}
.motdg-sur{display:flex;align-items:center;gap:10px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:6px}.motdg-sur i{display:block;width:38px;height:2px;background:var(--c);border-radius:2px}
.motdg h3{font-family:var(--serif);font-size:1.7rem;line-height:1.15;margin:0 0 12px}.motdg .acc{font-style:italic;font-weight:600;margin:0 0 14px;line-height:1.7}.motdg .corps p{margin:0 0 12px;line-height:1.8;color:var(--mu)}
.motdg .sign{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)}.motdg .sign b{display:block}.motdg .sign span{font-size:.82rem;color:var(--mu)}
@media(max-width:860px){.motdg-grid{grid-template-columns:minmax(0,1fr)}.motdg-photo,.motdg-photo img{min-height:220px}}
.abn{height:210px;border-radius:22px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,var(--c),var(--c2));position:relative}.abn img{width:100%;height:100%;object-fit:cover;display:block}
.pts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}.pts li:before{content:"✓";color:var(--c);font-weight:800;margin-right:8px}.card .ban{height:120px;margin:-18px -18px 6px;border-radius:18px 18px 0 0;overflow:hidden}.card .ban img{width:100%;height:100%;object-fit:cover;display:block}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.tab-link .i,.hero-btn .i,.go .i,.chip .i,.nav-dropdown-trigger .i{margin-right:6px}.card .ic{color:var(--c)}.card .ic .i{width:30px;height:30px}
.atout .ic{color:#fff;overflow:hidden}.atout .ic .i{width:24px;height:24px}.atout .ic img{width:100%;height:100%;object-fit:cover;display:block}.atout .ic.ph{background:none}
.ban.vide{display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,#fff),color-mix(in srgb,var(--c) 35%,#fff));color:var(--c)}.ban.vide .i{width:42px;height:42px;opacity:.8}
.bp .th{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg)}
.legal{font-size:12px;color:var(--mu);margin-top:6px}
footer{margin-top:28px;padding:22px 0 30px;color:var(--mu);font-size:13px;border-top:1px solid var(--bd);text-align:center}footer button{background:none;border:0;color:var(--c);cursor:pointer;font:inherit;text-decoration:underline}
dialog{max-width:640px;width:calc(100% - 32px);border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:18px}dialog::backdrop{background:rgba(0,0,0,.5)}
@media(max-width:640px){.hero{padding:36px 0 64px}.header-flex{padding:10px 16px}}
</style>
</head>

function qrTraiter(txt){

  ${T.atouts.length?`<div class="container"><div class="atouts">${T.atouts.map(a=>`<div class="atout"><div class="ic ${a.photo?"ph":""}">${a.photo?`<img src="${esc(a.photo)}" alt="" loading="lazy">`:ico("check")}</div><div><b>${esc(a.titre)}</b><span>${esc(a.texte)}</span></div></div>`).join("")}</div></div>`:""}
  <section class="pg"><div class="container"><div class="card" id="sv_home" style="margin-bottom:22px"><div class="ic">${ico("pin")}</div><h3>Suivre ma livraison</h3><p>Collez le lien de suivi reçu par WhatsApp : état de la commande, livreur et carte.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="svh_in" autocomplete="off" placeholder="Lien de suivi" style="flex:1;min-width:200px" aria-label="Lien de suivi"><button type="button" class="go" id="svh_go">Suivre</button></div><div id="svh_er" class="err" style="display:none"></div></div>${motDG()}${vehOk()?`<div style="margin-bottom:22px">${titreSec("Véhicules à vendre","")}<div class="grid">${VEH.slice(0,3).map(vehCarte).join("")}</div><p><button type="button" class="go" data-go="vehicules">Voir tous les véhicules →</button></p></div>`:""}${titreSec("Nos activités","Choisissez une activité pour en savoir plus.")}<div class="grid">${T.activites.map(a=>`<div class="card">${a.banniere?`<div class="ban"><img src="${esc(a.banniere)}" alt="${esc(a.nom)}" loading="lazy"></div>`:`<div class="ban vide">${ico("building")}</div>`}<h3>${esc(a.nom)}</h3><p>${esc(a.texte)}</p><button type="button" class="go" data-go="${a.id}">En savoir plus →</button></div>`).join("")||'<div class="empty">Nos activités seront publiées prochainement.</div>'}</div>
   ${T.vendeurs.actif?`<div class="band"><div><h3>Vendez avec nous</h3><p>${esc(T.vendeurs.texte)}</p></div><button type="button" class="hero-btn" data-go="vendeur">Devenir vendeur partenaire</button></div>`:""}</div></section>`},
 vehicules:()=>`<section class="pg"><div class="container">${titreSec("Véhicules à vendre","Véhicules disponibles et arrivages prochains. Demandez un devis par WhatsApp.")}${vehOk()?'<div id="vl"></div>':'<div class="empty">Le catalogue de véhicules sera publié prochainement.</div>'}</div></section>`,
 boutique:()=>`<section class="pg"><div class="container">${titreSec("Boutique en ligne","Choisissez vos produits, indiquez votre adresse : la commande part par WhatsApp.")}<div id="shop"></div></div></section>`,
 vendeur:()=>`<section class="pg"><div class="container">${titreSec("Devenir vendeur partenaire","")}<div id="vend"></div></div></section>`,
 livraison:()=>`<section class="pg"><div class="container">${titreSec("Programmer une livraison","Scannez un QR code ou remplissez le formulaire : nous récupérons votre colis et le livrons au créneau choisi.")}<div id="lv"></div></div></section>`,
 suivi:()=>`<section class="pg"><div class="container">${titreSec("Suivi de livraison","Suivez l'avancement de votre commande, de la préparation à la livraison.")}<div id="sv"></div></div></section>`,
 commander:()=>`<section class="pg"><div class="container">${titreSec("Passer commande","")}<div id="cm"></div></div></section>`,
 societe:()=>`<section class="pg"><div class="container">${titreSec("Notre société","")}<div class="card"><p style="color:var(--tx);font-size:16px;white-space:pre-wrap">${esc(T.societe)}</p></div>${galHtml(mPhotos(m=>m.cat==="societe"))?`<div style="margin-top:14px">${galHtml(mPhotos(m=>m.cat==="societe"))}</div>`:""}<div class="grid" style="margin-top:14px">${T.activites.map(a=>`<div class="card"><h3>${esc(a.nom)}</h3><p>${esc(a.texte)}</p></div>`).join("")}</div>${(T.legal.raison||T.legal.rccm||T.legal.siege)?`<p class="legal">${[T.legal.raison&&esc(T.legal.raison),T.legal.forme&&esc(T.legal.forme),T.legal.capital&&"Capital : "+esc(T.legal.capital),T.legal.rccm&&"RCCM : "+esc(T.legal.rccm),T.legal.siege&&"Siège : "+esc(T.legal.siege),T.legal.dirigeant&&"Dirigeant : "+esc(T.legal.dirigeant)].filter(Boolean).join(" · ")}</p>`:""}</div></section>`,
 photos:()=>`<section class="pg"><div class="container">${titreSec("Photos et vidéos","")}${vidHtml(mVideos(m=>m.cat!=="accueil"))}${galHtml(mPhotos(m=>m.cat!=="document"&&m.cat!=="accueil"))||'<div class="empty">Les photos seront publiées prochainement.</div>'}</div></section>`,
 documents:()=>`<section class="pg"><div class="container">${titreSec("Documents","Brochures et documents à télécharger.")}${docHtml(MED.filter(m=>m.type==="doc"))||'<div class="empty">Aucun document publié.</div>'}</div></section>`,
 avis:()=>`<section class="pg"><div class="container">${titreSec("Avis de nos clients","")}<div class="grid">${T.avis.map(a=>`<div class="card avis"><p style="color:var(--tx)">« ${esc(a.texte)} »</p><b>${esc(a.nom)}</b></div>`).join("")}</div></div></section>`,
 faq:()=>`<section class="pg"><div class="container">${titreSec("Questions fréquentes","")}${T.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.r)}</p></details>`).join("")||'<div class="empty">Aucune question publiée.</div>'}</div></section>`,
 contact:()=>{const c=T.contact,ct=[];if(c.tel)ct.push(`<a class="card" href="tel:${esc(c.tel.replace(/[^\d+]/g,""))}"><div class="ic">${ico("phone")}</div><h3>Téléphone</h3><p>${esc(c.tel)}</p></a>`);
  if(c.whatsapp)ct.push(`<a class="card" href="https://wa.me/${telWA(c.whatsapp)}"><div class="ic">${ico("chat")}</div><h3>WhatsApp</h3><p>${esc(c.whatsapp)}</p></a>`);
  if(c.email)ct.push(`<a class="card" href="mailto:${esc(c.email)}"><div class="ic">${ico("mail")}</div><h3>E-mail</h3><p>${esc(c.email)}</p></a>`);
  if(c.adresse||c.horaires)ct.push(`<div class="card"><div class="ic">${ico("pin")}</div><h3>Adresse</h3><p>${esc(c.adresse)}${c.adresse&&c.horaires?"<br>":""}${esc(c.horaires)}</p></div>`);
  return `<section class="pg"><div class="container">${titreSec("Nous contacter","")}<div class="ct">${ct.join("")||'<div class="empty">Les coordonnées seront publiées prochainement.</div>'}</div></div></section>`},
 "espace-client":()=>`<section class="pg"><div class="container">${titreSec("Espace client","Commandez, puis suivez votre commande par WhatsApp.")}<div class="grid"><div class="card"><div class="ic">${ico("cart")}</div><h3>Passer une commande</h3><p>Choisissez vos produits et envoyez votre commande.</p><button type="button" class="go" data-go="boutique">Ouvrir la boutique →</button></div>
  <div class="card"><div class="ic">${ico("pin")}</div><h3>Suivre ma commande</h3><p>Ouvrez le lien de suivi reçu par WhatsApp, ou indiquez votre référence : nous vous répondons.</p><button type="button" class="go" data-go="suivi">Suivre ma livraison →</button></div></div></div></section>`,
 "espace-vendeur":()=>`<section class="pg"><div class="container">${titreSec("Espace vendeur partenaire","")}<div class="grid"><div class="card"><div class="ic">${ico("pen")}</div><h3>Je souhaite devenir partenaire</h3><p>${esc(T.vendeurs.texte)}</p>${T.vendeurs.actif?'<button type="button" class="go" data-go="vendeur">Déposer ma candidature →</button>':'<p class="mu">Les candidatures sont fermées pour le moment.</p>'}</div>
  <div class="card"><div class="ic">${ico("chat")}</div><h3>Je suis déjà partenaire</h3><p>Vos commandes et vos règlements sont gérés avec votre responsable : contactez-le sur WhatsApp. Vos accès de travail vous sont communiqués par l'entreprise.</p>${waNum()?`<a class="go" href="https://wa.me/${waNum()}">Contacter sur WhatsApp</a>`:""}</div></div></div></section>`
};
const actPage=id=>{const a=T.activites.find(x=>x.id===id);return a?`<section class="pg"><div class="container">${a.banniere?`<div class="abn"><img src="${esc(a.banniere)}" alt="${esc(a.nom)}"></div>`:""}${titreSec(esc(a.nom),a.slogan||a.texte)}${a.slogan&&a.texte?`<p style="margin:-8px 0 14px;color:var(--mu)">${esc(a.texte)}</p>`:""}${vidHtml(mVideos(m=>m.act===a.id))}${galHtml(mPhotos(m=>m.act===a.id))}<div class="card" style="margin-top:12px"><p style="color:var(--tx);font-size:16px;white-space:pre-wrap">${esc(a.detail||a.texte)}</p>${a.points.length?`<ul class="pts">${a.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}${shopOk()?'<button type="button" class="go" data-go="boutique">Commander en ligne →</button>':""}<button type="button" class="go" data-go="contact">Nous contacter →</button></div></div></section>`:""};
let PAGE="accueil";
function pageDe(){const h=location.hash;const m=/^#\/([a-z0-9\-]+)/i.exec(h);return m?m[1]:"accueil"}
function allerA(p){const cur=location.hash.replace(/^#\/?[a-z0-9\-]*/i,"");location.hash="#/"+p;}
function navRendre(){
 const cur=PAGE,act=T.activites;
 document.getElementById("parcours").innerHTML=`<ul class="p-liste">`+PARC().map(e=>`<li class="p-etape"><div class="p-hd"><b>${e.n}</b><span>${e.t}</span></div><ul class="p-liste">`+e.l.map(([k,l,ic])=>k==="@act"?(act.length?`<li class="nav-dropdown p-activites"><button type="button" class="nav-dropdown-trigger" data-dd="act-menu">${ico(ic)}${l}</button><div class="nav-dropdown-menu" id="act-menu">${act.map(a=>`<button class="tab-link" data-go="${a.id}">${esc(a.nom)}</button>`).join("")}</div></li>`:""):`<li><button type="button" class="tab-link ${cur===k&&e.n!==3?"active":""}" data-go="${k}">${ico(ic)}${l}</button></li>`).join("")+`</ul></li>`).join("")+`</ul>`;
}
function vehRendre(){const el=document.getElementById("vl");el.innerHTML=vehListe();
 const maj=()=>{ST.vq=el.querySelector("#vq").value;ST.vcar=el.querySelector("#vcar").value;ST.vo=el.querySelector("#vo").value;const g=el.querySelector("#vgrid");g.innerHTML=vehListe().match(/<div class="grid" id="vgrid">([\s\S]*)<\/div>$/)[1]};
 el.querySelector("#vq").oninput=maj;el.querySelector("#vcar").onchange=maj;el.querySelector("#vo").onchange=maj}
function rendre(){
 PAGE=pageDe();document.documentElement.style.setProperty("--c",T.couleur);document.querySelector('meta[name=theme-color]').content=T.couleur;document.title=T.nom;
 {const r=document.documentElement.style;if(T.couleur2)r.setProperty("--c2",T.couleur2);else r.removeProperty("--c2");if(T.couleur3)r.setProperty("--c3",T.couleur3);else r.removeProperty("--c3")}
 document.getElementById("logo").innerHTML=T.logo?`<img src="${esc(T.logo)}" alt="${esc(T.nom)}">`:"";document.getElementById("brand").style.display=T.logo?"none":"";
 document.getElementById("brand").textContent=T.nom;document.getElementById("brandsub").textContent=T.slogan;
 const bw=document.getElementById("bandeau-w");bw.hidden=!T.bandeau.length;document.getElementById("bandeau").innerHTML=T.bandeau.map(x=>`<span>${esc(x)}</span>`).join("");
 navRendre();
 const html=PAGES[PAGE]?PAGES[PAGE]():actPage(PAGE)||PAGES.accueil();
 document.getElementById("page").innerHTML=html;
 slideLance();if(document.getElementById("vl")){vehRendre()}if(document.getElementById("lv"))livraisonRendre();else scanStop();if(document.getElementById("sv"))suiviRendre();if(document.getElementById("cm"))commanderRendre();if(document.getElementById("shop"))rendreShop();if(document.getElementById("vend"))rendreVend();
 const sg=document.getElementById("suivi_ref");if(sg){const go=document.getElementById("suivi_go"),maj=()=>{const r=sg.value.trim().toUpperCase(),n=waNum();go.href=n?"https://wa.me/"+n+"?text="+encodeURIComponent("Bonjour, je souhaite le suivi de ma commande"+(r?" (réf. "+r+")":"")+"."):"#/espace-client"};sg.oninput=maj;maj()}
 document.getElementById("copy").textContent="© "+new Date().getFullYear()+" "+T.nom;
 {const L=T.legal,l=[L.raison,L.forme,L.capital&&"Capital : "+L.capital,L.rccm&&"RCCM : "+L.rccm,L.siege&&"Siège : "+L.siege,L.dirigeant&&"Dirigeant : "+L.dirigeant].filter(Boolean).join("\n");document.getElementById("mentions").textContent=[l,T.mentions].filter(Boolean).join("\n\n")||"Les mentions légales seront publiées prochainement. "+T.nom+"."}
 window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
 const dd=e.target.closest("[data-dd]");document.querySelectorAll(".nav-dropdown-menu.open").forEach(m=>{if(!dd||m.id!==dd.dataset.dd)m.classList.remove("open")});
 if(dd){const m=document.getElementById(dd.dataset.dd);m.classList.toggle("open");if(m.classList.contains("open")&&dd.closest(".parcours")){const r=dd.getBoundingClientRect();m.style.position="fixed";m.style.left=Math.max(8,Math.min(r.left,innerWidth-250))+"px";m.style.top=(r.bottom+6)+"px";m.style.right="auto"}return}
 const g=e.target.closest("[data-go]");if(g){document.querySelectorAll(".nav-dropdown-menu.open").forEach(m=>m.classList.remove("open"));allerA(g.dataset.go);return}
 if(e.target.id==="lm")document.getElementById("dlg").showModal();
 if(e.target.dataset&&e.target.dataset.lb){document.getElementById("lbi").src=e.target.src;document.getElementById("lbi").alt=e.target.alt;document.getElementById("lbc").textContent=e.target.closest("figure").innerText;document.getElementById("lb").classList.add("on")}
 if(e.target.id==="lbx"||e.target.id==="lb")document.getElementById("lb").classList.remove("on");
 if(e.target.id==="svh_go"){const v=document.getElementById("svh_in").value.trim(),m=/#\/suivi\/([A-Za-z0-9_.\-]+)/.exec(v)||/^([A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)$/.exec(v),er=document.getElementById("svh_er");if(m)location.hash="#/suivi/"+m[1];else if(!v)location.hash="#/suivi";else{er.textContent="Lien non reconnu : collez le lien complet reçu par WhatsApp.";er.style.display="block"}}
 const vd=e.target.closest("[data-vd]");if(vd){vehFiche(vd.dataset.vd);return}
 const v=e.target.closest("[data-vue]");if(v){if(v.dataset.vue==="lvr"){ST.ls="form";ST.lcg=null;livraisonRendre()}else if(v.dataset.vue==="cmd"){ST.cs="form";ST.cl=null;ST.cgps=null;commanderRendre()}else if(v.dataset.vue==="shop"){ST.vs="form";ST.q={};ST.gps=null;rendreShop()}else{ST.vc="form";rendreVend()}}
 if(e.target.dataset.cp){const t=e.target.parentElement.querySelector("textarea");(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>t.select())}});
addEventListener("storage",ev=>{if(ev.key===KEY){T=charger();rendre()}});try{new BroadcastChannel("angels_portail").onmessage=()=>{T=charger();Promise.all([lireMedias(),lireVehicules()]).then(([m,v])=>{MED=m;VEH=v;rendre()})}}catch(e){}
addEventListener("hashchange",()=>{if(/[#&]p=/.test(location.hash)){T=charger();location.hash="#/accueil"}else rendre()});
if(/[#&]p=/.test(location.hash)){T=charger();history.replaceState(null,"",location.pathname+"#/accueil")}
rendre();Promise.all([lireMedias(),lireVehicules()]).then(([m,v])=>{MED=m;VEH=v;rendre()}).catch(()=>{});
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
