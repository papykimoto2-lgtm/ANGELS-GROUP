<title>ANGEL'S AGRO — Élevage avicole</title>
<style>
:root{--b:#2d6a4f;--b2:#1a4731;--bg:#f3f8f4;--card:#fff;--tx:#15251c;--mu:#7a6a60;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#d5e5da;--okbg:#e3f5ea;--wabg:#fff1d6;--erbg:#fde5e5;--bbg:#dff3e6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--card:#182a20;--tx:#e8f3ec;--mu:#9bb5a5;--bd:#2c4637;--okbg:#14351f;--wabg:#3d2e0c;--erbg:#431616;--bbg:#1e4030}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
aside{width:236px;background:var(--b2);color:#fff;padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;font-size:16px;padding:6px 8px 12px;line-height:1.2}
aside .brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
aside .gt{margin:12px 10px 3px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;font-weight:700}
aside a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:#ffe8db;cursor:pointer;text-decoration:none}
aside a:hover{background:rgba(255,255,255,.12)}aside a.on{background:#fff;color:var(--b2);font-weight:700}
aside .who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:12px}
main{flex:1;padding:18px;min-width:0}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .v{font-size:21px;font-weight:800}.kpi .l{color:var(--mu);font-size:12px}
.kpi.w .v{color:var(--wa)}.kpi.e .v{color:var(--er)}.kpi.o .v{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{background:var(--b2)}.btn.sm{padding:4px 9px;font-size:12px;min-height:0}
.btn.ghost{background:transparent;color:var(--b);border:1px solid var(--b)}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn:disabled{opacity:.5}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bbg);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.er{background:var(--erbg);color:var(--er)}.badge.mu{background:var(--bd);color:var(--mu)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu)}.sm{font-size:12px}.r{text-align:right}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 9px;background:var(--card);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-top:8px}
.fg{display:grid;gap:0 10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md>div{background:var(--card);border-radius:14px;padding:16px;max-width:880px;width:100%;max-height:92vh;overflow:auto}
.login{max-width:350px;margin:10vh auto;padding:0 16px}
.burger{display:none}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--wabg);color:var(--wa);font-weight:600}.al.er{background:var(--erbg);color:var(--er)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--b);border-color:var(--b)}
.note{background:var(--wabg);color:var(--wa);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:12px}
canvas{max-width:100%}
@media(max-width:800px){.shell{display:block}aside{position:fixed;z-index:40;height:100%;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.burger{display:inline-block;margin-bottom:10px}main{padding:12px}}
@media print{aside,.noprint,.burger{display:none!important}.md{position:static;background:none;padding:0}.md>div{max-height:none}body{background:#fff;color:#000}}

<div id="app"></div>
<script>
"use strict";
const KEY="angels_agro_v1";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const nf=(n,d=0)=>(Math.round((n||0)*10**d)/10**d).toLocaleString("fr-FR",{maximumFractionDigits:d});
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10);
const fd=d=>d?new Date(d.length>10?d:d+"T00:00:00Z").toLocaleDateString("fr-FR",{timeZone:"UTC"}):"—";
const fdt=t=>t?new Date(t).toLocaleString("fr-FR",{timeZone:"UTC"}):"—";
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const by=(arr,id,k="id")=>arr.find(x=>x[k]===id);
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
let S=null,ME=null,view="dash";
const UI={tab:{},f:{}};

/* ---------- Référentiels ---------- */
const ROLES={admin:"Administrateur",direction:"Direction générale",chef:"Chef d'exploitation",soigneur:"Soigneur",magasinier:"Magasinier",commercial:"Commercial",caissier:"Caissier",comptable:"Comptable"};
const ALL=Object.keys(ROLES);
const ACL={ // qui peut faire quoi (appliqué aussi dans les fonctions, pas seulement dans les menus)
 lot:["admin","chef"],suivi:["admin","chef","soigneur"],sante:["admin","chef","soigneur"],couvoir:["admin","chef"],batiment:["admin","chef"],
 stock:["admin","chef","magasinier"],ajust:["admin","magasinier","direction"],fab:["admin","chef","magasinier"],achat:["admin","magasinier"],
 vente:["admin","commercial","caissier"],annulvente:["admin","direction"],paiement:["admin","caissier","commercial"],
 charge:["admin","chef","comptable","caissier"],treso:["admin","caissier","comptable"],compta:["admin","comptable"],extourne:["admin","comptable","direction"],
 periode:["admin","comptable","direction"],perso:["admin","direction","chef"],param:["admin","direction"],users:["admin"],tiers:["admin","commercial","magasinier","comptable"]};
const can=a=>!!ME&&(ME.role==="seed"||(ACL[a]||[]).includes(ME.role));
const need=(a,msg)=>{if(!can(a))throw new Error(msg||"Droits insuffisants pour cette action.")};
const NAV=[
 {v:"dash",l:"Tableau de bord",i:"📊",g:"Pilotage",r:ALL},{v:"rapports",l:"Rapports",i:"📨",g:"Pilotage",r:["admin","direction","chef","comptable"]},
 {v:"lots",l:"Lots & élevage",i:"🐔",g:"Élevage",r:["admin","direction","chef","soigneur"]},{v:"suivi",l:"Suivi quotidien",i:"📝",g:"Élevage",r:["admin","chef","soigneur"]},
 {v:"sante",l:"Santé & prophylaxie",i:"💉",g:"Élevage",r:["admin","chef","soigneur"]},{v:"couvoir",l:"Couvoir",i:"🥚",g:"Élevage",r:["admin","chef"]},
 {v:"batiments",l:"Bâtiments",i:"🏠",g:"Élevage",r:["admin","chef","direction"]},
 {v:"stock",l:"Stock",i:"📦",g:"Stock & achats",r:["admin","direction","chef","magasinier","comptable"]},{v:"fab",l:"Fabrication aliments",i:"🌽",g:"Stock & achats",r:["admin","chef","magasinier"]},
 {v:"achats",l:"Achats & fournisseurs",i:"🛒",g:"Stock & achats",r:["admin","direction","magasinier","comptable"]},
 {v:"ventes",l:"Ventes & clients",i:"🧾",g:"Ventes",r:["admin","direction","commercial","caissier","comptable"]},
 {v:"tresor",l:"Trésorerie",i:"🏦",g:"Argent",r:["admin","direction","caissier","comptable"]},{v:"charges",l:"Charges",i:"💸",g:"Argent",r:["admin","direction","chef","caissier","comptable"]},
 {v:"finance",l:"Rentabilité",i:"📈",g:"Argent",r:["admin","direction","chef","comptable"]},{v:"compta",l:"Comptabilité SYSCOHADA",i:"📒",g:"Argent",r:["admin","direction","comptable"]},
 {v:"perso",l:"Personnel",i:"👥",g:"Administration",r:["admin","direction","chef"]},{v:"users",l:"Utilisateurs & audit",i:"🛡️",g:"Administration",r:["admin"]},
 {v:"params",l:"Paramétrage",i:"⚙️",g:"Administration",r:["admin","direction"]}
];
const LOTTYPE={chair:"Chair",ponte:"Ponte"};
const CATP={aliment:"Aliment",medicament:"Médicament / vaccin",poussin:"Poussin",emballage:"Emballage",fini:"Produit fini",autre:"Autre"};
const CPT_ACHAT={poussin:"6011",aliment:"6013",medicament:"6015",emballage:"6022",autre:"628",fini:"628"};
const CHARGES={main_oeuvre:["Main-d'œuvre","6410"],energie:["Énergie","6052"],eau:["Eau","6051"],entretien:["Entretien, réparations","6224"],transport:["Transport","6222"],assurance:["Assurance","6161"],loyer:["Loyer","622"],impot:["Impôts et taxes","646"],autre:["Charges diverses","628"]};
const PLAN=[["101","Capital — apport","Capitaux"],["162","Emprunts","Capitaux"],["401","Fournisseurs","Tiers"],["411","Clients","Tiers"],["422","Personnel — rémunérations dues","Tiers"],["521","Banque et mobile money","Trésorerie"],["571","Caisse","Trésorerie"],["6011","Achats poussins","Charge"],["6013","Achats aliment","Charge"],["6015","Achats médicaments / vaccins","Charge"],["6022","Achats emballages","Charge"],["6051","Achats eau","Charge"],["6052","Achats énergie","Charge"],["6161","Primes d'assurance","Charge"],["622","Locations","Charge"],["6222","Transport","Charge"],["6224","Entretien, réparations","Charge"],["628","Charges diverses","Charge"],["646","Impôts et taxes","Charge"],["6410","Charges de personnel — salaires","Charge"],["701","Ventes — produits avicoles","Produit"],["758","Autres produits divers","Produit"]];
const JOURNAUX=[["VE","Ventes"],["AC","Achats et charges"],["TR","Trésorerie"],["PAIE","Paie"],["OD","Opérations diverses"]];
const PROTOCOLES=[["chair",1,"Vaccin Marek"],["chair",7,"Vaccin Gumboro"],["chair",14,"Vaccin Newcastle + IB"],["chair",21,"Rappel Gumboro"],["chair",28,"Anticoccidien"],["chair",35,"Rappel Newcastle"],["ponte",1,"Vaccin Marek"],["ponte",7,"Vaccin Gumboro"],["ponte",14,"Vaccin Newcastle + IB"],["ponte",28,"Rappel Gumboro"],["ponte",42,"Rappel Newcastle"],["ponte",56,"Vaccin EDS"],["ponte",112,"Rappel EDS avant ponte"]];
const phase=(t,a)=>t==="ponte"?(a<84?"Démarrage":a<126?"Pré-ponte":a<350?"Pic de ponte":a<500?"Déclin":"Réforme"):(a<10?"Démarrage":a<28?"Croissance":a<42?"Finition":"Prêt à vendre");

/* ---------- Persistance, audit, transactions ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){throw new Error("Stockage plein : données non enregistrées. Un backend (Supabase) est requis.")}};
const audit=(a,d)=>{S.audit.unshift({t:now(),u:ME?ME.nom:"système",r:ME?ME.role:"",a,d:d||""});if(S.audit.length>2000)S.audit.length=2000};
function atomic(fn,quiet){
 const snap=JSON.stringify(S),me=ME&&ME.id;
 try{const r=fn();save();return r===undefined?true:r}
 catch(e){S=JSON.parse(snap);if(me)ME=by(S.users,me)||null;if(!quiet)alert(e.message);return false}
}
const seq=(k,p)=>{S.seq[k]=(S.seq[k]||0)+1;return p+"-"+new Date().getFullYear()+"-"+String(S.seq[k]).padStart(4,"0")};

/* ---------- Comptabilité (partie double) ---------- */
const per=d=>d.slice(0,7);
function periodOpen(d){const p=by(S.periods,per(d));if(p&&p.statut==="cloturee")throw new Error("Période comptable clôturée : "+per(d)+".");if(!p)S.periods.push({id:per(d),statut:"ouverte"})}
function postEntry({journal,date,libelle,piece,source,lignes}){
 lignes=lignes.filter(l=>l.debit||l.credit);
 const d=sum(lignes,l=>l.debit),c=sum(lignes,l=>l.credit);
 if(lignes.length<2||d!==c||d<=0)throw new Error("Écriture déséquilibrée ou incomplète (débit "+fcfa(d)+" / crédit "+fcfa(c)+").");
 lignes.forEach(l=>{if(!by(S.accounts,l.compte,"num"))throw new Error("Compte inconnu : "+l.compte);if(l.debit&&l.credit)throw new Error("Ligne à la fois au débit et au crédit.")});
 periodOpen(date);
 const e={id:uid("je"),numero:seq("je","EC"),journal,date,libelle,piece:piece||"",source:source||null,lignes,par:ME?ME.nom:"système",t:now()};
 S.entries.push(e);return e;
}
function extournerSource(type,id,motif){
 S.entries.filter(e=>e.source&&e.source.type===type&&e.source.id===id&&!e.extournee).forEach(e=>{
  postEntry({journal:e.journal,date:today(),libelle:"Extourne "+e.numero+" — "+motif,piece:e.piece,source:{type:"extourne",id:e.id},lignes:e.lignes.map(l=>({compte:l.compte,tiers:l.tiers,debit:l.credit||0,credit:l.debit||0,lot:l.lot}))});
  e.extournee=true;
 });
}
const cptTreso=m=>m==="especes"?"571":"521";
const soldeCompte=(c,tiers)=>sum(S.entries.flatMap(e=>e.lignes.filter(l=>l.compte===c&&(!tiers||l.tiers===tiers))),l=>(l.debit||0)-(l.credit||0));

/* ---------- Stock ---------- */
const prod=id=>by(S.produits,id)||{nom:"?",unite:""};
const qteStock=pid=>sum(S.mvts.filter(m=>m.produit_id===pid),m=>m.sens==="entree"?m.qte:-m.qte);
function pmp(pid){ // coût moyen pondéré des entrées valorisées
 const en=S.mvts.filter(m=>m.produit_id===pid&&m.sens==="entree"&&m.pu>0),q=sum(en,m=>m.qte);return q>0?sum(en,m=>m.qte*m.pu)/q:((by(S.produits,pid)||{}).prix_ref||0);
}
function mouvement({produit_id,sens,qte,pu,motif,source,date,lot_id}){
 const p=by(S.produits,produit_id);if(!p)throw new Error("Produit introuvable.");
 qte=+qte;if(!(qte>0))throw new Error("Quantité invalide.");
 if(sens==="sortie"&&qte>qteStock(produit_id)+1e-9)throw new Error("Stock insuffisant : "+p.nom+" ("+nf(qteStock(produit_id),2)+" "+p.unite+" disponibles).");
 const m={id:uid("mv"),date:date||today(),produit_id,sens,qte,pu:sens==="sortie"?pmp(produit_id):(+pu||0),motif:motif||"",source:source||null,lot_id:lot_id||null,par:ME?ME.nom:"système"};
 S.mvts.push(m);return m;
}
function ajusterSource(type,id,cible,cfg){ // aligne le stock sur la quantité cible d'une saisie (modification d'un suivi)
 const cur=sum(S.mvts.filter(m=>m.source&&m.source.type===type&&m.source.id===id&&m.produit_id===cfg.produit_id),m=>m.sens===cfg.sens?m.qte:-m.qte);
 const d=cible-cur;if(Math.abs(d)<1e-9)return;
 mouvement({produit_id:cfg.produit_id,sens:d>0?cfg.sens:(cfg.sens==="sortie"?"entree":"sortie"),qte:Math.abs(d),pu:cfg.pu,motif:cfg.motif,source:{type,id},date:cfg.date,lot_id:cfg.lot_id});
}
function ajusterStock(pid,reel,motif){
 need("ajust");if(!String(motif||"").trim())throw new Error("Motif obligatoire pour un ajustement.");
 const d=reel-qteStock(pid);if(Math.abs(d)<1e-9)throw new Error("Aucun écart.");
 mouvement({produit_id:pid,sens:d>0?"entree":"sortie",qte:Math.abs(d),pu:d>0?pmp(pid):0,motif:"Inventaire : "+motif,source:{type:"ajust",id:uid("aj")}});audit("Ajustement de stock",prod(pid).nom+" "+nf(d,2));
}

/* ---------- Lots & suivi quotidien ---------- */
const lot=id=>by(S.lots,id)||{code:"?",nom:"?"};
const lotSorties=l=>S.sorties.filter(s=>s.lot_id===l.id&&!s.annule);
const vivantsLot=l=>Math.max(0,l.initial-sum(S.suivis.filter(x=>x.lot_id===l.id),x=>x.morts)-sum(lotSorties(l),s=>s.tetes));
function lotStats(l){
 const ds=S.suivis.filter(x=>x.lot_id===l.id).sort((a,b)=>a.date.localeCompare(b.date)),so=lotSorties(l);
 const morts=sum(ds,x=>x.morts),sortis=sum(so,s=>s.tetes),vivants=Math.max(0,l.initial-morts-sortis);
 const feed=sum(ds,x=>x.aliment_kg),eau=sum(ds,x=>x.eau_l),oeufs=sum(ds,x=>x.oeufs),casses=sum(ds,x=>x.casses);
 const age=Math.max(0,diffDays(l.statut==="clos"&&l.cloture?l.cloture:today(),l.debut))+1;
 const pes=ds.filter(x=>x.poids_g>0).slice(-1)[0],poids=pes?pes.poids_g:null,kgVendus=sum(so.filter(s=>s.type==="vente"),s=>s.poids_kg);
 const bio=(poids?poids/1000*vivants:0)+kgVendus,IC=l.type==="chair"&&bio>0&&feed>0?feed/bio:null;
 const l7=ds.filter(x=>x.oeufs>0||x.casses>0).slice(-7),tp=l.type==="ponte"&&l7.length&&vivants>0?sum(l7,x=>x.oeufs)/(l7.length*vivants)*100:null;
 const pl=S.settings.plateau,cPou=l.initial*(l.cout_poussin||0),cAl=sum(ds,x=>x.produit_id?x.aliment_kg*pmp(x.produit_id):0);
 const cSa=sum(S.soins.filter(s=>s.lot_id===l.id&&s.realise_le&&s.produit_id),s=>s.qte*pmp(s.produit_id))+sum(S.traitements.filter(t=>t.lot_id===l.id),t=>t.qte*pmp(t.produit_id));
 const cCh=sum(S.charges.filter(c=>c.lot_id===l.id&&c.statut==="valide"),c=>c.montant),cout=cPou+cAl+cSa+cCh;
 const recV=sum(S.ventes.filter(v=>v.statut==="valide").flatMap(v=>v.lignes.filter(x=>x.lot_id===l.id)),x=>x.total);
 const recO=l.type==="ponte"?Math.round((oeufs-casses)/pl*S.settings.prix_plateau):0;
 return{ds,morts,sortis,vivants,feed,eau,oeufs,casses,age,poids,kgVendus,IC,tp,mortPct:l.initial?morts/l.initial*100:0,casse:oeufs+casses>0?casses/(oeufs+casses)*100:0,
  cPou,cAl,cSa,cCh,cout,recV,recO,rec:recV+recO,marge:recV+recO-cout,coutKg:kgVendus>0?cout/kgVendus:null,phase:phase(l.type,age),attente:l.attente_jusqua&&l.attente_jusqua>=today()?l.attente_jusqua:null};
}
function creerLot(f){
 need("lot");if(!String(f.nom||"").trim())throw new Error("Nom du lot requis.");
 if(!(f.initial>0)||!Number.isInteger(+f.initial))throw new Error("Effectif initial invalide.");
 if(f.debut>today())throw new Error("Date de mise en place dans le futur.");
 const b=by(S.batiments,f.batiment_id);if(!b)throw new Error("Choisir un bâtiment.");
 const occ=sum(S.lots.filter(l=>l.batiment_id===b.id&&l.statut==="en_cours"),l=>vivantsLot(l));
 if(occ+ +f.initial>b.capacite)throw new Error("Capacité du bâtiment dépassée ("+occ+" + "+f.initial+" > "+b.capacite+").");
 const code=seq("lot","LOT");let cp=+f.cout_poussin||0;

function creerVente(f){
 need("vente");const c=by(S.clients,f.client_id);if(!c)throw new Error("Client requis.");if(f.date>today())throw new Error("Date dans le futur.");
 const L=f.lignes.filter(l=>(l.type==="vif"?+l.tetes>0:+l.qte>0));if(!L.length)throw new Error("Ajouter au moins une ligne.");

 L.forEach(l=>{
  if(l.type==="vif"){
   const lt=by(S.lots,l.lot_id);if(!lt)throw new Error("Lot requis pour une vente de sujets vivants.");if(lt.statut==="clos")throw new Error("Lot clos.");
   const t=+l.tetes,kg=+l.poids_kg,pu=+l.pu;if(!Number.isInteger(t)||t<=0)throw new Error("Nombre de têtes invalide.");if(!(kg>0)||!(pu>=0))throw new Error("Poids et prix requis.");
   if(t>vivantsLot(lt))throw new Error("Seulement "+vivantsLot(lt)+" sujets vivants dans "+lt.code+".");
   if(lt.attente_jusqua&&lt.attente_jusqua>=f.date)throw new Error("Vente interdite : délai d'attente sanitaire de "+lt.code+" jusqu'au "+fd(lt.attente_jusqua)+".");
   S.sorties.push({id:uid("sr"),lot_id:lt.id,date:f.date,type:"vente",tetes:t,poids_kg:kg,source_vente:id});
   lignes.push({type:"vif",lot_id:lt.id,designation:"Poulets vifs — "+lt.code,tetes:t,poids_kg:kg,qte:kg,pu,total:Math.round(kg*pu)});
  }else{
   const p=by(S.produits,l.produit_id);if(!p||p.categorie!=="fini")throw new Error("Produit fini requis.");const q=+l.qte,pu=+l.pu;if(!(pu>=0))throw new Error("Prix invalide.");
   mouvement({produit_id:p.id,sens:"sortie",qte:q,motif:"Vente",date:f.date,source:{type:"vente",id}});
   lignes.push({type:"stock",produit_id:p.id,designation:p.nom,qte:q,pu,total:Math.round(q*pu)});
  }
 });
 const total=sum(lignes,l=>l.total);if(total<=0)throw new Error("Montant total nul.");
 const v={id,numero:seq("vt","FAC"),date:f.date,client_id:c.id,lignes,total,statut:"valide",par:ME.nom};S.ventes.push(v);

 audit("Vente",v.numero+" "+total+" F");
 if(+f.paye>0)encaisserVente(id,{montant:+f.paye,mode:f.mode||"especes",ref:f.ref,date:f.date});
 return v;
}

const TRESO={apport:["Apport en capital","101","in"],emprunt:["Emprunt reçu","162","in"],subvention:["Subvention / prime","758","in"],remb_emprunt:["Remboursement d'emprunt","162","out"],retrait:["Prélèvement de l'exploitant","101","out"]};
function mouvTreso(f){
 need("treso");const m=Math.round(+f.montant);if(!(m>0))throw new Error("Montant invalide.");
 if(f.categorie==="virement"){ // caisse ↔ banque
  const from=f.sens==="vers_banque"?"571":"521",to=f.sens==="vers_banque"?"521":"571";if(m>soldeCompte(from))throw new Error("Solde insuffisant ("+fcfa(soldeCompte(from))+").");

 }
 const c=TRESO[f.categorie];if(!c)throw new Error("Catégorie invalide.");const cpt=cptTreso(f.mode==="especes"?"especes":"banque");
 if(c[2]==="out"&&m>soldeCompte(cpt))throw new Error("Solde insuffisant ("+fcfa(soldeCompte(cpt))+").");

 if(tot>soldeCompte(cpt))throw new Error("Trésorerie insuffisante ("+fcfa(soldeCompte(cpt))+" pour "+fcfa(tot)+").");

  <div class="grid">${RAP_ETATS.map(([k,ic,nm,ds,co])=>`<div class="card" style="border-left:4px solid ${co};margin:0"><div style="font-weight:700">${ic} ${nm}</div><div class="mu sm" style="margin:2px 0 10px">${ds}</div><div class="flex"><button class="btn sm" style="background:${co}" data-a="rp.imp" data-id="${k}">🖨 Imprimer</button><button class="btn sm ghost" data-a="rp.vue" data-id="${k}" title="Afficher ici">👁</button><button class="btn sm" style="background:#25D366" data-a="rp.wa" data-id="${k}" title="Envoyer par WhatsApp">WhatsApp</button></div></div>`).join("")}</div>
  <div id="etatInline" style="margin-top:14px">${UI.rapVue?etatInlineHtml(UI.rapVue):""}</div><h2>Exports</h2><div class="flex">${csvBtn("lots")}${csvBtn("stock")}${csvBtn("charges")}${csvBtn("ecritures")}</div>`;
 }else{
  h+=`<div class="card"><h2 style="margin-top:0">📋 Générer & envoyer un rapport</h2><div class="grid">${Object.entries(RAP_PERIODES).map(([k,[l,ic,sub]])=>`<div class="card" style="margin:0;text-align:center"><div style="font-size:26px">${ic}</div><div style="font-weight:700">${l}</div><div class="mu sm" style="margin-bottom:8px">${sub}</div><div class="flex" style="justify-content:center"><button class="btn sm" style="background:#25D366" data-a="rp.send" data-id="${k}:wa">WhatsApp</button><button class="btn sm ghost" data-a="rp.send" data-id="${k}:mail">Email</button><button class="btn sm ghost" data-a="rp.send" data-id="${k}:vue">Aperçu</button></div></div>`).join("")}</div></div>
  <div class="card"><h2 style="margin-top:0">⚙️ Destinations</h2><div class="flex"><div><label>WhatsApp</label><input id="rpWa" type="tel" placeholder="+225XXXXXXXXXX" value="${esc(cfg.whatsapp)}"></div><div><label>Email</label><input id="rpMail" type="email" placeholder="directeur@…" value="${esc(cfg.email)}"></div><div><label>Nom exploitation</label><input id="rpNom" value="${esc(cfg.nom)}"></div></div>${can("param")?`<p><button class="btn" data-a="rp.cfg">Enregistrer</button></p>`:`<p class="mu sm">Modification réservée à l'administration.</p>`}<p class="mu sm">Envoi automatique programmé : indisponible hors serveur (application locale) — les envois se déclenchent d'ici, d'un clic.</p></div>`;
 }
 return h;
};
function etatInlineHtml(k){const f=rapF();return `<div class="card"><div class="between"><h2 style="margin:0">${rapTitre(k)} — ${fd(f.min)} au ${fd(f.max)}</h2><div class="flex"><button class="btn sm" data-a="rp.imp" data-id="${k}">🖨 Imprimer</button><button class="btn sm" style="background:#25D366" data-a="rp.wa" data-id="${k}">WhatsApp</button><button class="btn sm ghost" data-a="rp.fer">✕</button></div></div><style>.etat-inline-corps .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}.etat-inline-corps .kpi-box{border:1px solid var(--bd,#c8e6d0);border-radius:8px;padding:8px;text-align:center}.etat-inline-corps .kpi-val{font-weight:800;font-size:16px}.etat-inline-corps .kpi-lbl{font-size:10px;opacity:.7;text-transform:uppercase}.etat-inline-corps table{width:100%;border-collapse:collapse;margin-bottom:10px}.etat-inline-corps th,.etat-inline-corps td{padding:5px 8px;border-bottom:1px solid #8883;text-align:left;font-size:12px}.etat-inline-corps .section-title{font-weight:800;margin:10px 0 4px}.etat-inline-corps .etat-tit{margin:14px 0 6px}</style><div class="etat-inline-corps tw">${etatCorps(k,f.min,f.max,f.lot)}</div></div>`}
A["rp.per"]=id=>{const f=rapF(),[a,b]=rapPeriode(id);f.min=a;f.max=b;render()};
A["rp.vue"]=id=>{UI.rapVue=id;render()};A["rp.fer"]=()=>{UI.rapVue=null;render()};
A["rp.imp"]=id=>{const f=rapF();rapOuvre(etatDoc(id,f.min,f.max,f.lot))};
A["rp.wa"]=id=>{const f=rapF();rapWA(etatTexte(id,f.min,f.max,f.lot),rapCfg().whatsapp)};
A["rp.send"]=v=>{const[p,c]=v.split(":"),[a,b]=rapPeriode(p),n=RAP_PERIODES[p][0],cfg=rapCfg();
 if(c==="vue")return rapOuvre(etatDoc("bilan",a,b,"",n.toUpperCase()));
 const txt=etatTexte("bilan",a,b,"").replace(/^\*[^\n]*\*/,"*"+n.toUpperCase()+"*");
 if(c==="wa")rapWA(txt,cfg.whatsapp);else{const to=cfg.email||prompt("Adresse email :");if(to)rapMail(txt,to,n+" — "+cfg.nom)}};
A["rp.cfg"]=()=>{try{need("param");const c=rapCfg();c.whatsapp=$("#rpWa").value.trim();c.email=$("#rpMail").value.trim();c.nom=$("#rpNom").value.trim()||"ANGEL'S AGRO";if(c.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email))throw new Error("Email invalide.");if(c.whatsapp&&!/^\+?[\d\s]{8,16}$/.test(c.whatsapp))throw new Error("Numéro WhatsApp invalide.");audit("Destinations des rapports","modifiées");save();alert("Enregistré.")}catch(e){alert(e.message)}};
/* ---- Administration ---- */
V.users=()=>{const t=tabOf("users","u");let h=head("Utilisateurs & audit",t==="u"?`<button class="btn" data-a="us.add">+ Utilisateur</button>`:"")+tabs("users",[["u","Utilisateurs"],["a","Journal d'audit"]]);
 if(t==="u")return h+tbl(["Nom","Rôle","État",""],S.users.map(u=>tr([esc(u.nom),esc(ROLES[u.role]),badge(u.actif?"Actif":"Désactivé",u.actif?"ok":"er"),`<div class="flex">${btn("us.pin",u.id,"Réinitialiser le PIN","ghost")}${u.id!==ME.id?btn("us.tg",u.id,u.actif?"Désactiver":"Activer","ghost"):""}</div>`])));
 const q=(UI.f.au&&UI.f.au.q||"").toLowerCase();return h+`<div class="card"><input data-f="au:q" placeholder="Filtrer…" value="${esc(UI.f.au&&UI.f.au.q||"")}"></div>`+tbl(["Date","Utilisateur","Rôle","Action","Détail"],S.audit.filter(a=>!q||(a.u+a.a+a.d).toLowerCase().includes(q)).map(a=>tr([fdt(a.t),esc(a.u),esc(a.r),esc(a.a),esc(a.d)])))};
A["us.add"]=()=>form("Nouvel utilisateur",[{k:"nom",l:"Nom",req:1},{k:"role",l:"Rôle",t:"select",o:Object.entries(ROLES)},{k:"pin",l:"PIN (4 chiffres)",req:1}],{},o=>{need("users");if(!/^\d{4}$/.test(o.pin))throw new Error("PIN : 4 chiffres.");const u={id:uid("u"),nom:o.nom,role:o.role,actif:true};u.h=hashPin(u.id,o.pin);S.users.push(u);audit("Utilisateur créé",o.nom)});
A["us.pin"]=id=>form("Réinitialiser le PIN",[{k:"pin",l:"Nouveau PIN (4 chiffres)",req:1}],{},o=>{need("users");if(!/^\d{4}$/.test(o.pin))throw new Error("PIN : 4 chiffres.");const u=by(S.users,id);u.h=hashPin(u.id,o.pin);S.tries[u.id]={n:0,until:0};audit("PIN réinitialisé",u.nom)});
A["us.tg"]=id=>{if(atomic(()=>{need("users");const u=by(S.users,id);if(u.id===ME.id)throw new Error("Impossible de se désactiver soi-même.");u.actif=!u.actif;audit("Compte "+(u.actif?"activé":"désactivé"),u.nom)}))render()};
const PARAMS=[["seuil_mort_jour","Alerte mortalité du jour (% de l'effectif)"],["seuil_mort_cum","Alerte mortalité cumulée (%)"],["seuil_ponte","Taux de ponte minimal (%)"],["ic_max","Indice de consommation maximal (chair)"],["delai_creance","Délai de créance client (jours)"],["plateau","Œufs par plateau"],["prix_plateau","Prix du plateau pour valoriser la ponte (F)"],["max_pj_ko","Taille max pièces jointes (Ko)"]];
V.params=()=>{const t=tabOf("par","p");let h=head("Paramétrage")+tabs("par",[["p","Seuils et prix"],["pro","Protocoles sanitaires"],["bk","Sauvegarde"]]);
 if(t==="p")h+=(can("param")?`<p><button class="btn" data-a="par.edit">Modifier</button></p>`:"")+tbl(["Paramètre","Valeur"],PARAMS.map(([k,l])=>tr([l,esc(S.settings[k])])));
 if(t==="pro")h+=(can("param")?`<p><button class="btn" data-a="pro.add">+ Soin au protocole</button></p>`:"")+`<div class="note">Le protocole est copié dans le calendrier à la création de chaque lot (les lots existants ne changent pas).</div>`+tbl(["Type","Âge (jour)","Soin",""],S.protocoles.map((p,i)=>tr([LOTTYPE[p.type],"J"+p.age,esc(p.action),can("param")?btn("pro.del",i,"Retirer","er"):""])));
 if(t==="bk")h+=`<div class="card"><p>Données locales : <b>${Math.round(JSON.stringify(S).length/1024)} Ko</b> (limite navigateur ≈ 5 000 Ko : backend Supabase requis pour la production).</p><div class="flex"><button class="btn" data-a="bk.exp">Exporter une sauvegarde</button>${can("param")?`<input type="file" id="bkf" accept="application/json" style="width:auto"><button class="btn ghost" data-a="bk.imp">Restaurer</button>`:""}<button class="btn ghost" data-a="bk.chk">Contrôle d'intégrité</button></div></div>`;
 return h};
A["par.edit"]=()=>form("Paramètres",PARAMS.map(([k,l])=>({k,l,t:"number"})),S.settings,o=>{need("param");PARAMS.forEach(([k])=>{if(!(o[k]>=0))throw new Error("Valeur invalide.");S.settings[k]=o[k]});if(!(S.settings.plateau>0))throw new Error("Œufs par plateau > 0.");audit("Paramètres modifiés")});
A["pro.add"]=()=>form("Soin au protocole",[{k:"type",l:"Type de lot",t:"select",o:[["chair","Chair"],["ponte","Ponte"]]},{k:"age",l:"Âge (jour)",t:"number",req:1},{k:"action",l:"Soin",req:1}],{},o=>{need("param");if(!(o.age>=1))throw new Error("Âge ≥ 1.");S.protocoles.push(o);audit("Protocole",o.action)});
A["pro.del"]=i=>{if(confirm("Retirer ce soin du protocole ?")&&atomic(()=>{need("param");S.protocoles.splice(+i,1)}))render()};
A["bk.exp"]=()=>{atomic(()=>audit("Sauvegarde exportée"),true);const data=JSON.parse(JSON.stringify(S));delete data.tries;const b=new Blob([JSON.stringify({app:"angels-agro",v:1,t:now(),sum:hashPin("bk",JSON.stringify(data)),data})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sauvegarde-agro-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
function restaurer(txt){need("param");let o;try{o=JSON.parse(txt)}catch(e){throw new Error("Fichier illisible.")}if(!o||o.app!=="angels-agro"||!o.data)throw new Error("Fichier de sauvegarde invalide.");if(hashPin("bk",JSON.stringify(o.data))!==o.sum)throw new Error("Somme de contrôle incorrecte : sauvegarde altérée.");const k=S.tries,id=ME.id;S=o.data;S.tries=k||{};ME=by(S.users,id)||null;audit("Sauvegarde restaurée");return integrite()}
A["bk.imp"]=async()=>{const f=$("#bkf");if(!f||!f.files[0])return alert("Choisir un fichier.");const txt=await f.files[0].text(),snap=JSON.stringify(S);try{const pb=restaurer(txt);save();alert(pb.length?"Restauré avec anomalies :\n"+pb.join("\n"):"Restauration réussie : intégrité vérifiée.");render()}catch(e){S=JSON.parse(snap);ME=by(S.users,ME.id);alert(e.message)}};
A["bk.chk"]=()=>{const p=integrite();alert(p.length?"Anomalies :\n"+p.join("\n"):"Intégrité OK.")};
/* ---------- Connexion, rendu, événements ---------- */
const showNav=n=>n.r.includes(ME.role);
function login(id,pin){
 const u=by(S.users,id);if(!u)return"Compte inconnu.";const t=S.tries[u.id]||{n:0,until:0};
 if(Date.now()<t.until)return"Compte bloqué 1 minute (trop de tentatives).";if(!u.actif)return"Compte désactivé.";
 if(u.h===hashPin(u.id,pin)){S.tries[u.id]={n:0,until:0};ME=u;try{sessionStorage.setItem("ag_me",u.id)}catch(x){}view="dash";atomic(()=>audit("Connexion"),true);return null}
 t.n++;if(t.n>=5){t.until=Date.now()+6e4;t.n=0}S.tries[u.id]=t;try{save()}catch(e){}return"PIN incorrect.";
}
function render(){
 const app=$("#app");
 if(!ME){
  app.innerHTML=`<div class="login card"><h1>🐔 ANGEL'S AGRO</h1><p class="mu sm" style="margin-top:-8px">Élevage avicole</p><form id="lf"><label>Compte</label><select name="u">${S.users.filter(u=>u.actif).map(u=>`<option value="${u.id}">${esc(u.nom)} (${esc(ROLES[u.role])})</option>`).join("")}</select><label>PIN</label><input name="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required><p id="le" class="mu sm"></p><button class="btn" style="width:100%">Connexion</button></form><p class="mu sm">PIN oublié ? Demander la réinitialisation à l'administrateur.</p><p class="mu sm">Démo — admin 1234 · direction 0000 · chef 1111 · soigneur 2222 · magasinier 3333 · commercial 4444 · caissier 5555 · comptable 6666</p>${pwaBtn()?`<p>${pwaBtn()}</p>`:""}<p><a href="hub.html">← Hub</a></p></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();const r=login(e.target.u.value,e.target.p.value);if(r)$("#le").textContent=r;else render()};return;
 }
 const items=NAV.filter(showNav);if(!items.some(n=>n.v===view))view=items[0].v;
 let g="",nav="";items.forEach(n=>{if(n.g!==g){g=n.g;nav+=`<div class="gt">${esc(g)}</div>`}nav+=`<a data-a="nav" data-id="${n.v}" class="${n.v===view?"on":""}">${n.i} ${esc(n.l)}</a>`});
 let body;try{body=V[view]()}catch(e){body=`<div class="card"><b>Erreur d'affichage</b><p>${esc(e.message)}</p></div>`}
 app.innerHTML=`<div class="shell"><aside id="sb"><div class="brand">🐔 ANGEL'S AGRO<small>Élevage avicole</small></div>${nav}<a href="hub.html">🏠 Hub groupe</a><div class="who">${esc(ME.nom)}<br><span class="mu">${esc(ROLES[ME.role])}</span><br>${pwaBtn()?pwaBtn()+"<br>":""}<a data-a="out">Déconnexion</a></div></aside><main><button class="btn ghost burger" data-a="bg">☰ Menu</button>${body}</main></div>`;
}
A.out=()=>{atomic(()=>audit("Déconnexion"),true);ME=null;try{sessionStorage.removeItem("ag_me")}catch(x){}render()};A.bg=()=>$("#sb").classList.toggle("open");
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||!S||t.tagName==="INPUT")return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.id,t,e)}});
document.addEventListener("change",e=>{const t=e.target;if(!S||!t.dataset.f)return;const[k,p]=t.dataset.f.split(":");(UI.f[k]=UI.f[k]||{})[p]=t.value;render()});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue&&!document.querySelector(".md")){try{S=JSON.parse(e.newValue);if(ME)ME=by(S.users,ME.id);if(ME&&!ME.actif)ME=null;render()}catch(x){}}});
/* ---------- PWA : installation, mise à jour, hors ligne ---------- */
let DEF=null,MAJ=false;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const installe=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaBtn=()=>installe()?"":(DEF||estIOS())?`<a data-a="pwa.inst">📲 Installer l'application</a>`:"";
A["pwa.inst"]=async()=>{if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()}else alert("Sur iPhone / iPad : ouvrir cette page dans Safari, toucher « Partager », puis « Sur l'écran d'accueil ».")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEF=e;if(!document.querySelector(".md"))render()});
window.addEventListener("appinstalled",()=>{DEF=null;render()});
function barre(){
 let b=$("#pwaBar");
 if(!MAJ&&navigator.onLine){if(b)b.remove();return}
 if(!b){b=document.createElement("div");b.id="pwaBar";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px;text-align:center;font-weight:600";document.body.appendChild(b)}
 if(MAJ){b.style.background="var(--b)";b.style.color="#fff";b.innerHTML="Nouvelle version disponible — <a href='#' id='pwaUp' style='color:#fff;text-decoration:underline'>recharger</a>";$("#pwaUp").onclick=ev=>{ev.preventDefault();location.reload()}}
 else{b.style.background="var(--wabg)";b.style.color="var(--wa)";b.textContent="Mode hors ligne — vos données restent enregistrées sur cet appareil"}
}
window.addEventListener("online",barre);window.addEventListener("offline",barre);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let avait=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(avait){MAJ=true;barre()}avait=true});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
barre();
load();
try{const id=sessionStorage.getItem("ag_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
</script>
