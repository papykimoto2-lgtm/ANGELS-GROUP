<style>
:root{--b:#2d6a4f;--b2:#1a4731;--bg:#f3f8f4;--card:#fff;--tx:#15251c;--mu:#7a6a60;--ok:#118a4b;--wa:#b86e00;--er:#c62828;--bd:#d5e5da;--okbg:#e3f5ea;--wabg:#fff1d6;--erbg:#fde5e5;--bbg:#dff3e6}

*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}

aside a:hover{background:rgba(255,255,255,.12)}aside a.on{background:#fff;color:var(--b2);font-weight:700}
aside .who{margin-top:14px;padding:10px;border-top:1px solid rgba(255,255,255,.2);font-size:12px}

h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .v{font-size:21px;font-weight:800}.kpi .l{color:var(--mu);font-size:12px}
.kpi.w .v{color:var(--wa)}.kpi.e .v{color:var(--er)}.kpi.o .v{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:14px}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{background:var(--b2)}.btn.sm{padding:4px 9px;font-size:12px;min-height:0}
.btn.ghost{background:transparent;color:var(--b);border:1px solid var(--b)}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn:disabled{opacity:.5}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bbg);color:var(--b);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.er{background:var(--erbg);color:var(--er)}.badge.mu{background:var(--bd);color:var(--mu)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mu{color:var(--mu)}.sm{font-size:12px}.r{text-align:right}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 9px;background:var(--card);width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-top:8px}
.fg{display:grid;gap:0 10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md>div{background:var(--card);border-radius:14px;padding:16px;max-width:880px;width:100%;max-height:92vh;overflow:auto}
.login{max-width:350px;margin:10vh auto;padding:0 16px}
.burger{display:none}
.al{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--wabg);color:var(--wa);font-weight:600}.al.er{background:var(--erbg);color:var(--er)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--b);border-color:var(--b)}
.note{background:var(--wabg);color:var(--wa);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:12px}
canvas{max-width:100%}
@media(max-width:800px){.shell{display:block}aside{position:fixed;z-index:40;height:100%;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.burger{display:inline-block;margin-bottom:10px}main{padding:12px}}
.ml{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}.ml>div{min-width:0}@media(max-width:860px){.ml{grid-template-columns:1fr}}.ml2{display:grid;grid-template-columns:1fr 220px;gap:14px}@media(max-width:700px){.ml2{grid-template-columns:1fr}}.lotcard{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}.lotcard.on{border-color:var(--b);box-shadow:0 0 0 2px var(--b) inset}.lotcard.clos{opacity:.6}.progres{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.progres div{height:100%;background:var(--b)}.albar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.score{--p:0;width:96px;height:96px;margin:10px auto;border-radius:50%;background:conic-gradient(var(--b) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}.score span{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:22px}
@media print{aside,.noprint,.burger{display:none!important}.md{position:static;background:none;padding:0}.md>div{max-height:none}body{background:#fff;color:#000}}

<body>
<div id="app"></div>
<script>
"use strict";
const KEY="angels_agro_v1";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fcfa=n=>Math.round(n||0).toLocaleString("fr-FR").replace(/[  ]/g," ")+" F";
const nf=(n,d=0)=>(Math.round((n||0)*10**d)/10**d).toLocaleString("fr-FR",{maximumFractionDigits:d});
const now=()=>new Date().toISOString(),today=()=>now().slice(0,10);
const fd=d=>d?new Date(d.length>10?d:d+"T00:00:00Z").toLocaleDateString("fr-FR",{timeZone:"UTC"}):"—";
const fdt=t=>t?new Date(t).toLocaleString("fr-FR",{timeZone:"UTC"}):"—";
const hashPin=(id,p)=>{let x=5381;for(const c of id+":"+p)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const by=(arr,id,k="id")=>arr.find(x=>x[k]===id);
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
let S=null,ME=null,view="dash";
const UI={tab:{},f:{}};

/* ---------- Référentiels ---------- */
const ROLES={admin:"Administrateur",direction:"Direction générale",chef:"Chef d'exploitation",soigneur:"Soigneur",magasinier:"Magasinier",commercial:"Commercial",caissier:"Caissier",comptable:"Comptable"};
const ALL=Object.keys(ROLES);
const ACL={ // qui peut faire quoi (appliqué aussi dans les fonctions, pas seulement dans les menus)
 lot:["admin","chef"],suivi:["admin","chef","soigneur"],sante:["admin","chef","soigneur"],couvoir:["admin","chef"],batiment:["admin","chef"],
 stock:["admin","chef","magasinier"],cond:["admin","chef","magasinier"],relance:["admin","commercial","caissier","comptable"],nutri:["admin","chef"],ajust:["admin","magasinier","direction"],fab:["admin","chef","magasinier"],achat:["admin","magasinier"],
 vente:["admin","commercial","caissier"],annulvente:["admin","direction"],paiement:["admin","caissier","commercial"],
 charge:["admin","chef","comptable","caissier"],treso:["admin","caissier","comptable"],compta:["admin","comptable"],extourne:["admin","comptable","direction"],
 periode:["admin","comptable","direction"],perso:["admin","direction","chef"],param:["admin","direction"],users:["admin"],tiers:["admin","commercial","magasinier","comptable"]};
const can=a=>!!ME&&(ME.role==="seed"||(ACL[a]||[]).includes(ME.role));
const need=(a,msg)=>{if(!can(a))throw new Error(msg||"Droits insuffisants pour cette action.")};
const NAV=[
 {v:"dash",l:"Tableau de bord",i:"📊",g:"Pilotage",r:ALL},{v:"rapports",l:"Rapports",i:"📨",g:"Pilotage",r:["admin","direction","chef","comptable"]},
 {v:"lots",l:"Lots & élevage",i:"🐔",g:"Élevage",r:["admin","direction","chef","soigneur"]},{v:"suivi",l:"Suivi quotidien",i:"📝",g:"Élevage",r:["admin","chef","soigneur"]},
 {v:"sante",l:"Santé & prophylaxie",i:"💉",g:"Élevage",r:["admin","chef","soigneur"]},{v:"couvoir",l:"Couvoir",i:"🥚",g:"Élevage",r:["admin","chef"]},
 {v:"batiments",l:"Bâtiments",i:"🏠",g:"Élevage",r:["admin","chef","direction"]},
 {v:"stock",l:"Stock",i:"📦",g:"Stock & achats",r:["admin","direction","chef","magasinier","comptable"]},{v:"fab",l:"Fabrication aliments",i:"🌽",g:"Stock & achats",r:["admin","chef","magasinier"]},
 {v:"cond",l:"Conditionnement",i:"📦",g:"Stock & achats",r:["admin","direction","chef","magasinier"]},
 {v:"achats",l:"Achats & fournisseurs",i:"🛒",g:"Stock & achats",r:["admin","direction","magasinier","comptable"]},
 {v:"ventes",l:"Ventes & clients",i:"🧾",g:"Ventes",r:["admin","direction","commercial","caissier","comptable"]},
 {v:"tresor",l:"Trésorerie",i:"🏦",g:"Argent",r:["admin","direction","caissier","comptable"]},{v:"charges",l:"Charges",i:"💸",g:"Argent",r:["admin","direction","chef","caissier","comptable"]},
 {v:"finance",l:"Rentabilité",i:"📈",g:"Argent",r:["admin","direction","chef","comptable"]},{v:"compta",l:"Comptabilité SYSCOHADA",i:"📒",g:"Argent",r:["admin","direction","comptable"]},
 {v:"perso",l:"Personnel",i:"👥",g:"Administration",r:["admin","direction","chef"]},{v:"users",l:"Utilisateurs & audit",i:"🛡️",g:"Administration",r:["admin"]},
 {v:"params",l:"Paramétrage",i:"⚙️",g:"Administration",r:["admin","direction"]}
];
const LOTTYPE={chair:"Chair",ponte:"Ponte"};
const CATP={aliment:"Aliment",medicament:"Médicament / vaccin",poussin:"Poussin",emballage:"Emballage",fini:"Produit fini",autre:"Autre"};
const CPT_ACHAT={poussin:"6011",aliment:"6013",medicament:"6015",emballage:"6022",autre:"628",fini:"628"};
const CHARGES={main_oeuvre:["Main-d'œuvre","6410"],energie:["Énergie","6052"],eau:["Eau","6051"],entretien:["Entretien, réparations","6224"],transport:["Transport","6222"],assurance:["Assurance","6161"],loyer:["Loyer","622"],impot:["Impôts et taxes","646"],autre:["Charges diverses","628"]};
const PLAN=[["101","Capital — apport","Capitaux"],["162","Emprunts","Capitaux"],["401","Fournisseurs","Tiers"],["411","Clients","Tiers"],["422","Personnel — rémunérations dues","Tiers"],["521","Banque et mobile money","Trésorerie"],["571","Caisse","Trésorerie"],["6011","Achats poussins","Charge"],["6013","Achats aliment","Charge"],["6015","Achats médicaments / vaccins","Charge"],["6022","Achats emballages","Charge"],["6051","Achats eau","Charge"],["6052","Achats énergie","Charge"],["6161","Primes d'assurance","Charge"],["622","Locations","Charge"],["6222","Transport","Charge"],["6224","Entretien, réparations","Charge"],["628","Charges diverses","Charge"],["646","Impôts et taxes","Charge"],["6410","Charges de personnel — salaires","Charge"],["701","Ventes — produits avicoles","Produit"],["758","Autres produits divers","Produit"]];
const JOURNAUX=[["VE","Ventes"],["AC","Achats et charges"],["TR","Trésorerie"],["PAIE","Paie"],["OD","Opérations diverses"]];
const PROTOCOLES=[["chair",1,"Vaccin Marek"],["chair",7,"Vaccin Gumboro"],["chair",14,"Vaccin Newcastle + IB"],["chair",21,"Rappel Gumboro"],["chair",28,"Anticoccidien"],["chair",35,"Rappel Newcastle"],["ponte",1,"Vaccin Marek"],["ponte",7,"Vaccin Gumboro"],["ponte",14,"Vaccin Newcastle + IB"],["ponte",28,"Rappel Gumboro"],["ponte",42,"Rappel Newcastle"],["ponte",56,"Vaccin EDS"],["ponte",112,"Rappel EDS avant ponte"]];
const PROD_REQ={"Vaccin Marek":["Vaccin Marek","dose"],"Vaccin Gumboro":["Vaccin Gumboro","dose"],"Rappel Gumboro":["Vaccin Gumboro","dose"],"Vaccin Newcastle + IB":["Vaccin Newcastle + IB","dose"],"Rappel Newcastle":["Vaccin Newcastle + IB","dose"],"Anticoccidien":["Anticoccidien","dose"],"Vaccin EDS":["Vaccin EDS","dose"],"Rappel EDS avant ponte":["Vaccin EDS","dose"]};
const UNITES=["dose","mL","kg","L","g","tête"];
function migrerSante(){
 if(!S.protocoles)return;S.protocoles.forEach(p=>{if(p.produit==null){const r=PROD_REQ[p.action];p.produit=r?r[0]:"";p.unite=r?r[1]:"dose"}});
 (S.soins||[]).forEach(x=>{if(x.produit_requis==null){const r=PROD_REQ[x.action];x.produit_requis=r?r[0]:"";x.unite=r?r[1]:"dose"}});
}
const phase=(t,a)=>t==="ponte"?(a<84?"Démarrage":a<126?"Pré-ponte":a<350?"Pic de ponte":a<500?"Déclin":"Réforme"):(a<10?"Démarrage":a<28?"Croissance":a<42?"Finition":"Prêt à vendre");

/* ---------- Persistance, audit, transactions ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){throw new Error("Stockage plein : données non enregistrées. Un backend (Supabase) est requis.")}};
const audit=(a,d)=>{S.audit.unshift({t:now(),u:ME?ME.nom:"système",r:ME?ME.role:"",a,d:d||""});if(S.audit.length>2000)S.audit.length=2000};
function atomic(fn,quiet){
 const snap=JSON.stringify(S),me=ME&&ME.id;
 try{const r=fn();save();return r===undefined?true:r}
 catch(e){S=JSON.parse(snap);if(me)ME=by(S.users,me)||null;if(!quiet)alert(e.message);return false}
}
const seq=(k,p)=>{S.seq[k]=(S.seq[k]||0)+1;return p+"-"+new Date().getFullYear()+"-"+String(S.seq[k]).padStart(4,"0")};

/* ---------- Comptabilité (partie double) ---------- */
const per=d=>d.slice(0,7);
function periodOpen(d){const p=by(S.periods,per(d));if(p&&p.statut==="cloturee")throw new Error("Période comptable clôturée : "+per(d)+".");if(!p)S.periods.push({id:per(d),statut:"ouverte"})}
function postEntry({journal,date,libelle,piece,source,lignes}){
 lignes=lignes.filter(l=>l.debit||l.credit);
 const d=sum(lignes,l=>l.debit),c=sum(lignes,l=>l.credit);
 if(lignes.length<2||d!==c||d<=0)throw new Error("Écriture déséquilibrée ou incomplète (débit "+fcfa(d)+" / crédit "+fcfa(c)+").");
 lignes.forEach(l=>{if(!by(S.accounts,l.compte,"num"))throw new Error("Compte inconnu : "+l.compte);if(l.debit&&l.credit)throw new Error("Ligne à la fois au débit et au crédit.")});
 periodOpen(date);
 const e={id:uid("je"),numero:seq("je","EC"),journal,date,libelle,piece:piece||"",source:source||null,lignes,par:ME?ME.nom:"système",t:now()};
 S.entries.push(e);return e;
}
function extournerSource(type,id,motif){
 S.entries.filter(e=>e.source&&e.source.type===type&&e.source.id===id&&!e.extournee).forEach(e=>{
  postEntry({journal:e.journal,date:today(),libelle:"Extourne "+e.numero+" — "+motif,piece:e.piece,source:{type:"extourne",id:e.id},lignes:e.lignes.map(l=>({compte:l.compte,tiers:l.tiers,debit:l.credit||0,credit:l.debit||0,lot:l.lot}))});
  e.extournee=true;
 });
}
const cptTreso=m=>m==="especes"?"571":"521";
const soldeCompte=(c,tiers)=>sum(S.entries.flatMap(e=>e.lignes.filter(l=>l.compte===c&&(!tiers||l.tiers===tiers))),l=>(l.debit||0)-(l.credit||0));

/* ---------- Stock ---------- */
const prod=id=>by(S.produits,id)||{nom:"?",unite:""};
const qteStock=pid=>sum(S.mvts.filter(m=>m.produit_id===pid),m=>m.sens==="entree"?m.qte:-m.qte);
function pmp(pid){ // coût moyen pondéré des entrées valorisées
 const en=S.mvts.filter(m=>m.produit_id===pid&&m.sens==="entree"&&m.pu>0),q=sum(en,m=>m.qte);return q>0?sum(en,m=>m.qte*m.pu)/q:((by(S.produits,pid)||{}).prix_ref||0);
}
function mouvement({produit_id,sens,qte,pu,motif,source,date,lot_id}){
 const p=by(S.produits,produit_id);if(!p)throw new Error("Produit introuvable.");
 qte=+qte;if(!(qte>0))throw new Error("Quantité invalide.");
 if(sens==="sortie"&&qte>qteStock(produit_id)+1e-9)throw new Error("Stock insuffisant : "+p.nom+" ("+nf(qteStock(produit_id),2)+" "+p.unite+" disponibles).");
 const m={id:uid("mv"),date:date||today(),produit_id,sens,qte,pu:sens==="sortie"?pmp(produit_id):(+pu||0),motif:motif||"",source:source||null,lot_id:lot_id||null,par:ME?ME.nom:"système"};
 S.mvts.push(m);return m;
}
function ajusterSource(type,id,cible,cfg){ // aligne le stock sur la quantité cible d'une saisie (modification d'un suivi)
 const cur=sum(S.mvts.filter(m=>m.source&&m.source.type===type&&m.source.id===id&&m.produit_id===cfg.produit_id),m=>m.sens===cfg.sens?m.qte:-m.qte);
 const d=cible-cur;if(Math.abs(d)<1e-9)return;
 mouvement({produit_id:cfg.produit_id,sens:d>0?cfg.sens:(cfg.sens==="sortie"?"entree":"sortie"),qte:Math.abs(d),pu:cfg.pu,motif:cfg.motif,source:{type,id},date:cfg.date,lot_id:cfg.lot_id});
}
function ajusterStock(pid,reel,motif){
 need("ajust");if(!String(motif||"").trim())throw new Error("Motif obligatoire pour un ajustement.");
 const d=reel-qteStock(pid);if(Math.abs(d)<1e-9)throw new Error("Aucun écart.");
 mouvement({produit_id:pid,sens:d>0?"entree":"sortie",qte:Math.abs(d),pu:d>0?pmp(pid):0,motif:"Inventaire : "+motif,source:{type:"ajust",id:uid("aj")}});audit("Ajustement de stock",prod(pid).nom+" "+nf(d,2));
}

/* ---------- Conditionnement des œufs (même règles qu'AvicoSuite) ---------- */
const CAL=[["petit","Petit","🟡","< 53 g","P"],["moyen","Moyen","🟢","53-63 g","M"],["gros","Gros","🟠","63-73 g","G"],["tresGros","Très gros","🔴","73 g et +","TG"]];
const TARIFS0={petit:{plt:1800,car:21600},moyen:{plt:2250,car:27000},gros:{plt:2700,car:32400},tresGros:{plt:3200,car:38400}};
const PLT_CAR=12,ALV_CAR=4;
const pCal=(k,t)=>S.produits.find(p=>p.code==="CAL-"+t+"-"+CAL.find(c=>c[0]===k)[4]);
const pBruts=()=>S.produits.find(p=>p.code==="OEUFS-B"),pAlv=()=>S.produits.find(p=>p.code==="ALVEOLE");
const tarif=k=>(S.settings.tarifs_cal&&S.settings.tarifs_cal[k])||TARIFS0[k];
const restesC=()=>S.restes_cond||(S.restes_cond={petit:0,moyen:0,gros:0,tresGros:0});
function migrerCond(){
 if(!S.cond)S.cond=[];if(!S.inventaires)S.inventaires=[];restesC();
 const add=(code,nom,unite,prix)=>{if(!S.produits.some(p=>p.code===code))S.produits.push({id:uid("p"),code,nom,categorie:"fini",unite,seuil:0,prix_ref:prix||0})};
 add("OEUFS-B","Œufs bruts (non conditionnés)","œuf",0);
 CAL.forEach(([k,n,,,r])=>{add("CAL-PLT-"+r,"Plateau de 30 œufs — "+n,"plateau",tarif(k).plt);add("CAL-CAR-"+r,"Carton de 12 plateaux — "+n,"carton",tarif(k).car)});

function condPlan(f){ // calcul pur : plateaux, cartons, alvéoles, restes reportés

/* ---- Stock, fabrication, achats ---- */
/* ---- Stock : état des stocks, journal des mouvements, inventaires (même organisation qu'AvicoSuite) ---- */
const valP=p=>{const q=qteStock(p.id);return q*(p.categorie==="fini"?(p.prix_ref||0):pmp(p.id))};
const stEtat=(p,q)=>p.seuil>0&&q<=p.seuil?"crit":p.seuil>0&&q<p.seuil*1.5?"faible":"ok";
const mvType=m=>m.source&&m.source.type==="ajust"?"inventaire":m.sens;
const MVT_LBL={entree:["Entrée","ok"],sortie:["Sortie","er"],inventaire:["Inventaire","mu"]};
function mvSoldes(){const run={},o={};S.mvts.forEach(m=>{const av=run[m.produit_id]||0,ap=av+(m.sens==="entree"?m.qte:-m.qte);run[m.produit_id]=ap;o[m.id]={av,ap}});return o}
const mvF=()=>{const f=UI.f.mv||(UI.f.mv={});if(f.min===undefined){f.min="";f.max="";f.prod="";f.cat="";f.type="";f.page=1}return f};
function mvFiltres(){const f=mvF();return S.mvts.filter(m=>(!f.min||m.date>=f.min)&&(!f.max||m.date<=f.max)&&(!f.prod||m.produit_id===f.prod)&&(!f.cat||prod(m.produit_id).categorie===f.cat)&&(!f.type||mvType(m)===f.type)).sort((a,b)=>b.date.localeCompare(a.date)||S.mvts.indexOf(b)-S.mvts.indexOf(a))}
function mvCorps(){
 const L=mvFiltres(),sd=mvSoldes();
 return etK([[nf(L.length),"Mouvements"],[fcfa(sum(L.filter(m=>m.sens==="entree"),m=>m.qte*m.pu)),"Valeur des entrées"],[fcfa(sum(L.filter(m=>m.sens==="sortie"),m=>m.qte*m.pu)),"Valeur des sorties"],[nf(L.filter(m=>mvType(m)==="inventaire").length),"Ajustements d'inventaire"]])+
  etT("Journal des mouvements",["Date","Type","Produit","Quantité","P.U.","Valeur","Avant","Après","Motif","Par"],L.map(m=>{const p=prod(m.produit_id);return[fd(m.date),MVT_LBL[mvType(m)][0],esc(p.nom),nf(m.qte,2)+" "+esc(p.unite),m.pu?fcfa(m.pu):"—",fcfa(m.qte*m.pu),nf(sd[m.id].av,2),nf(sd[m.id].ap,2),esc(m.motif),esc(m.par)]}));
}
/* inventaires */
function invLignes(){return S.produits.filter(p=>Math.abs(qteStock(p.id))>1e-9||p.seuil>0).map(p=>({produit_id:p.id,theorique:Math.round(qteStock(p.id)*100)/100,compte:Math.round(qteStock(p.id)*100)/100,justification:""}))}
function invCreer(date){
 need("ajust");if(!date||date>today())throw new Error("Date invalide (ou dans le futur).");if((S.inventaires||[]).some(i=>i.statut==="brouillon"))throw new Error("Un inventaire est déjà en cours : le valider ou le supprimer d'abord.");
 const i={id:uid("iv"),numero:seq("iv","INV"),date,statut:"brouillon",lignes:invLignes(),auteur:ME?ME.nom:"système",t:now()};(S.inventaires||(S.inventaires=[])).push(i);audit("Inventaire ouvert",i.numero);return i;
}
function invEnregistrer(id,saisies){
 need("ajust");const i=by(S.inventaires||[],id);if(!i||i.statut!=="brouillon")throw new Error("Inventaire introuvable ou déjà validé.");
 saisies.forEach(s=>{const l=i.lignes.find(x=>x.produit_id===s.produit_id);if(!l)return;const c=+s.compte;if(!(c>=0))throw new Error("Quantité comptée invalide ("+prod(l.produit_id).nom+").");l.compte=Math.round(c*100)/100;l.justification=String(s.justification||"").trim()});
}
function invValider(id,saisies){
 need("ajust");if(saisies)invEnregistrer(id,saisies);const i=by(S.inventaires||[],id);if(!i||i.statut!=="brouillon")throw new Error("Inventaire introuvable ou déjà validé.");
 const ec=i.lignes.map(l=>({l,th:Math.round(qteStock(l.produit_id)*100)/100})).filter(x=>Math.abs(x.l.compte-x.th)>=0.01),nj=ec.filter(x=>!x.l.justification);
 if(nj.length)throw new Error("Motif obligatoire pour chaque écart ("+nj.length+" ligne(s) sans motif : "+nj.slice(0,3).map(x=>prod(x.l.produit_id).nom).join(", ")+(nj.length>3?"…":"")+").");
 i.lignes.forEach(l=>{const th=Math.round(qteStock(l.produit_id)*100)/100;l.theorique=th;l.pu=pmp(l.produit_id)||prod(l.produit_id).prix_ref||0;if(Math.abs(l.compte-th)>=0.01)ajusterStock(l.produit_id,l.compte,l.justification+" ("+i.numero+")")});
 i.statut="valide";i.valide_le=today();i.valide_par=ME?ME.nom:"système";audit("Inventaire validé",i.numero+" : "+ec.length+" écart(s)");return i;
}
function invSupprimer(id){need("ajust");const i=by(S.inventaires||[],id);if(!i||i.statut!=="brouillon")throw new Error("Seul un brouillon peut être supprimé.");S.inventaires=S.inventaires.filter(x=>x.id!==id);audit("Inventaire supprimé",i.numero)}
const invEcartVal=i=>sum(i.lignes,l=>(l.compte-l.theorique)*(l.pu!=null?l.pu:(pmp(l.produit_id)||prod(l.produit_id).prix_ref||0)));
function invCorps(i){
 const ec=i.lignes.filter(l=>Math.abs(l.compte-l.theorique)>=0.01);
 return etK([[nf(i.lignes.length),"Références"],[nf(ec.length),"Écarts"],[fcfa(invEcartVal(i)),"Valeur des écarts"],[i.statut==="valide"?"Validé":"Brouillon","Statut"]])+etT("Inventaire "+i.numero+" du "+fd(i.date),["Produit","Théorique","Compté","Écart","Valeur","Motif"],i.lignes.map(l=>{const p=prod(l.produit_id),e=Math.round((l.compte-l.theorique)*100)/100;return[esc(p.nom),nf(l.theorique,2)+" "+esc(p.unite),nf(l.compte,2),(e>0?"+":"")+nf(e,2),fcfa(e*(l.pu!=null?l.pu:(pmp(l.produit_id)||p.prix_ref||0))),esc(l.justification||"—")]}));
}

  Object.entries(CATP).forEach(([k,lb])=>{const L=V.filter(x=>x.p.categorie===k);if(!L.length)return;h+=`<h2>${esc(lb)} <span class="mu sm">${L.length} réf.</span></h2>`+tbl(["Produit","Stock","Unité","Coût moyen / tarif","Valeur","Seuil","État",""],L.map(x=>tr([`<b>${esc(x.p.nom)}</b><div class="mu sm">${esc(x.p.code)}</div>`,`<b>${nf(x.q,1)}</b>${x.p.seuil>0?`<div class="progres" style="width:90px"><div style="width:${Math.min(100,x.q/x.p.seuil*100)}%;background:var(--${x.e==="crit"?"er":x.e==="faible"?"wa":"ok"})"></div></div>`:""}`,esc(x.p.unite),x.p.categorie==="fini"?(x.p.prix_ref?fcfa(x.p.prix_ref):"—"):fcfa(pmp(x.p.id)),fcfa(x.v),x.p.seuil||"—",x.e==="crit"?badge("Critique","er"):x.e==="faible"?badge("Faible","wa"):badge("OK","ok"),`<div class="flex">${can("stock")?btn("pr.edit",x.p.id,"✏️","ghost"):""}${can("ajust")?btn("pr.aj",x.p.id,"Inventaire","ghost"):""}</div>`])))});
 }else if(t==="mv"){

  <p><button class="btn ghost sm" id="al">+ Ligne</button> <b>Total : ${fcfa(tot)}</b></p><button class="btn" id="sv">Enregistrer</button>`;
  const keep=()=>box.querySelectorAll("[data-h]").forEach(e=>box.dataset[e.dataset.h]=e.value);
  $("[data-x]",box).onclick=()=>m.remove();$("#al",box).onclick=()=>{keep();L.push({type:kinds[0]});draw()};
  box.querySelectorAll("[data-h]").forEach(e=>e.onchange=keep);

 };draw();
}

/* ---- Ventes ---- */
/* ---- Ventes & clients : clients enrichis, réservations, créances âgées, relances (même organisation qu'AvicoSuite) ---- */
const CLIENT_TYPES=[["restaurant","Restaurant"],["grossiste","Grossiste"],["particulier","Particulier"],["hotel","Hôtel / traiteur"],["boutique","Boutique / supérette"],["autre","Autre"]];
const PAIE=[["comptant","Comptant",0],["credit15","Crédit 15 jours",15],["credit30","Crédit 30 jours",30]];
const clientType=t=>{const x=CLIENT_TYPES.find(c=>c[0]===t||c[1].toLowerCase()===String(t||"").toLowerCase());return x?x[1]:(t||"—")};
const delaiClient=c=>{const p=PAIE.find(x=>x[0]===(c&&c.paie));return p?p[2]:S.settings.delai_creance};
const echV=v=>v.echeance||addDays(v.date,delaiClient(by(S.clients,v.client_id)));
const retardV=v=>diffDays(today(),echV(v));
function migrerVentes(){if(!S.reservations)S.reservations=[];S.clients.forEach(c=>{if(c.type){const x=CLIENT_TYPES.find(t=>t[1].toLowerCase()===String(c.type).toLowerCase());if(x)c.type=x[0]}})}
const creancesOuvertes=()=>S.ventes.filter(v=>v.statut==="valide"&&soldeVente(v)>0).sort((a,b)=>echV(a).localeCompare(echV(b)));
function aging(L){const b={nonEchu:0,j30:0,j60:0,j90:0};L.forEach(v=>{const j=retardV(v),r=soldeVente(v);if(j<=0)b.nonEchu+=r;else if(j<=30)b.j30+=r;else if(j<=60)b.j60+=r;else b.j90+=r});return b}
function relanceTexte(v){const c=tiers("c",v.client_id),r=retardV(v);return "Bonjour "+c.nom+",\nRappel : la facture "+v.numero+" du "+fd(v.date)+" ("+fcfa(v.total)+") présente un solde de "+fcfa(soldeVente(v))+(r>0?", échu depuis "+r+" jour(s)":" à régler avant le "+fd(echV(v)))+".\nMerci de régulariser. — "+rapCfg().nom}
function relancer(vid,canal){
 need("relance");const v=by(S.ventes,vid);if(!v||v.statut!=="valide"||soldeVente(v)<=0)throw new Error("Facture introuvable ou déjà soldée.");
 if(canal!=="whatsapp"&&canal!=="email")throw new Error("Canal invalide.");const c=tiers("c",v.client_id);
 if(canal==="whatsapp"&&!String(c.tel||"").replace(/\D/g,""))throw new Error("Numéro de téléphone du client manquant.");if(canal==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email||""))throw new Error("Email du client manquant ou invalide.");
 (v.relances||(v.relances=[])).push({date:today(),canal,par:ME.nom,montant:soldeVente(v)});audit("Relance client",v.numero+" "+canal);return{texte:relanceTexte(v),tel:c.tel,email:c.email};
}
const resaStatut=r=>r.statut==="active"&&r.expire&&r.expire<today()?"expiree":r.statut;
const reserveParProduit=excl=>{const o={};(S.reservations||[]).filter(r=>r.id!==excl&&resaStatut(r)==="active").forEach(r=>r.lignes.forEach(l=>{o[l.produit_id]=(o[l.produit_id]||0)+l.qte}));return o};
function resaCreer(f){
 need("vente");migrerVentes();const c=by(S.clients,f.client_id);if(!c)throw new Error("Client requis.");if(!f.date||f.date>today())throw new Error("Date invalide (ou dans le futur).");if(!f.expire||f.expire<f.date)throw new Error("Date de validité antérieure à la réservation.");
 const L=(f.lignes||[]).filter(l=>+l.qte>0&&l.produit_id).map(l=>{const p=by(S.produits,l.produit_id);if(!p||p.categorie!=="fini")throw new Error("Produit fini requis.");if(!(+l.pu>=0))throw new Error("Prix invalide.");return{produit_id:p.id,qte:+l.qte,pu:+l.pu}});if(!L.length)throw new Error("Ajouter au moins une ligne.");
 const r={id:uid("rs"),numero:seq("rs","RES"),date:f.date,expire:f.expire,client_id:c.id,lignes:L,note:f.note||"",statut:"active",par:ME.nom};S.reservations.push(r);audit("Réservation",r.numero+" "+c.nom);return r;
}
function resaAnnuler(id,motif){need("vente");const r=by(S.reservations||[],id);if(!r||resaStatut(r)!=="active")throw new Error("Réservation introuvable ou non active.");if(!String(motif||"").trim())throw new Error("Motif obligatoire.");r.statut="annulee";r.motif=motif;audit("Réservation annulée",r.numero+" : "+motif)}
function resaConvertir(id){
 need("vente");const r=by(S.reservations||[],id);if(!r)throw new Error("Réservation introuvable.");if(resaStatut(r)==="expiree")throw new Error("Réservation expirée.");if(r.statut!=="active")throw new Error("Réservation non active.");
 const v=creerVente({date:today(),client_id:r.client_id,lignes:r.lignes.map(l=>({type:"stock",produit_id:l.produit_id,qte:l.qte,pu:l.pu})),paye:0,mode:"especes"});r.statut="convertie";r.vente_id=v.id;audit("Réservation convertie",r.numero+" → "+v.numero);return v;
}

 }
 const L=creancesOuvertes(),b=aging(L),tot=sum(L,soldeVente),ret=L.filter(v=>retardV(v)>0),ven=L.filter(v=>{const j=retardV(v);return j<=0&&j>=-3}),ed=can("relance");
 const bk=[["Non échu",b.nonEchu,"ok"],["1 – 30 j",b.j30,"wa"],["31 – 60 j",b.j60,"wa"],["+ 60 j",b.j90,"er"]];

  `<div class="grid">${kpi(fcfa(tot),"Total à encaisser","e")}${kpi(fcfa(sum(ret,soldeVente)),"En retard","w")}${kpi(nf(L.length),"Factures ouvertes · "+ret.length+" en retard")}</div><div class="card"><b>Analyse d'ancienneté (aging)</b><div class="grid" style="margin:8px 0 0">${bk.map(([l,v,c])=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="font-size:17px;color:var(--${c==="ok"?"ok":c==="wa"?"wa":"er"})">${fcfa(v)}</div></div>`).join("")}</div></div><h2>Détail des créances</h2>`+
  tbl(["Facture","Client","Total","Payé","Reste dû","Avancement","Échéance","Relance",""],L.map(v=>{const c=tiers("c",v.client_id),r=retardV(v),reste=soldeVente(v),pct=Math.round((v.total-reste)/v.total*100),lr=(v.relances||[]).slice(-1)[0];return tr([`<b>${esc(v.numero)}</b><div class="mu sm">émise ${fd(v.date)}</div>`,`<b>${esc(c.nom)}</b><div class="mu sm">${esc(c.ville||"")}</div>`,fcfa(v.total),fcfa(v.total-reste),`<b style="color:var(--er)">${fcfa(reste)}</b>`,`<div class="progres" style="width:80px"><div style="width:${pct}%"></div></div><span class="mu sm">${pct} %</span>`,r>0?badge("⚠ +"+r+" j",r>60?"er":"wa"):badge("Éch. "+fd(echV(v)),"ok"),lr?`<span class="sm">${lr.canal==="whatsapp"?"WhatsApp":"Email"} le ${fd(lr.date)}</span>`:"—",`<div class="flex">${can("paiement")?btn("vt.pay",v.id,"Encaisser","ok"):""}${ed&&c.tel?btn("cn.rel",v.id+":whatsapp","WhatsApp","ghost"):""}${ed&&c.email?btn("cn.rel",v.id+":email","Email","ghost"):""}${btn("vt.print",v.id,"🖨","ghost")}${btn("vt.bl",v.id,"BL","ghost")}</div>`])}),{empty:"Aucune créance ouverte."});

 const app=$("#app");
 if(!ME){
  app.innerHTML=`<div class="login card"><h1>🐔 ANGEL'S AGRO</h1><p class="mu sm" style="margin-top:-8px">Élevage avicole</p><form id="lf"><label>Compte</label><select name="u">${S.users.filter(u=>u.actif).map(u=>`<option value="${u.id}">${esc(u.nom)} (${esc(ROLES[u.role])})</option>`).join("")}</select><label>PIN</label><input name="p" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required><p id="le" class="mu sm"></p><button class="btn" style="width:100%">Connexion</button></form><p class="mu sm">PIN oublié ? Demander la réinitialisation à l'administrateur.</p><p class="mu sm">Démo — admin 1234 · direction 0000 · chef 1111 · soigneur 2222 · magasinier 3333 · commercial 4444 · caissier 5555 · comptable 6666</p>${pwaBtn()?`<p>${pwaBtn()}</p>`:""}<p><a href="index.html">← Hub</a></p></div>`;
  $("#lf").onsubmit=e=>{e.preventDefault();const r=login(e.target.u.value,e.target.p.value);if(r)$("#le").textContent=r;else render()};return;
 }
 const items=NAV.filter(showNav);if(!items.some(n=>n.v===view))view=items[0].v;
 let g="",nav="";items.forEach(n=>{if(n.g!==g){g=n.g;nav+=`<div class="gt">${esc(g)}</div>`}nav+=`<a data-a="nav" data-id="${n.v}" class="${n.v===view?"on":""}">${n.i} ${esc(n.l)}</a>`});
 let body;try{body=V[view]()}catch(e){body=`<div class="card"><b>Erreur d'affichage</b><p>${esc(e.message)}</p></div>`}
 app.innerHTML=`<div class="shell"><aside id="sb"><div class="brand">🐔 ANGEL'S AGRO<small>Élevage avicole</small></div>${nav}<a href="index.html">🏠 Hub groupe</a><div class="who">${esc(ME.nom)}<br><span class="mu">${esc(ROLES[ME.role])}</span><br>${pwaBtn()?pwaBtn()+"<br>":""}<a data-a="out">Déconnexion</a></div></aside><main><button class="btn ghost burger" data-a="bg">☰ Menu</button>${body}</main></div>`;
}
A.out=()=>{atomic(()=>audit("Déconnexion"),true);ME=null;try{sessionStorage.removeItem("ag_me")}catch(x){}render()};A.bg=()=>$("#sb").classList.toggle("open");
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||!S||t.tagName==="INPUT")return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.id,t,e)}});
document.addEventListener("change",e=>{const t=e.target;if(!S||!t.dataset.f)return;const[k,p]=t.dataset.f.split(":");(UI.f[k]=UI.f[k]||{})[p]=t.value;render()});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue&&!document.querySelector(".md")){try{S=JSON.parse(e.newValue);if(ME)ME=by(S.users,ME.id);if(ME&&!ME.actif)ME=null;render()}catch(x){}}});
/* ---------- PWA : installation, mise à jour, hors ligne ---------- */
let DEF=null,MAJ=false;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const installe=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaBtn=()=>installe()?"":(DEF||estIOS())?`<a data-a="pwa.inst">📲 Installer l'application</a>`:"";
A["pwa.inst"]=async()=>{if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()}else alert("Sur iPhone / iPad : ouvrir cette page dans Safari, toucher « Partager », puis « Sur l'écran d'accueil ».")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEF=e;if(!document.querySelector(".md"))render()});
window.addEventListener("appinstalled",()=>{DEF=null;render()});
function barre(){
 let b=$("#pwaBar");
 if(!MAJ&&navigator.onLine){if(b)b.remove();return}
 if(!b){b=document.createElement("div");b.id="pwaBar";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px;text-align:center;font-weight:600";document.body.appendChild(b)}
 if(MAJ){b.style.background="var(--b)";b.style.color="#fff";b.innerHTML="Nouvelle version disponible — <a href='#' id='pwaUp' style='color:#fff;text-decoration:underline'>recharger</a>";$("#pwaUp").onclick=ev=>{ev.preventDefault();location.reload()}}
 else{b.style.background="var(--wabg)";b.style.color="var(--wa)";b.textContent="Mode hors ligne — vos données restent enregistrées sur cet appareil"}
}
window.addEventListener("online",barre);window.addEventListener("offline",barre);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let avait=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(avait){MAJ=true;barre()}avait=true});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
barre();
load();
try{const id=sessionStorage.getItem("ag_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
</script>
</body>
</html>
