/* ---------- Conditionnement des œufs (même règles qu'AvicoSuite) ---------- */
const CAL=[["petit","Petit","🟡","< 53 g","P"],["moyen","Moyen","🟢","53-63 g","M"],["gros","Gros","🟠","63-73 g","G"],["tresGros","Très gros","🔴","73 g et +","TG"]];
const TARIFS0={petit:{plt:1800,car:21600},moyen:{plt:2250,car:27000},gros:{plt:2700,car:32400},tresGros:{plt:3200,car:38400}};
const PLT_CAR=12,ALV_CAR=4;
const pCal=(k,t)=>S.produits.find(p=>p.code==="CAL-"+t+"-"+CAL.find(c=>c[0]===k)[4]);
const pBruts=()=>S.produits.find(p=>p.code==="OEUFS-B"),pAlv=()=>S.produits.find(p=>p.code==="ALVEOLE");
const tarif=k=>(S.settings.tarifs_cal&&S.settings.tarifs_cal[k])||TARIFS0[k];
const restesC=()=>S.restes_cond||(S.restes_cond={petit:0,moyen:0,gros:0,tresGros:0});
function migrerCond(){
 if(!S.cond)S.cond=[];if(!S.inventaires)S.inventaires=[];restesC();
 const add=(code,nom,unite,prix)=>{if(!S.produits.some(p=>p.code===code))S.produits.push({id:uid("p"),code,nom,categorie:"fini",unite,seuil:0,prix_ref:prix||0})};

 CAL.forEach(([k,n,,,r])=>{add("CAL-PLT-"+r,"Plateau de 30 œufs — "+n,"plateau",tarif(k).plt);add("CAL-CAR-"+r,"Carton de 12 plateaux — "+n,"carton",tarif(k).car)});
}
function condPlan(f){ // calcul pur : plateaux, cartons, alvéoles, restes reportés
 const pl=S.settings.plateau,R=restesC(),bruts=Math.floor(+f.bruts||0),casses=Math.floor(+f.casses||0),nets=bruts-casses,cal={};
 let given=0;CAL.forEach(([k])=>{cal[k]=Math.floor(+f["c_"+k]||0);given+=cal[k]});
 const reste_in={...R},plt={},car={},reste_out={},plt_net={};
 if(given<nets)cal.moyen+=nets-given;
 let alv=0;
 CAL.forEach(([k])=>{const pool=cal[k]+R[k];plt[k]=Math.floor(pool/pl);reste_out[k]=pool%pl;const pp=pCal(k,"PLT"),st=pp?qteStock(pp.id):0;car[k]=Math.floor((st+plt[k])/PLT_CAR);plt_net[k]=plt[k]-car[k]*PLT_CAR;alv+=plt[k]+ALV_CAR*car[k]});
 return{bruts,casses,nets,given,cal,plt,car,plt_net,alv,reste_in,reste_out,valeur:sum(CAL,c=>plt[c[0]]*tarif(c[0]).plt)};
}
function creerCond(f){
 need("cond");migrerCond();
 if(!f.date||f.date>today())throw new Error("Date invalide (ou dans le futur).");

 const p=condPlan(f);
 if(!(p.bruts>0))throw new Error("Nombre d'œufs à conditionner requis.");
 if(p.casses<0||p.casses>p.bruts)throw new Error("Casses incohérentes.");
 CAL.forEach(([k])=>{if(!(p.cal[k]>=0)||!Number.isInteger(p.cal[k]))throw new Error("Calibres : nombres entiers positifs.")});
 if(p.given>p.nets)throw new Error("Total des calibres ("+p.given+") supérieur aux œufs nets ("+p.nets+").");
 const pb=pBruts(),pa=pAlv();if(!pb||!pa)throw new Error("Produits « œufs bruts » et « alvéoles » introuvables.");
 if(p.bruts>qteStock(pb.id)+1e-9)throw new Error("Œufs bruts insuffisants : "+nf(qteStock(pb.id))+" en stock.");
 if(p.alv>qteStock(pa.id)+1e-9)throw new Error("Alvéoles insuffisantes : besoin "+p.alv+", stock "+nf(qteStock(pa.id))+".");
 const id=uid("cd"),numero=seq("cd","CND"),src={type:"cond",id},mo="Conditionnement "+numero,o={date:f.date,lot_id:l.id,source:src};
 mouvement({produit_id:pb.id,sens:"sortie",qte:p.bruts,motif:mo,source:src,date:f.date,lot_id:l.id});
 CAL.forEach(([k])=>{const pp=pCal(k,"PLT"),pc=pCal(k,"CAR");
  if(p.plt[k]>0)mouvement({produit_id:pp.id,sens:"entree",qte:p.plt[k],pu:0,motif:mo,source:src,date:f.date,lot_id:l.id});
  if(p.car[k]>0){mouvement({produit_id:pp.id,sens:"sortie",qte:p.car[k]*PLT_CAR,motif:mo+" (mise en cartons)",source:src,date:f.date,lot_id:l.id});mouvement({produit_id:pc.id,sens:"entree",qte:p.car[k],pu:0,motif:mo,source:src,date:f.date,lot_id:l.id})}});
 mouvement({produit_id:pa.id,sens:"sortie",qte:p.alv,motif:mo,source:src,date:f.date,lot_id:l.id});
 const c={id,numero,date:f.date,lot_id:l.id,bruts:p.bruts,casses:p.casses,nets:p.nets,cal:p.cal,plt:p.plt,car:p.car,alv:p.alv,reste_in:p.reste_in,reste_out:p.reste_out,valeur:p.valeur,note:f.note||"",par:ME?ME.nom:"système",t:now(),statut:"valide"};
 S.cond.push(c);S.restes_cond={...p.reste_out};audit("Conditionnement",numero+" "+l.code+" : "+sum(CAL,k=>p.car[k[0]])+" carton(s), "+sum(CAL,k=>p.plt[k[0]])+" plateau(x)");return c;
}
function annulerCond(id,motif){

function amortAttente(){ // mois révolus sans dotation (calcul identique à dotationsAuto, sans écrire)
 const o=[];S.batiments.forEach(b=>{if(!b.immo_ecr||!(b.valeur_acq>0))return;const duree=+b.duree_amort||S.settings.amort_duree||20,men=Math.round(b.valeur_acq/(duree*12));let m=b.amort_jusqu?monthNext(b.amort_jusqu):per(b.date_service),cum=b.amort_cumul||0;
  for(;m<per(today());m=monthNext(m)){const dot=Math.min(men,b.valeur_acq-cum);if(dot<=0)break;const p=by(S.periods,m);if(p&&p.statut==="cloturee")break;cum+=dot;o.push({id:b.id+":"+m,lib:"Dotation "+m+" — "+b.nom,date:monthEnd(m),mt:dot})}});
 return o;
}

function rgEtat(){ // état de chaque règle : opérations, comptabilisées, en attente
 const ss=srcSet();
 return REGLES.map(r=>{
  if(r.analytique)return{r,total:r.cnt(),ok:0,pend:[]};
  if(r.direct){const n=S.entries.filter(e=>e.source&&e.source.type===r.direct).length;return{r,total:n,ok:n,pend:[]}}
  const ops=r.ops();if(r.virtuel){const ok=r.k==="amort"?S.entries.filter(e=>e.source&&e.source.type==="amort").length:r.k==="tva"?(S.tva_liq||[]).length:0;return{r,total:ok+ops.length,ok,pend:ops}}

 });

function tryOp(fn){ // exécute une opération isolément : en cas d'échec l'état est restauré, le message est renvoyé

function comptabiliserAttente(){ // idempotent : ne traite que les opérations sans écriture ; un échec n'arrête pas les autres
 need("compta");const res={n:0,ech:[],manuel:0},E=rgEtat();
 E.forEach(x=>{
  if(x.r.analytique||x.r.direct)return;if(x.r.manuel){res.manuel+=x.pend.length;return}
  if(x.r.bulk){if(x.pend.length){const m=tryOp(()=>{res.n+=x.r.bulk()});if(m)res.ech.push(x.r.l+" : "+m)}return}
  x.pend.forEach(o=>{const m=tryOp(()=>x.r.post(o.id));if(m===null)res.n++;else res.ech.push(x.r.l+" "+o.lib+" : "+m)})});

}

/* ---- Stock : état des stocks, journal des mouvements, inventaires (même organisation qu'AvicoSuite) ---- */
const valP=p=>{const q=qteStock(p.id);return q*(p.categorie==="fini"?(p.prix_ref||0):pmp(p.id))};
const stEtat=(p,q)=>p.seuil>0&&q<=p.seuil?"crit":p.seuil>0&&q<p.seuil*1.5?"faible":"ok";
const mvType=m=>m.source&&m.source.type==="ajust"?"inventaire":m.sens;
const MVT_LBL={entree:["Entrée","ok"],sortie:["Sortie","er"],inventaire:["Inventaire","mu"]};
function mvSoldes(){const run={},o={};S.mvts.forEach(m=>{const av=run[m.produit_id]||0,ap=av+(m.sens==="entree"?m.qte:-m.qte);run[m.produit_id]=ap;o[m.id]={av,ap}});return o}
const mvF=()=>{const f=UI.f.mv||(UI.f.mv={});if(f.min===undefined){f.min="";f.max="";f.prod="";f.cat="";f.type="";f.page=1}return f};
function mvFiltres(){const f=mvF();return S.mvts.filter(m=>(!f.min||m.date>=f.min)&&(!f.max||m.date<=f.max)&&(!f.prod||m.produit_id===f.prod)&&(!f.cat||prod(m.produit_id).categorie===f.cat)&&(!f.type||mvType(m)===f.type)).sort((a,b)=>b.date.localeCompare(a.date)||S.mvts.indexOf(b)-S.mvts.indexOf(a))}
function mvCorps(){
 const L=mvFiltres(),sd=mvSoldes();
 return etK([[nf(L.length),"Mouvements"],[fcfa(sum(L.filter(m=>m.sens==="entree"),m=>m.qte*m.pu)),"Valeur des entrées"],[fcfa(sum(L.filter(m=>m.sens==="sortie"),m=>m.qte*m.pu)),"Valeur des sorties"],[nf(L.filter(m=>mvType(m)==="inventaire").length),"Ajustements d'inventaire"]])+
  etT("Journal des mouvements",["Date","Type","Produit","Quantité","P.U.","Valeur","Avant","Après","Motif","Par"],L.map(m=>{const p=prod(m.produit_id);return[fd(m.date),MVT_LBL[mvType(m)][0],esc(p.nom),nf(m.qte,2)+" "+esc(p.unite),m.pu?fcfa(m.pu):"—",fcfa(m.qte*m.pu),nf(sd[m.id].av,2),nf(sd[m.id].ap,2),esc(m.motif),esc(m.par)]}));
}
/* inventaires */
function invLignes(){return S.produits.filter(p=>Math.abs(qteStock(p.id))>1e-9||p.seuil>0).map(p=>({produit_id:p.id,theorique:Math.round(qteStock(p.id)*100)/100,compte:Math.round(qteStock(p.id)*100)/100,justification:""}))}
function invCreer(date){
 need("ajust");if(!date||date>today())throw new Error("Date invalide (ou dans le futur).");if((S.inventaires||[]).some(i=>i.statut==="brouillon"))throw new Error("Un inventaire est déjà en cours : le valider ou le supprimer d'abord.");
 const i={id:uid("iv"),numero:seq("iv","INV"),date,statut:"brouillon",lignes:invLignes(),auteur:ME?ME.nom:"système",t:now()};(S.inventaires||(S.inventaires=[])).push(i);audit("Inventaire ouvert",i.numero);return i;
}
function invEnregistrer(id,saisies){
 need("ajust");const i=by(S.inventaires||[],id);if(!i||i.statut!=="brouillon")throw new Error("Inventaire introuvable ou déjà validé.");
 saisies.forEach(s=>{const l=i.lignes.find(x=>x.produit_id===s.produit_id);if(!l)return;const c=+s.compte;if(!(c>=0))throw new Error("Quantité comptée invalide ("+prod(l.produit_id).nom+").");l.compte=Math.round(c*100)/100;l.justification=String(s.justification||"").trim()});
}
function invValider(id,saisies){
 need("ajust");if(saisies)invEnregistrer(id,saisies);const i=by(S.inventaires||[],id);if(!i||i.statut!=="brouillon")throw new Error("Inventaire introuvable ou déjà validé.");
 const ec=i.lignes.map(l=>({l,th:Math.round(qteStock(l.produit_id)*100)/100})).filter(x=>Math.abs(x.l.compte-x.th)>=0.01),nj=ec.filter(x=>!x.l.justification);
 if(nj.length)throw new Error("Motif obligatoire pour chaque écart ("+nj.length+" ligne(s) sans motif : "+nj.slice(0,3).map(x=>prod(x.l.produit_id).nom).join(", ")+(nj.length>3?"…":"")+").");
 i.lignes.forEach(l=>{const th=Math.round(qteStock(l.produit_id)*100)/100;l.theorique=th;l.pu=pmp(l.produit_id)||prod(l.produit_id).prix_ref||0;if(Math.abs(l.compte-th)>=0.01)ajusterStock(l.produit_id,l.compte,l.justification+" ("+i.numero+")")});
 i.statut="valide";i.valide_le=today();i.valide_par=ME?ME.nom:"système";audit("Inventaire validé",i.numero+" : "+ec.length+" écart(s)");return i;
}
function invSupprimer(id){need("ajust");const i=by(S.inventaires||[],id);if(!i||i.statut!=="brouillon")throw new Error("Seul un brouillon peut être supprimé.");S.inventaires=S.inventaires.filter(x=>x.id!==id);audit("Inventaire supprimé",i.numero)}
const invEcartVal=i=>sum(i.lignes,l=>(l.compte-l.theorique)*(l.pu!=null?l.pu:(pmp(l.produit_id)||prod(l.produit_id).prix_ref||0)));
function invCorps(i){
 const ec=i.lignes.filter(l=>Math.abs(l.compte-l.theorique)>=0.01);
 return etK([[nf(i.lignes.length),"Références"],[nf(ec.length),"Écarts"],[fcfa(invEcartVal(i)),"Valeur des écarts"],[i.statut==="valide"?"Validé":"Brouillon","Statut"]])+etT("Inventaire "+i.numero+" du "+fd(i.date),["Produit","Théorique","Compté","Écart","Valeur","Motif"],i.lignes.map(l=>{const p=prod(l.produit_id),e=Math.round((l.compte-l.theorique)*100)/100;return[esc(p.nom),nf(l.theorique,2)+" "+esc(p.unite),nf(l.compte,2),(e>0?"+":"")+nf(e,2),fcfa(e*(l.pu!=null?l.pu:(pmp(l.produit_id)||p.prix_ref||0))),esc(l.justification||"—")]}));
}

  box.innerHTML=`<div class="between"><h2 style="margin:0">${title}</h2><button class="btn ghost" data-x>Fermer</button></div><div class="fg">${extra.map(f=>`<div><label>${f.l}</label>${f.t==="select"?`<select data-h="${f.k}">${opt(f.o(),box.dataset[f.k]||(init&&init[f.k])||"")}</select>`:`<input data-h="${f.k}" type="${f.t||"text"}" value="${esc(box.dataset[f.k]??(init&&init[f.k])??"")}">`}</label></div>`).join("")}</div>

  <p><button class="btn ghost sm" id="al">+ Ligne</button> <b>Total : ${fcfa(tot)}</b></p><button class="btn" id="sv">Enregistrer</button>`;
  const keep=()=>box.querySelectorAll("[data-h]").forEach(e=>box.dataset[e.dataset.h]=e.value);
  $("[data-x]",box).onclick=()=>m.remove();$("#al",box).onclick=()=>{keep();L.push({type:kinds[0]});draw()};
  box.querySelectorAll("[data-h]").forEach(e=>e.onchange=keep);
  box.querySelectorAll("[data-k]").forEach(e=>e.onchange=()=>{keep();L[+e.dataset.i][e.dataset.k]=e.value;if(e.dataset.k==="type"){const t=e.value;L[+e.dataset.i]={type:t}}draw()});
  $("#sv",box).onclick=()=>{keep();const o={lignes:L};extra.forEach(f=>o[f.k]=box.dataset[f.k]??"");if(atomic(()=>onSave(o))!==false){m.remove();render()}};
 };draw();
}

/* ---- Ventes ---- */
/* ---- Ventes & clients : clients enrichis, réservations, créances âgées, relances (même organisation qu'AvicoSuite) ---- */
const CLIENT_TYPES=[["restaurant","Restaurant"],["grossiste","Grossiste"],["particulier","Particulier"],["hotel","Hôtel / traiteur"],["boutique","Boutique / supérette"],["autre","Autre"]];
const PAIE=[["comptant","Comptant",0],["credit15","Crédit 15 jours",15],["credit30","Crédit 30 jours",30]];
const clientType=t=>{const x=CLIENT_TYPES.find(c=>c[0]===t||c[1].toLowerCase()===String(t||"").toLowerCase());return x?x[1]:(t||"—")};
const delaiClient=c=>{const p=PAIE.find(x=>x[0]===(c&&c.paie));return p?p[2]:S.settings.delai_creance};
const echV=v=>v.echeance||addDays(v.date,delaiClient(by(S.clients,v.client_id)));
const retardV=v=>diffDays(today(),echV(v));
function migrerVentes(){if(!S.reservations)S.reservations=[];S.clients.forEach(c=>{if(c.type){const x=CLIENT_TYPES.find(t=>t[1].toLowerCase()===String(c.type).toLowerCase());if(x)c.type=x[0]}})}
const creancesOuvertes=()=>S.ventes.filter(v=>v.statut==="valide"&&soldeVente(v)>0).sort((a,b)=>echV(a).localeCompare(echV(b)));
function aging(L){const b={nonEchu:0,j30:0,j60:0,j90:0};L.forEach(v=>{const j=retardV(v),r=soldeVente(v);if(j<=0)b.nonEchu+=r;else if(j<=30)b.j30+=r;else if(j<=60)b.j60+=r;else b.j90+=r});return b}
function relanceTexte(v){const c=tiers("c",v.client_id),r=retardV(v);return "Bonjour "+c.nom+",\nRappel : la facture "+v.numero+" du "+fd(v.date)+" ("+fcfa(v.total)+") présente un solde de "+fcfa(soldeVente(v))+(r>0?", échu depuis "+r+" jour(s)":" à régler avant le "+fd(echV(v)))+".\nMerci de régulariser. — "+rapCfg().nom}
function relancer(vid,canal){
 need("relance");const v=by(S.ventes,vid);if(!v||v.statut!=="valide"||soldeVente(v)<=0)throw new Error("Facture introuvable ou déjà soldée.");
 if(canal!=="whatsapp"&&canal!=="email")throw new Error("Canal invalide.");const c=tiers("c",v.client_id);
 if(canal==="whatsapp"&&!String(c.tel||"").replace(/\D/g,""))throw new Error("Numéro de téléphone du client manquant.");if(canal==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email||""))throw new Error("Email du client manquant ou invalide.");
 (v.relances||(v.relances=[])).push({date:today(),canal,par:ME.nom,montant:soldeVente(v)});audit("Relance client",v.numero+" "+canal);return{texte:relanceTexte(v),tel:c.tel,email:c.email};
}
const resaStatut=r=>r.statut==="active"&&r.expire&&r.expire<today()?"expiree":r.statut;
const reserveParProduit=excl=>{const o={};(S.reservations||[]).filter(r=>r.id!==excl&&resaStatut(r)==="active").forEach(r=>r.lignes.forEach(l=>{o[l.produit_id]=(o[l.produit_id]||0)+l.qte}));return o};
function resaCreer(f){
 need("vente");migrerVentes();const c=by(S.clients,f.client_id);if(!c)throw new Error("Client requis.");if(!f.date||f.date>today())throw new Error("Date invalide (ou dans le futur).");if(!f.expire||f.expire<f.date)throw new Error("Date de validité antérieure à la réservation.");
 const L=(f.lignes||[]).filter(l=>+l.qte>0&&l.produit_id).map(l=>{const p=by(S.produits,l.produit_id);if(!p||p.categorie!=="fini")throw new Error("Produit fini requis.");if(!(+l.pu>=0))throw new Error("Prix invalide.");return{produit_id:p.id,qte:+l.qte,pu:+l.pu}});if(!L.length)throw new Error("Ajouter au moins une ligne.");
 const r={id:uid("rs"),numero:seq("rs","RES"),date:f.date,expire:f.expire,client_id:c.id,lignes:L,note:f.note||"",statut:"active",par:ME.nom};S.reservations.push(r);audit("Réservation",r.numero+" "+c.nom);return r;
}
function resaAnnuler(id,motif){need("vente");const r=by(S.reservations||[],id);if(!r||resaStatut(r)!=="active")throw new Error("Réservation introuvable ou non active.");if(!String(motif||"").trim())throw new Error("Motif obligatoire.");r.statut="annulee";r.motif=motif;audit("Réservation annulée",r.numero+" : "+motif)}
function resaConvertir(id){
 need("vente");const r=by(S.reservations||[],id);if(!r)throw new Error("Réservation introuvable.");if(resaStatut(r)==="expiree")throw new Error("Réservation expirée.");if(r.statut!=="active")throw new Error("Réservation non active.");
 const v=creerVente({date:today(),client_id:r.client_id,lignes:r.lignes.map(l=>({type:"stock",produit_id:l.produit_id,qte:l.qte,pu:l.pu})),paye:0,mode:"especes"});r.statut="convertie";r.vente_id=v.id;audit("Réservation convertie",r.numero+" → "+v.numero);return v;
}
VB.clients=()=>{
 const C=S.clients.map(c=>{const V=S.ventes.filter(v=>v.client_id===c.id&&v.statut==="valide");return{c,n:V.length,ca:sum(V,v=>v.total-soldeVente(v)),dû:soldeClient(c.id)}});
 return `<div class="grid">${kpi(nf(C.length),"Clients")}${kpi(fcfa(sum(C,x=>x.ca)),"CA encaissé","o")}${kpi(fcfa(sum(C,x=>x.dû)),"Crédit ouvert","w")}${kpi(nf(sum(C,x=>x.n)),"Ventes (toutes périodes)")}</div><p class="flex">${can("tiers")?`<button class="btn" data-a="cr.add" data-id="clients">+ Client</button>`:""}${csvBtn("clients")}</p>`+

function ventesExtra(t){
 if(t==="r"){
  const R=(S.reservations||[]).slice().reverse(),rp=reserveParProduit();
  return `<div class="between"><h2 style="margin:0">Réservations de stock (${R.length})</h2>${can("vente")?`<button class="btn" data-a="rs.add">+ Réservation</button>`:""}</div><p class="mu sm">Stock promis à un client avant la vente ferme. Réservé actuellement : ${nf(sum(Object.values(rp),x=>x))} unité(s) sur ${Object.keys(rp).length} produit(s).</p>`+
   tbl(["N°","Date","Client","Produits","Valeur","Valable jusqu'au","Statut",""],R.map(r=>{const st=resaStatut(r);return tr([`<b>${esc(r.numero)}</b>`,fd(r.date),esc(tiers("c",r.client_id).nom),esc(r.lignes.map(l=>nf(l.qte,1)+" × "+prod(l.produit_id).nom).join(" · ")),fcfa(sum(r.lignes,l=>l.qte*l.pu)),fd(r.expire),badge({active:"Active",convertie:"Convertie",annulee:"Annulée",expiree:"Expirée"}[st],{active:"",convertie:"ok",annulee:"mu",expiree:"wa"}[st]),st==="active"&&can("vente")?`<div class="flex">${btn("rs.go",r.id,"→ Vente","ok")}${btn("rs.ann",r.id,"Annuler","er")}</div>`:r.vente_id?esc((by(S.ventes,r.vente_id)||{}).numero||""):""])}),{empty:"Aucune réservation."});
 }
 const L=creancesOuvertes(),b=aging(L),tot=sum(L,soldeVente),ret=L.filter(v=>retardV(v)>0),ven=L.filter(v=>{const j=retardV(v);return j<=0&&j>=-3}),ed=can("relance");
 const bk=[["Non échu",b.nonEchu,"ok"],["1 – 30 j",b.j30,"wa"],["31 – 60 j",b.j60,"wa"],["+ 60 j",b.j90,"er"]];
 return (ven.length?`<div class="card" style="border-color:var(--wa)"><b>⏰ Échéances à venir (J-3) — ${ven.length} facture(s) · ${fcfa(sum(ven,soldeVente))}</b>${ven.map(v=>`<div class="between sm" style="margin-top:8px"><span><b>${esc(v.numero)}</b> — ${esc(tiers("c",v.client_id).nom)} · ${retardV(v)===0?"échéance aujourd'hui":"dans "+(-retardV(v))+" j"}</span><span class="flex"><b>${fcfa(soldeVente(v))}</b>${ed?btn("cn.rel",v.id+":whatsapp","WhatsApp","ghost"):""}</span></div>`).join("")}</div>`:"")+
  `<div class="grid">${kpi(fcfa(tot),"Total à encaisser","e")}${kpi(fcfa(sum(ret,soldeVente)),"En retard","w")}${kpi(nf(L.length),"Factures ouvertes · "+ret.length+" en retard")}</div><div class="card"><b>Analyse d'ancienneté (aging)</b><div class="grid" style="margin:8px 0 0">${bk.map(([l,v,c])=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="font-size:17px;color:var(--${c==="ok"?"ok":c==="wa"?"wa":"er"})">${fcfa(v)}</div></div>`).join("")}</div></div><h2>Détail des créances</h2>`+
  tbl(["Facture","Client","Total","Payé","Reste dû","Avancement","Échéance","Relance",""],L.map(v=>{const c=tiers("c",v.client_id),r=retardV(v),reste=soldeVente(v),pct=Math.round((v.total-reste)/v.total*100),lr=(v.relances||[]).slice(-1)[0];return tr([`<b>${esc(v.numero)}</b><div class="mu sm">émise ${fd(v.date)}</div>`,`<b>${esc(c.nom)}</b><div class="mu sm">${esc(c.ville||"")}</div>`,fcfa(v.total),fcfa(v.total-reste),`<b style="color:var(--er)">${fcfa(reste)}</b>`,`<div class="progres" style="width:80px"><div style="width:${pct}%"></div></div><span class="mu sm">${pct} %</span>`,r>0?badge("⚠ +"+r+" j",r>60?"er":"wa"):badge("Éch. "+fd(echV(v)),"ok"),lr?`<span class="sm">${lr.canal==="whatsapp"?"WhatsApp":"Email"} le ${fd(lr.date)}</span>`:"—",`<div class="flex">${can("paiement")?btn("vt.pay",v.id,"Encaisser","ok"):""}${ed&&c.tel?btn("cn.rel",v.id+":whatsapp","WhatsApp","ghost"):""}${ed&&c.email?btn("cn.rel",v.id+":email","Email","ghost"):""}${btn("vt.print",v.id,"🖨","ghost")}${btn("vt.bl",v.id,"BL","ghost")}</div>`])}),{empty:"Aucune créance ouverte."});

function planArbre(P,pw){
 const ix=new Map(S.accounts.map(a=>[a.num,a])),kids=new Map(),par=new Map(),q=normTxt(P.q).trim();
 S.accounts.slice().sort((x,y)=>x.num<y.num?-1:x.num>y.num?1:0).forEach(a=>{const p=parentCode(a.num,n=>ix.has(n))||("C"+a.num[0]);par.set(a.num,p);if(!kids.has(p))kids.set(p,[]);kids.get(p).push(a)});
 const match=a=>a.num.startsWith(q)||normTxt(a.nom).includes(q)||(/^\d+$/.test(q)&&a.num.includes(q));
 let vis=null,nbm=0;
 if(q){vis=new Set();S.accounts.forEach(a=>{if(match(a)){nbm++;let c=a.num;vis.add(c);while(par.has(c)){c=par.get(c);vis.add(c)}}})}
 const lim=P.max||150,rows=[],eff=P._eff={};let more=false;

 const isOpen=n=>{const has=(kids.get(n)||[]).length>0;if(!has)return false;if(P.all||P.open[n]===1)return true;if(P.open[n]===0)return false;return !!vis&&kv(n).length>0};
 const line=(a,depth,isCls)=>{
  const key=isCls?a:a.num,hasK=(kids.get(key)||[]).length>0,op=isOpen(key);eff[key]=op;
  const tg=hasK?`<button class="btn sm ghost" data-a="pl.t" data-id="${esc(key)}" style="padding:0 7px">${op?"▾":"▸"}</button>`:`<span class="mu" style="padding:0 9px">·</span>`;
  if(isCls){rows.push(tr([`${tg} <b>Classe ${a[1]}</b>`,`<b>${esc(CLS_LIB[a[1]])}</b>`,badge("classe","mu"),"—",pw?btn("pl.add",a[1],"➕","ghost"):""]));return}
  const bd=[estImp(a)?badge("imputable","ok"):badge("regroupement","mu")];if(a.h)bd.push(badge("hérité","wa"));if(a.o==="a")bd.push(badge("ajouté","wa"));else if(a.o==="m")bd.push(badge("modifié","wa"));
  rows.push(tr([`<span style="padding-left:${depth*16}px">${tg} <b>${esc(a.num)}</b></span>`,q&&match(a)?`<mark>${esc(a.nom)}</mark>`:esc(a.nom),bd.join(" "),esc(compteNatLib(a)),pw?`<div class="flex">${btn("pl.add",a.num,"➕","ghost")}${btn("pl.edit",a.num,"✏️","ghost")}${btn("pl.del",a.num,"🗑","ghost")}</div>`:""]))};
 const walk=(key,depth)=>{const L=P.open[key]===1&&vis?kids.get(key)||[]:kv(key);for(const a of L){if(rows.length>=lim){more=true;return}line(a,depth,false);if(isOpen(a.num))walk(a.num,depth+1);if(more)return}};

  const cn="C"+c;if(vis&&!kv(cn).length)continue;
  if(rows.length>=lim){more=true;break}line(cn,0,true);if(isOpen(cn))walk(cn,1);if(more)break}
 return{rows,more,nbm,total:S.accounts.length};
}

function rgCpt(tok){
 const nm=(k,court)=>{try{const c=cdef(k);return court?esc(c):`<b>${esc(c)}</b> <span class="sm mu">${esc(cptNom(c)||"hors plan")}</span>`}catch(e){return `<span class="sm" style="color:var(--er)">${esc(DEF_CPT[k]?DEF_CPT[k][0]:k)} : non paramétré</span>`}};
 if(tok==="@treso")return "caisse "+nm("caisse",1)+" ou banque "+nm("banque",1)+" (selon le mode)";
 if(tok==="@achat")return [...new Set(Object.values(CPT_ACHAT))].map(k=>nm(k,1)).join(" · ")+" (selon la catégorie)";
 if(tok==="@charge")return [...new Set(Object.values(CHARGES).map(x=>x[1]))].map(k=>nm(k,1)).join(" · ")+" (selon la catégorie)";
 if(tok==="@bon")return "caisse / banque / contrepartie selon la nature du bon";
 if(tok==="@treso2")return "banque "+nm("banque",1)+" ↔ capital "+nm("capital",1)+" · emprunt "+nm("emprunt",1)+" · "+nm("produit_div",1);
 if(tok==="@manuel")return "comptes saisis (imputables uniquement)";
 if(tok==="@inverse")return "sens inverse de l'écriture annulée";
 return nm(tok);
}

async function login(id,mdp){
 const u=by(S.users,id);if(!u)return"Compte inconnu.";const t=S.tries[u.id]||{n:0,until:0};
 if(Date.now()<t.until)return"Compte bloqué "+stv("blocage_min")+" minute(s) (trop de tentatives).";if(!u.actif)return"Compte désactivé.";
 let r;try{r=await ANGELS_AUTH.connecter(u,mdp)}catch(e){return e.message}
 if(r.ok){
  if(r.legacy||u.chg){const ok=await ANGELS_AUTH.ouvrirChangement({titre:"Créez votre mot de passe",nom:u.nom,min:mdpMin(),obligatoire:true,intro:r.legacy?"Les codes PIN ne sont plus acceptés : choisissez un mot de passe personnel pour continuer.":"Votre mot de passe est temporaire : choisissez un mot de passe personnel pour continuer.",enregistrer:async n=>{await ANGELS_AUTH.appliquer(u,n,false);S.tries[u.id]={n:0,until:0};try{save()}catch(e){}}});if(!ok)return"Connexion annulée.";ouvrirSession(u,false);atomic(()=>audit("Mot de passe défini (première connexion)"),true);return null}
  ouvrirSession(u,false);return null}
 t.n++;if(t.n>=stv("tentatives_max")){t.until=Date.now()+stv("blocage_min")*6e4;t.n=0}S.tries[u.id]=t;try{save()}catch(e){}return"Utilisateur ou mot de passe incorrect.";
}
/* ---------- Connexion : présentation, accès par profil, couleurs du logiciel ---------- */
const THEMES=[["turquoise","Turquoise","#0e7490"],["bleu","Bleu","#1a3aa8"],["emeraude","Vert émeraude","#0f7b5f"],["orange","Orange énergie","#c9500a"],["violet","Violet","#6a32c9"],["or","Nuit & or","#15171d"]],THEME_DEF="emeraude";
const themeCur=()=>document.documentElement.dataset.theme||THEME_DEF;
const themeDots=()=>`<div class="themes" title="Couleur du logiciel">${THEMES.map(([k,t,c])=>`<button type="button" class="${themeCur()===k?"on":""}" style="background:${c}" data-a="theme" data-id="${k}" aria-label="${t}" title="${t}"></button>`).join("")}</div>`;
function setTheme(k){if(!THEMES.some(t=>t[0]===k))return;if(k===THEME_DEF)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=k;try{localStorage.setItem("angels_theme",k)}catch(e){}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue("--b").trim()}
A.theme=k=>{setTheme(k);render()};
const clkT=()=>new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}),clkD=()=>new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const clkBox=()=>`<div class="clkbox"><b class="clk" data-k="t">${clkT()}</b><span class="clk" data-k="d">${clkD()}</span></div>`;
setInterval(()=>{document.querySelectorAll(".clk").forEach(e=>{e.textContent=e.dataset.k==="t"?clkT():clkD()})},1000);
const hello=()=>{const h=new Date().getHours();return(h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir")+" "+esc(ME.nom.split(" ")[0])+" 👋"};
const welcome=(n,stats)=>`<div class="welcome"><div><h2>${hello()}</h2><div class="big">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} · ${n?n+" point(s) demandent votre attention":"tout est sous contrôle"}</div></div><div class="hl">${stats.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("")}</div></div>`;
const tourBox=(steps,note)=>demoOK()?`<div class="tour"><b>🎬 Visite guidée — 5 gestes pour voir l'essentiel</b><div class="steps">${steps.map(([v,t,d],i)=>`<button class="st" data-a="nav" data-id="${v}"><b>${i+1} · ${t}</b><small>${d}</small></button>`).join("")}</div><div class="mu sm" style="margin-top:8px">${note}</div></div>`:"";
const demoOK=()=>ANGELS_AUTH.demoOn()&&S.settings.acces_demo!==false;
const HERO=`<div class="hero-l"><div style="font-size:13px;letter-spacing:2px;opacity:.8">ANGEL'S GROUP</div><h1>Chaque lot suivi, chaque œuf compté, chaque franc tracé.</h1><p>Le logiciel de gestion de votre élevage avicole — du poussin à la vente.</p><ul><li><span class="i">🐔</span><div><b>Suivi quotidien des lots</b>Mortalité, aliment, eau, poids et ponte jour par jour.</div></li><li><span class="i">💉</span><div><b>Prophylaxie et délai d'attente</b>Calendrier vaccinal, traitements, vente bloquée si nécessaire.</div></li><li><span class="i">🥚</span><div><b>Couvoir et conditionnement</b>Œufs bruts, plateaux, cartons par calibre.</div></li><li><span class="i">🌽</span><div><b>Aliments et stock</b>Fabrication, coût moyen pondéré, inventaires.</div></li><li><span class="i">🧾</span><div><b>Ventes, créances et SYSCOHADA</b>Encaissements, relances, comptabilité en partie double.</div></li></ul><div class="sanix" style="margin-top:18px;font-size:12px;opacity:.85">Logiciel développé par <b>Sanix Africa Division Technologies</b> · Contact (WhatsApp) : +225 0779181075 / 0140017751</div></div>`;
function demoFill(b){const f=document.getElementById("lf");if(!f)return;const d=f.closest("details");if(d)d.open=true;f.u.value=b.dataset.id;(f.p||f.pin).value=ANGELS_AUTH.DEMO_MDP;document.querySelectorAll(".pcard").forEach(c=>c.classList.toggle("on",c===b));const s=f.querySelector("button:not(.aa-e)");if(s)s.focus()}
const DEMO_P=[["admin","🛡️","Administrateur","Tout voir et tout régler"],["direction","📊","Direction","Tableau de bord, validations"],["chef","🧑‍🌾","Chef d'exploitation","Lots, santé, couvoir"],["soigneur","🐔","Soigneur","Suivi quotidien, soins"],["magasinier","📦","Magasinier","Stock, achats, aliments"],["commercial","📞","Commercial","Ventes, clients"],["caissier","💰","Caissier","Encaissements, caisse"],["comptable","📒","Comptable","Comptabilité, états"]];
function ouvrirSession(u,demo){S.tries[u.id]={n:0,until:0};ME=u;try{sessionStorage.setItem("ag_me",u.id)}catch(x){}view="dash";atomic(()=>{audit(demo?"Connexion (accès démo)":"Connexion");dotationsAuto()},true)}
function loginHTML(){
 const act=S.users.filter(u=>u.actif),demo=demoOK(),cards=DEMO_P.map(([r,ic,t,d])=>{const u=act.find(x=>x.role===r);return u?`<button type="button" class="pcard" data-a="demoIn" data-id="${u.id}"><span class="ic">${ic}</span><span><b>${t}</b><small>${d}</small></span></button>`:""}).join("");
 const form=`<form id="lf" style="margin-top:8px"><label>Utilisateur<select name="u">${act.map(u=>`<option value="${u.id}">${esc(u.nom)} — ${esc(ROLES[u.role])}</option>`).join("")}</select></label><label style="margin-top:10px">Mot de passe<input name="p" type="password" autocomplete="current-password" required></label><p id="le" class="mu sm"></p><button class="btn" style="width:100%">Se connecter</button><p class="mu sm">Mot de passe oublié ? Demandez sa réinitialisation à l'administrateur.</p></form>`;
 return `<div class="login hero">${HERO}<div class="hero-r">${demo?`<div style="font-size:20px;font-weight:800;color:var(--b2)">Essayez sans rien installer</div><div class="mu sm">Choisissez un profil : utilisateur et mot de passe se remplissent, puis « Se connecter ».</div><div class="pcards">${cards}</div><details><summary class="mu sm" style="cursor:pointer">Connexion avec un mot de passe</summary>${form}<div class="al warn sm" style="margin-top:10px">Mot de passe de démonstration (tous les profils) : <b>Demo@Angels2026</b>.</div></details>`:`<div style="font-size:20px;font-weight:800;color:var(--b2)">Connexion</div><div class="mu sm">Saisissez votre mot de passe personnel.</div>${form}`}<div style="margin-top:14px"><div class="mu sm" style="margin-bottom:6px">Couleur du logiciel</div>${themeDots()}</div>${pwaBtn()?`<p style="margin-top:14px">${pwaBtn()}</p>`:""}<p class="mu sm" style="margin-top:10px"><a href="index.html">← Accueil ANGEL'S GROUP</a>${demo?" · 💡 Ouvrez un second onglet pour jouer un autre profil pendant que vous gérez.":""}</p></div></div>`;
}
A.demoIn=(id,t)=>demoFill(t);
A["demo.tg"]=()=>{if(atomic(()=>{need("param");S.settings.acces_demo=!demoOK();audit("Accès démo par profil",demoOK()?"activé":"désactivé")})!==false)render()};
function render(){
 try{ANGELS_ROLES.majRoles("agro",S,ROLES)}catch(e){}
 try{document.title=ORGRAW()+" — "+stv("org_activite")}catch(e){}
 const app=$("#app");
 if(!ME){
  app.innerHTML=loginHTML();
  $("#lf").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button"),u=e.target.u.value,p=e.target.p.value;b.disabled=true;$("#le").textContent="";const r=await login(u,p);if(r){$("#le").textContent=r;const l=$("#lf");if(l){l.p.value="";l.querySelector("button").disabled=false}}else render()};return;
 }
 const items=NAV.filter(showNav);if(!items.some(n=>n.v===view))view=items[0].v;
 let g="",nav="";items.forEach(n=>{if(n.g!==g){g=n.g;nav+=`<div class="gt">${esc(g)}</div>`}nav+=`<a data-a="nav" data-id="${n.v}" class="${n.v===view?"on":""}">${n.i} ${esc(n.l)}</a>`});
 let body;try{body=V[view]()}catch(e){body=`<div class="card"><b>Erreur d'affichage</b><p>${esc(e.message)}</p></div>`}
 app.innerHTML=`<div class="shell"><aside id="sb"><div class="brand">${"🐔 "+ORG()+"<small>"+ORGACT()+"</small>"}</div>${clkBox()}${nav}<a href="index.html">🏠 Hub groupe</a><div class="who">${esc(ME.nom)}<br><span class="mu">${esc(ROLES[ME.role])}</span><br>${pwaBtn()?pwaBtn()+"<br>":""}<div class="mu sm" style="margin-top:6px">Couleur</div>${themeDots()}<a data-a="mdp.me">Mon mot de passe</a><br><a data-a="out">Déconnexion</a></div></aside><main><button class="btn ghost burger" data-a="bg">☰ Menu</button>${body}</main></div>`;
 populateDatalistPlanComptable();
}
A.out=()=>{atomic(()=>audit("Déconnexion"),true);ME=null;try{sessionStorage.removeItem("ag_me")}catch(x){}render()};A.bg=()=>$("#sb").classList.toggle("open");
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||!S||t.tagName==="INPUT")return;const fn=A[t.dataset.a];if(fn){e.preventDefault();fn(t.dataset.id,t,e)}});
document.addEventListener("change",e=>{const t=e.target;if(!S||!t.dataset.f)return;const[k,p]=t.dataset.f.split(":");(UI.f[k]=UI.f[k]||{})[p]=t.value;render()});
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue&&!document.querySelector(".md")){try{S=JSON.parse(e.newValue);if(ME)ME=by(S.users,ME.id);if(ME&&!ME.actif)ME=null;render()}catch(x){}}});
/* ---------- PWA : installation, mise à jour, hors ligne ---------- */
let DEF=null,MAJ=false;
const estIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const installe=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pwaBtn=()=>installe()?"":(DEF||estIOS())?`<a data-a="pwa.inst">📲 Installer l'application</a>`:"";
A["pwa.inst"]=async()=>{if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()}else alert("Sur iPhone / iPad : ouvrir cette page dans Safari, toucher « Partager », puis « Sur l'écran d'accueil ».")};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEF=e;if(!document.querySelector(".md"))render()});
window.addEventListener("appinstalled",()=>{DEF=null;render()});
function barre(){
 let b=$("#pwaBar");
 if(!MAJ&&navigator.onLine){if(b)b.remove();return}
 if(!b){b=document.createElement("div");b.id="pwaBar";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:8px 12px;text-align:center;font-weight:600";document.body.appendChild(b)}
 if(MAJ){b.style.background="var(--b)";b.style.color="#fff";b.innerHTML="Nouvelle version disponible — <a href='#' id='pwaUp' style='color:#fff;text-decoration:underline'>recharger</a>";$("#pwaUp").onclick=ev=>{ev.preventDefault();location.reload()}}
 else{b.style.background="var(--wabg)";b.style.color="var(--wa)";b.textContent="Mode hors ligne — vos données restent enregistrées sur cet appareil"}
}
window.addEventListener("online",barre);window.addEventListener("offline",barre);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
 let avait=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(avait){MAJ=true;barre()}avait=true});
 window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
barre();
load();
try{const id=sessionStorage.getItem("ag_me");if(id){const u=by(S.users,id);if(u&&u.actif)ME=u}}catch(e){}
render();
ANGELS_SYNC.init({app:"agro",nom:"Agro",get:()=>S,persist:()=>save(),refresh:()=>render(),exclude:["tries"],qui:()=>ME?ME.nom:"poste"});
</script>
